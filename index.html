function linhasDe(fichaId){
  if (!S.admin.form[fichaId]) S.admin.form[fichaId] = { linhas: [{ sabor:"", qtd:1 }], editando:null, entrega:"", pagamento:"" };
  return S.admin.form[fichaId];
}
/* Lê o que está digitado antes de redesenhar, para não perder nada. */
function lerFormulario(fichaId){
  const f = linhasDe(fichaId);
  f.linhas.forEach((l, i) => {
    const cs = document.getElementById(`lc-sab-${fichaId}-${i}`);
    const cq = document.getElementById(`lc-qtd-${fichaId}-${i}`);
    if (cs) l.sabor = cs.value;
    if (cq) l.qtd = Math.max(1, parseInt(cq.value, 10) || 1);
  });
  const ce = document.getElementById("lc-ent-" + fichaId);
  const cp = document.getElementById("lc-pag-" + fichaId);
  const cf = document.getElementById("lc-forma-" + fichaId);
  if (ce) f.entrega = ce.value;
  if (cp) f.pagamento = cp.value;
  if (cf) f.forma = cf.value;
  return f;
}
function addLinha(fichaId){
  const f = lerFormulario(fichaId);
  f.linhas.push({ sabor:"", qtd:1 });
  render();
}
function removerLinha(fichaId, i){
  const f = lerFormulario(fichaId);
  f.linhas.splice(i, 1);
  if (f.linhas.length === 0) f.linhas.push({ sabor:"", qtd:1 });
  render();
}
function editarCompra(fichaId, compraId){
  const c = S.admin.compras.find(x => x.id === compraId);
  if (!c) return;
  const itens = Array.isArray(c.itens) && c.itens.length
    ? c.itens.map(i => ({ sabor: i.sabor || "", qtd: Number(i.quantidade) || 1 }))
    : [{ sabor: c.sabores || "", qtd: Number(c.quantidade) || 1 }];
  S.admin.form[fichaId] = {
    linhas: itens, editando: compraId,
    entrega: c.data_entrega || "", pagamento: c.data_pagamento || "",
    forma: c.forma_pagamento || "",
  };
  S.admin.fichaAberta = fichaId;
  render();
}

  S.admin.form[fichaId] = { linhas:[{ sabor:"", qtd:1 }], editando:null, entrega:"", pagamento:"" };
  render();
}
async function salvarCompra(fichaId){
  const f = lerFormulario(fichaId);
  const itens = f.linhas
    .filter(l => l.sabor.trim() !== "" || l.qtd > 0)
    .map(l => ({ sabor: l.sabor.trim() || "Não informado", quantidade: Math.max(1, l.qtd) }));
  if (itens.length === 0){ alert("Adicione ao menos um sabor."); return; }

  const total = itens.reduce((n, i) => n + i.quantidade, 0);
  const dados = {
    pre_cliente_id: fichaId, itens, quantidade: total,
    sabores: itens.map(i => `${i.quantidade}× ${i.sabor}`).join(", "),
    data_entrega: f.entrega || null, data_pagamento: f.pagamento || null,
    forma_pagamento: (f.forma || "").trim() || null,
  };

  const { error } = f.editando
    ? await sb.from("pre_compras").update(dados).eq("id", f.editando)
    : await sb.from("pre_compras").insert(dados);
  if (error){ avisarErro(error, "salvar o pedido na ficha"); return; }

  S.admin.form[fichaId] = { linhas:[{ sabor:"", qtd:1 }], editando:null, entrega:"", pagamento:"" };
  S.admin.fichaAberta = fichaId;
  await carregarAdmin(); render();
}

/* Status de um pedido antigo, deduzido das datas registradas.
   Sem data de pagamento, o pedido nunca passa de "Entregue". */
function statusAntigo(c){
  if (c.data_pagamento) return "Pagamento concluído";
  if (c.data_entrega)   return "Entregue";
  return "Pedido feito";
}

/* Junta o que veio da ficha com o que foi pedido na plataforma. */
function historicoCompleto(clienteId){
  const ficha = S.admin.fichas.find(f => f.vinculado_a === clienteId);
  const antigos = ficha
    ? S.admin.compras.filter(c => c.pre_cliente_id === ficha.id).map(c => ({
        origem: "ficha",
        data: c.data_entrega || c.data_pagamento || c.criado_em,
        cones: c.quantidade,
        itens: Array.isArray(c.itens) && c.itens.length
          ? c.itens.map(i => `${i.quantidade}× ${i.sabor}`).join(", ")
          : (c.sabores || `${c.quantidade} cone(s)`),
        status: statusAntigo(c),
        entrega: c.data_entrega, pagamento: c.data_pagamento,
        numero: null, total: null,
      }))
    : [];

  const meus = S.pedidos.filter(p => p.clienteId === clienteId).map(p => ({
    origem: "plataforma",
    data: p.criadoEm,
    cones: p.itens.reduce((n, i) => n + i.q, 0),
    itens: p.itens.map(i => `${i.q}× ${i.nome}`).join(", "),
    status: p.status,
    entrega: null, pagamento: null,
    numero: p.numero, total: p.total,
  }));

  return [...antigos, ...meus].sort((a, b) => new Date(b.data || 0) - new Date(a.data || 0));
}

/* Junta tudo que foi digitado como setor e separa o que não está na lista. */
async function atenderPedidoSenha(id){
  const { error } = await sb.from("pedidos_senha")
    .update({ atendido_em: new Date().toISOString() }).eq("id", id);
  if (error){ avisarErro(error, "marcar o pedido de senha como resolvido"); return; }
  await carregarAdmin(); render();
}

async function apagarSetor(indice){
  const fora = setoresForaDaLista();
  const alvo = fora[indice];
  if (!alvo) return;
  if (!confirm(`Remover o setor "${alvo.texto}" de todos os cadastros?\n\n` +
               `As pessoas ficam sem setor até informarem um novo pedido.`)) return;
  const { data, error } = await sb.rpc("limpar_setor", { p_texto: alvo.texto });
  if (error){ avisarErro(error, "remover o setor"); return; }
  await Promise.all([carregarAdmin(), carregarPedidos()]);
  render();
  alert(`Removido de ${data.perfis} perfil(is) e ${data.fichas} ficha(s).`);
}

async function vincularSetor(indice){
  const fora = setoresForaDaLista();
  const alvo = fora[indice];
  if (!alvo) return;
  const sel = document.getElementById("vs-" + indice);
  const destino = sel && sel.value;
  if (!destino){ alert("Escolha o setor de destino."); return; }
  if (!confirm(`Trocar "${alvo.texto}" por "${destino}" em todos os cadastros?`)) return;

  const { data, error } = await sb.rpc("corrigir_setor", { p_texto: alvo.texto, p_setor: destino });
  if (error){ avisarErro(error, "vincular o setor"); return; }
  await Promise.all([carregarAdmin(), carregarPedidos()]);
  render();
  alert(`Pronto: ${data.perfis} perfil(is) e ${data.fichas} ficha(s) atualizados para "${destino}".`);
}

function setoresForaDaLista(){
  const mapa = new Map();
  const somar = (texto, quem, origem) => {
    const t = String(texto || "").trim();
    if (!setorForaDaLista(t)) return;
    const chave = semAcentoMin(t);
    if (!mapa.has(chave)) mapa.set(chave, { texto: t, ocorrencias: 0, pessoas: new Map() });
    const reg = mapa.get(chave);
    reg.ocorrencias++;
    const nome = quem || "sem nome";
    if (!reg.pessoas.has(nome)) reg.pessoas.set(nome, new Set());
    reg.pessoas.get(nome).add(origem);
  };
  S.admin.clientes.forEach(c => somar(c.setor, c.nome, "perfil"));
  S.admin.fichas.forEach(f => somar(f.setor, f.nome, "ficha"));
  S.pedidos.forEach(p => {
    somar(p.local, p.cliente?.nome, "pedido #" + p.numero);
    if (p.presente) somar(p.destinatarioSetor, p.destinatario, "presente #" + p.numero);
  });
  return [...mapa.values()].sort((a, b) => b.ocorrencias - a.ocorrencias);
}

        <ul style="list-style:none;margin-top:.7rem;display:flex;flex-direction:column;gap:.35rem">

              background:var(--chantilly);border-radius:.5rem;padding:.4rem .6rem">
            <span class="badge b-esgotado" style="text-transform:none;font-size:.74rem">
              ${esc(f.texto)}</span>
            <span style="font-size:.78rem;flex:1">
              ${[...f.pessoas.entries()].map(([nome, origens]) =>
                `<strong>${esc(nome)}</strong> <span class="muted">(${esc([...origens].join(", "))})</span>`
              ).join(" · ")}
            </span>
            ${f.ocorrencias > 1 ? `<span class="muted" style="font-size:.72rem">${f.ocorrencias}×</span>` : ""}
            <span style="display:flex;gap:.3rem;align-items:center">
              <select id="vs-${fora.indexOf(f)}" class="field"
                style="padding:.25rem .5rem;font-size:.74rem;width:auto">
                <option value="">Vincular a...</option>
                ${SETORES.map(x => `<option value="${esc(x.nome)}">${esc(x.nome)}</option>`).join("")}
              </select>
              <button class="btn btn-primary" style="min-height:1.9rem;padding:.15rem .7rem;font-size:.72rem"
                onclick="vincularSetor(${fora.indexOf(f)})">Vincular</button>
              <button class="btn" style="background:var(--framboesa);color:#fff;min-height:1.9rem;
                padding:.15rem .6rem;font-size:.72rem"
                onclick="apagarSetor(${fora.indexOf(f)})">Excluir</button>
            </span>
          </li>`).join("")}
        </ul>
        ${fora.length > 6 ? `<button class="btn btn-ghost"
          style="margin-top:.5rem;min-height:2rem;padding:.2rem .8rem;font-size:.74rem"
          onclick="S.admin.setoresExpandidos=!S.admin.setoresExpandidos;render()">
          ${expandido ? "Mostrar menos" : `Ver todos os ${fora.length}`}</button>` : ""}
      </section>`;
    })()}
  </div>`;
}

/* Um cartão de ficha, com histórico de pedidos e formulário. */
function vFicha(f){
  const compras   = S.admin.compras.filter(c => c.pre_cliente_id === f.id);
  const aberta    = S.admin.fichaAberta === f.id;
  const editando  = S.admin.fichaEditando === f.id;
  const dono      = f.vinculado_a ? S.admin.clientes.find(c => c.id === f.vinculado_a) : null;
  const expandido = !!S.admin.pedidosExpandidos[f.id];
  const visiveis  = expandido ? compras : compras.slice(0, 5);
  const cones     = compras.reduce((n, c) => n + (c.quantidade || 0), 0);

  const trato = { m: "Masculino", f: "Feminino" }[f.genero] || "Neutro";

  return `<div class="card" style="padding:.75rem 1rem">
    <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <p style="font-weight:700;font-size:.9rem">${esc(f.nome)}</p>
        <p class="muted" style="font-size:.75rem">${esc(mascaraTelefone(f.telefone || "sem WhatsApp"))}
          ${cones ? ` · 🍦 ${cones} cone(s)` : ""}</p>
      </div>

      ${f.recusas > 0 && !f.vinculado_a
        ? `<span class="badge b-esgotado" style="text-transform:none"
             title="Alguém se cadastrou com este WhatsApp e disse que não era esta pessoa.">
             ⚠️ recusou ${f.recusas > 1 ? f.recusas + "×" : ""}</span>` : ""}

      ${f.vinculado_a
        ? `<button class="badge b-classico" style="cursor:pointer" title="Ver a conta vinculada"
             onclick="verCliente('${f.vinculado_a}')">${esc(dono ? dono.nome : "conta ativa")} ↗</button>`
        : `<span class="badge b-novo">sem vínculo</span>`}

      <button class="btn btn-ghost" style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
        onclick="abrirFicha('${f.id}')">${aberta ? "Fechar" : "Detalhes"}</button>
      <button class="btn" style="background:var(--framboesa);color:#fff;min-height:2.1rem;
        padding:.25rem .8rem;font-size:.75rem" onclick="excluirFicha('${f.id}')">Excluir</button>
    </div>

    ${!aberta ? "" : `<div style="border-top:1px solid rgb(62 39 35/.08);margin-top:.75rem;padding-top:.75rem">

      ${editando ? `<div style="display:flex;flex-wrap:wrap;gap:.5rem;align-items:end">
        <label style="font-size:.72rem;font-weight:600;flex:1.5;min-width:9rem">Nome
          <input id="fe-nome-${f.id}" class="field" value="${esc(f.nome)}"
            style="padding:.4rem .6rem;display:block;margin-top:.15rem"></label>
        <label style="font-size:.72rem;font-weight:600;flex:1.2;min-width:9rem">WhatsApp
          <input id="fe-tel-${f.id}" class="field" type="tel" maxlength="16"
            value="${esc(mascaraTelefone(f.telefone || ""))}" placeholder="(11) 9 9999-9999"
            oninput="aoDigitarTelefone(this)"
            style="padding:.4rem .6rem;display:block;margin-top:.15rem"></label>
        <label style="font-size:.72rem;font-weight:600;flex:1;min-width:8rem">Setor
          ${campoComLista(`fe-setor-${f.id}`, { valor: f.setor || "", placeholder:"Ex: TI",
            opcoes: SETORES.map(x => ({ rotulo: x.nome })), permitirNovo:true })}</label>
        <label style="font-size:.72rem;font-weight:600;min-width:7rem">Trato no cartão
          <select id="fe-genero-${f.id}" class="field"
            style="padding:.4rem .6rem;display:block;margin-top:.15rem">
            <option value="" ${!f.genero?"selected":""}>Neutro</option>
            <option value="m" ${f.genero==="m"?"selected":""}>Masculino</option>
            <option value="f" ${f.genero==="f"?"selected":""}>Feminino</option>
          </select></label>
        <button class="btn btn-primary" style="min-height:2.1rem;padding:.25rem .9rem;font-size:.75rem"
          onclick="salvarDadosFicha('${f.id}')">Salvar</button>
        <button class="btn btn-ghost" style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
          onclick="editarFicha('${f.id}')">Cancelar</button>
      </div>`
      : `<dl class="dados-grade">
          <div class="dado"><dt>Nome</dt><dd>${esc(f.nome)}</dd></div>
          <div class="dado"><dt>WhatsApp</dt><dd>${esc(mascaraTelefone(f.telefone || "—"))}</dd></div>
          <div class="dado"><dt>Setor</dt><dd>${esc(f.setor || "—")}</dd></div>
          <div class="dado"><dt>Trato no cartão</dt><dd>${trato}</dd></div>
          <div class="dado destaque"><dt>Cones consumidos</dt><dd>${cones}</dd></div>
          <div class="dado"><dt>Pedidos</dt><dd>${compras.length}</dd></div>
        </dl>
        <button class="btn btn-ghost" style="margin-top:.6rem;min-height:2rem;padding:.2rem .8rem;font-size:.74rem"
          onclick="editarFicha('${f.id}')">Editar dados</button>`}

      <p style="font-weight:700;font-size:.8rem;margin-top:1rem">Pedidos</p>
      ${compras.length === 0
        ? `<p class="muted" style="font-size:.75rem;margin-top:.25rem">
             Nenhum pedido. Use a aba <strong>Pedidos</strong> para lançar.</p>`
        : `<ul style="list-style:none;margin-top:.5rem;display:flex;flex-direction:column;gap:.4rem">
            ${visiveis.map(c => {
              const itens = Array.isArray(c.itens) && c.itens.length
                ? c.itens.map(i => `${i.quantidade}× ${esc(i.sabor)}`).join(", ")
                : esc(c.sabores || `${c.quantidade} cone(s)`);
              return `<li style="display:flex;gap:.5rem;align-items:start;font-size:.78rem;
                  background:var(--chantilly);border-radius:.6rem;padding:.5rem .65rem">
                <span style="flex:1">
                  <strong>${c.quantidade} cone(s)</strong> · ${itens}
                  <span class="muted" style="display:block;font-size:.72rem;margin-top:.15rem">
                    ${dataBrCurta(c.data_entrega) ? "entrega " + dataBrCurta(c.data_entrega) : "sem data"}
                    ${dataBrCurta(c.data_pagamento) ? " · pago em " + dataBrCurta(c.data_pagamento)
                                                     : " · pagamento pendente"}
                    ${c.forma_pagamento ? " · " + esc(c.forma_pagamento) : ""}
                    ${c.valor_centavos ? " · " + reais(c.valor_centavos) : ""}
                  </span>
                </span>
                <button style="font-size:.72rem;font-weight:700;color:var(--cacau);text-decoration:underline"
                  onclick="S.adminTab='pedidos';editarPedidoFicha('${c.id}')">editar</button>
              </li>`;
            }).join("")}
          </ul>
          ${compras.length > 5 ? `<button class="btn btn-ghost"
            style="margin-top:.5rem;min-height:2rem;padding:.2rem .8rem;font-size:.74rem"
            onclick="verTodosPedidos('${f.id}')">
            ${expandido ? "Mostrar menos" : `Ver todos os ${compras.length} pedidos`}</button>` : ""}`}

      ${f.vinculado_a ? "" : `
      <p style="font-weight:700;font-size:.8rem;margin-top:1rem">Vincular a uma conta existente</p>
      <p class="muted" style="font-size:.72rem">
        Use quando a pessoa já criou conta com outro WhatsApp. Os cones do histórico viram carimbos.</p>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap">
        <select id="vinc-${f.id}" class="field" style="flex:1;min-width:11rem;padding:.4rem .6rem">
          <option value="">Escolha a conta...</option>
          ${S.admin.clientes.map(c => `<option value="${c.id}">${esc(c.nome)}${c.setor?" — "+esc(c.setor):""}</option>`).join("")}
        </select>
        <button class="btn btn-primary" style="min-height:2.1rem;padding:.25rem .9rem;font-size:.75rem"
          onclick="vincularFichaConta('${f.id}')">Vincular</button>
      </div>`}
    </div>`}
  </div>`;
}
function render(){
  if (S.carregando) {
    document.getElementById("app").innerHTML = vCarregando();
    iniciarAnimacaoCarregamento();
    return;
  }
  pararAnimacaoCarregamento();
  if (S.erroBanco)  { document.getElementById("app").innerHTML = vErroBanco();  return; }
  if (S.perfil?.admin) ligarTempoReal();
  if (S.perfil?.admin && S.view === "admin" && !S.admin.carregado) carregarAdmin().then(render);
  const views = { home:vHome, produto:vProduto, carrinho:vCarrinho, checkout:vCheckout,
    confirmado:vConfirmado, login:()=>vLogin(false), cadastro:vCadastro, conta:vConta,
    pedidos:vPedidos, fidelidade:vFidelidade, admin:vAdmin };
  if (S.view!=="produto") pqv = 1;
  // A animação de entrada só roda quando se muda de tela — trocar a
  // quantidade de um cone ou filtrar categoria não redesenha com efeito.
  const telaAtual = [S.view, S.param, S.view === "admin" ? S.adminTab : ""].join("|");
  const mudouDeTela = telaAtual !== render.ultimaTela;
  render.ultimaTela = telaAtual;

  const alvo = document.getElementById("app");
  alvo.classList.toggle("animar", mudouDeTela);
  alvo.innerHTML = (views[S.view]||vHome)();
  // as tags de setor precisam ser desenhadas depois que a tela existe
  if (document.getElementById("local-tags")) desenharSetores("local-tags", "local");
  if (document.getElementById("pr-setor-tags")) desenharSetores("pr-setor-tags", "pr-setor");
  if (document.getElementById("c-setor-tags")) desenharSetores("c-setor-tags", "c-setor");
  // o carrossel abre no cartão atual, com os completos à esquerda
  const carrossel = document.getElementById("fid-carrossel");
  if (carrossel){
    carrossel.scrollLeft = carrossel.scrollWidth;
    carrossel.onscroll = atualizarSetasCartoes;
    setTimeout(atualizarSetasCartoes, 60);
  }
  atualizarBotaoAdmin();
}
iniciar();
</script>
</body>
</html>
