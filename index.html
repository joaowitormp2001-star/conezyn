<style>

    --cacau:#3e2723; --cacau-claro:#5d4037;
    --casquinha:#c8955c; --casquinha-claro:#e8c79a;
    --chantilly:#fff9f2; --chantilly-esc:#f6ead9;
    --pistache:#7a9b76; --framboesa:#c94f5e;
    --radius:1.25rem; --shadow:0 4px 20px -6px rgb(62 39 35 / .12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--chantilly);color:var(--cacau);font-family:"Inter",system-ui,sans-serif;min-height:100dvh}
  .display{font-family:"Fraunces",Georgia,serif}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:.875rem;color:var(--cacau)}
  :focus-visible{outline:3px solid var(--casquinha);outline-offset:2px;border-radius:6px}
  .wrap{max-width:64rem;margin:0 auto;padding:0 1rem}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
  .carimbo{border:2px dashed currentColor;border-radius:9999px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;
       padding:.625rem 1.5rem;border-radius:9999px;font-size:.875rem;font-weight:600;transition:.15s}
  .btn-primary{background:var(--cacau);color:var(--chantilly)}
  .btn-primary:hover{background:var(--cacau-claro)}
  .btn-primary:disabled{background:rgb(62 39 35 / .3);cursor:not-allowed}
  .btn-ghost{border:1px solid rgb(62 39 35 / .2)}
  .btn-ghost:hover{background:var(--chantilly-esc)}
  .btn-verde{background:var(--pistache);color:#fff}
  .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.15rem .65rem;
         font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .b-classico{background:var(--chantilly-esc);color:var(--cacau)}
  .b-premium{background:var(--cacau);color:var(--casquinha-claro)}
  .b-novo{background:var(--pistache);color:#fff}
  .b-vendido{background:var(--cacau);color:var(--casquinha-claro)}
  .b-esgotado{background:var(--framboesa);color:#fff}
  .field{width:100%;border:1px solid rgb(62 39 35 / .15);background:var(--chantilly);
         border-radius:.75rem;padding:.75rem 1rem}
  .field::placeholder{color:rgb(62 39 35 / .4)}
  .label{font-size:.875rem;font-weight:600;display:block;margin-bottom:.25rem}
  .muted{color:rgb(62 39 35 / .55)}
  .stars{color:var(--casquinha);letter-spacing:-.05em}
  .stars .off{color:rgb(62 39 35 / .2)}
  header.loja{position:sticky;top:0;z-index:40;backdrop-filter:blur(8px);
    background:rgb(255 249 242 / .9);border-bottom:1px solid rgb(62 39 35 / .08)}
  header.loja .inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0}
  .logo{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.25rem;letter-spacing:-.02em}
  .logo .selo{width:2.5rem;height:2.5rem;display:grid;place-items:center;color:var(--casquinha);font-size:1.1rem}
  .cart-btn{position:relative;width:2.75rem;height:2.75rem;display:grid;place-items:center;
    border-radius:9999px;background:var(--cacau);color:var(--chantilly);font-size:1.1rem}
  .cart-count{position:absolute;top:-4px;right:-4px;width:1.25rem;height:1.25rem;display:grid;place-items:center;
    border-radius:9999px;background:var(--framboesa);color:#fff;font-size:.68rem;font-weight:700}
  .hero{position:relative;overflow:hidden;background:var(--cacau);color:var(--chantilly);
    border-radius:var(--radius);padding:2.5rem 1.5rem;box-shadow:var(--shadow)}
  .hero .big{position:absolute;right:-1.5rem;bottom:-2rem;font-size:10rem;opacity:.2;pointer-events:none}
  .hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;line-height:1.1;max-width:26rem;margin-top:1rem}
  .grid{display:grid;gap:1rem}
  @media(min-width:600px){.grid.c2{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.grid.c3{grid-template-columns:repeat(3,1fr)}
    .split{display:grid;grid-template-columns:1fr 20rem;gap:1.5rem;align-items:start}
    .split aside{position:sticky;top:6rem}}
  .pcard{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
  .pcard:hover{transform:translateY(-2px)}
  .pfoto{position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer}
  .pfoto-img{position:absolute;inset:0;display:grid;place-items:center;font-size:3.75rem;
    transition:transform .45s cubic-bezier(.2,.6,.3,1)}
  .pcard:hover .pfoto-img{transform:scale(1.08)}
  @media(prefers-reduced-motion:reduce){.pcard:hover .pfoto-img{transform:none}}
  .pfoto .tags{position:absolute;top:.5rem;left:.5rem;display:flex;flex-wrap:wrap;gap:.25rem}
  .pbody{display:flex;flex-direction:column;gap:.5rem;padding:1rem;flex:1}
  .chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem}
  .chip{flex-shrink:0;min-height:2.75rem;padding:0 1.25rem;border-radius:9999px;font-size:.875rem;font-weight:600;
    background:#fff;box-shadow:var(--shadow)}
  .chip[aria-selected="true"]{background:var(--cacau);color:var(--chantilly)}
  .stepper{display:inline-flex;align-items:center;gap:.25rem;border:1px solid rgb(62 39 35 / .15);
    border-radius:9999px;background:#fff}
  .stepper button{width:2.5rem;height:2.5rem;border-radius:9999px;font-size:1.1rem;font-weight:700}
  .stepper button:disabled{opacity:.3;cursor:not-allowed}
  .stepper span{width:1.5rem;text-align:center;font-size:.875rem;font-weight:700}
  .radio-opt{display:flex;align-items:center;flex-wrap:wrap;gap:.75rem;min-height:3rem;padding:.5rem 1rem;
    border-radius:.75rem;border:1px solid rgb(62 39 35 / .15);background:rgb(255 255 255 / .6);cursor:pointer}
  .radio-opt.on{border-color:var(--cacau);background:#fff}
  .radio-opt input[type=radio]{accent-color:var(--cacau)}
  .status{display:inline-flex;border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .st-Pedido_feito{background:var(--casquinha-claro);color:var(--cacau)}
  .st-Entregue{background:var(--cacau-claro);color:#fff}
  .st-Pagamento_concluído{background:var(--pistache);color:#fff}
  .st-Cancelado{background:var(--framboesa);color:#fff}
  header.admin{position:sticky;top:0;z-index:40;background:var(--cacau);color:var(--chantilly);
    border-bottom:1px solid rgb(62 39 35 / .1)}
  header.admin .inner{max-width:72rem;margin:0 auto;padding:.75rem 1rem}
  header.admin .row1{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  header.admin nav{display:flex;gap:.25rem;margin-top:.5rem}
  header.admin nav button{min-height:2.5rem;padding:.4rem 1rem;border-radius:9999px;font-size:.875rem;font-weight:600;color:rgb(255 249 242/.7)}
  header.admin nav button[aria-current]{background:var(--chantilly);color:var(--cacau)}
  .pill-pend{background:var(--casquinha);color:var(--cacau);border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .toast{position:fixed;right:1rem;bottom:5.5rem;z-index:60;width:min(24rem,calc(100% - 2rem));
    background:var(--cacau);color:var(--chantilly);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);
    animation:toastin .25s ease-out}
  @keyframes toastin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .switch{position:fixed;left:1rem;bottom:1rem;z-index:50;box-shadow:var(--shadow)}
  .alerta{background:rgb(201 79 94 / .1);color:var(--framboesa);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  .ok{background:rgb(122 155 118 / .15);color:var(--pistache);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  dl.linhas{display:flex;flex-direction:column;gap:.4rem;font-size:.875rem}
  dl.linhas>div{display:flex;justify-content:space-between}
  .total-row{border-top:1px solid rgb(62 39 35 / .1);padding-top:.5rem;margin-top:.25rem;
    font-size:1.25rem;font-weight:900}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-top:1.25rem}
  .stamps .s{aspect-ratio:1;display:grid;place-items:center;font-size:1.1rem;color:rgb(255 249 242 / .3)}
  .stamps .s.on{background:var(--casquinha);color:var(--cacau)}
  .dep-carousel{overflow:hidden;position:relative;padding:1rem 0;
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .dep-track{display:flex;gap:1rem;width:max-content;animation:marquee 45s linear infinite}
  .dep-carousel:hover .dep-track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - .5rem))}}
  .dep-card{width:18rem;flex-shrink:0;padding:1.25rem;transition:transform .2s ease}
  .dep-card:hover{transform:scale(1.04)}
  @media(prefers-reduced-motion:reduce){.dep-track{animation:none}.dep-carousel{overflow-x:auto;mask-image:none;-webkit-mask-image:none}}
  .cart-toast{position:fixed;top:1rem;right:1rem;z-index:70;width:min(20rem,calc(100% - 2rem));
    padding:1rem 1rem .85rem;animation:ct-in .3s ease-out}
  .cart-toast.out{animation:ct-out .35s ease-in forwards}
  .ct-close{position:absolute;top:.4rem;left:.4rem;width:1.85rem;height:1.85rem;border-radius:9999px;
    display:grid;place-items:center;font-size:.9rem;line-height:1;color:rgb(62 39 35/.55)}
  .ct-close:hover{background:rgb(62 39 35/.08);color:var(--cacau)}
  .ct-body{display:flex;gap:.75rem;align-items:center;padding-left:1.35rem}
  .ct-foot{display:flex;justify-content:flex-end;margin-top:.7rem}
  @keyframes ct-in{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes ct-out{to{transform:translateY(-16px);opacity:0}}
  .avatar{width:2.5rem;height:2.5rem;border-radius:9999px;object-fit:cover;flex-shrink:0;
    display:grid;place-items:center;background:var(--casquinha-claro);color:var(--cacau);
    font-size:.8rem;font-weight:700;letter-spacing:.02em}
  .avatar.lg{width:5rem;height:5rem;font-size:1.5rem}
  .back-btn{width:2.75rem;height:2.75rem;flex-shrink:0;display:grid;place-items:center;border-radius:9999px;
    border:1px solid rgb(62 39 35/.15);background:#fff;font-size:1.1rem;box-shadow:var(--shadow)}
  /* linha que ultrapassa a borda direita da tela e pode ser rolada */
  .bleed-row{margin-right:calc(50% - 50vw);overflow-x:auto;scroll-snap-type:x proximity;
    display:flex;gap:1rem;padding:.35rem 1rem 1rem .3rem}
  .bleed-row>*{scroll-snap-align:start}
  .sabor-card{width:15rem;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
    transition:transform .15s}
  .sabor-card:hover{transform:translateY(-2px)}
  .sabor-foto{aspect-ratio:4/3;position:relative;overflow:hidden;cursor:pointer}
  .sabor-foto-img{position:absolute;inset:0;display:grid;place-items:center;font-size:2.75rem;
    transition:transform .45s cubic-bezier(.2,.6,.3,1)}
  .sabor-card:hover .sabor-foto-img{transform:scale(1.08)}
  .av-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
  .av-card{width:min(100%,19rem);padding:1.15rem;display:flex;flex-direction:column}
  .modal-overlay{position:fixed;inset:0;z-index:80;background:rgb(62 39 35/.45);
    display:grid;place-items:center;padding:1rem;animation:ov-in .15s ease-out}
  @keyframes ov-in{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:26rem;max-height:82dvh;overflow-y:auto;padding:1.5rem}
  .rating-btn{display:inline-flex;align-items:center;gap:.35rem;border-radius:.5rem;text-align:left}
  .rating-btn:hover{text-decoration:underline}
  /* dica discreta ao lado do rótulo do campo */
  .dica{position:relative;display:inline-flex;vertical-align:middle;margin-left:.3rem}
  .dica-btn{width:1rem;height:1rem;border-radius:9999px;display:grid;place-items:center;
    font-size:.62rem;font-weight:800;line-height:1;color:rgb(62 39 35/.45);
    border:1px solid rgb(62 39 35/.3);background:transparent;cursor:help;transition:.15s}
  .dica:hover .dica-btn,.dica-btn:focus-visible{color:var(--cacau);border-color:var(--cacau)}
  .dica-bolha{position:absolute;bottom:calc(100% + .45rem);left:50%;transform:translateX(-50%);
    width:max-content;max-width:14rem;background:var(--cacau);color:var(--chantilly);
    padding:.5rem .7rem;border-radius:.6rem;font-size:.72rem;font-weight:400;line-height:1.35;
    text-align:left;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.15s;z-index:20;
    pointer-events:none}
  .dica-bolha::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--cacau)}
  .dica:hover .dica-bolha,.dica-btn:focus-visible+.dica-bolha{opacity:1;visibility:visible}
  @media(max-width:480px){.dica-bolha{left:0;transform:none}.dica-bolha::after{left:.6rem;transform:none}}
  /* ---------- Cartão fidelidade (arte conezyn) ---------- */
  .fid{
    /* roxo dessaturado: dá espaço para a cor de destaque respirar */
    --roxo:#4A3A6E;--roxo-esc:#332750;--roxo-claro:#5D4A87;
    /* Cor de destaque do cartão. Alternativas testadas, é só trocar a linha:
       --destaque:#EFB8C8;  rosé (em uso)
       --destaque:#D6C6F0;  lavanda clara — o mais harmônico com o roxo
       --destaque:#F6EDE0;  creme — o mais neutro, puxa o fundo do site */
    --destaque:#EFB8C8;--verde:#3FBF7F;
    font-family:"Montserrat",system-ui,sans-serif;
    position:relative;overflow:hidden;width:100%;max-width:30rem;margin-inline:auto;
    padding:2.1rem 1.6rem 2.3rem;
    border-radius:1.4rem;border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(158deg,var(--roxo-claro) 0%,var(--roxo) 48%,var(--roxo-esc) 100%);
    color:#fff;
    box-shadow:0 14px 34px -14px rgba(51,39,80,.6), inset 0 1px 0 rgba(255,255,255,.22)}
  .fid-onda{position:absolute;top:0;left:0;width:100%;height:5rem;pointer-events:none;z-index:0;opacity:.85}
  .fid-cone-bg{position:absolute;width:8rem;opacity:.4;pointer-events:none;color:var(--roxo-esc);z-index:0}
  .fid-cone-bg.e{left:-3rem;bottom:-2.5rem;transform:rotate(-12deg)}
  .fid-cone-bg.d{right:-3rem;bottom:-3rem;transform:rotate(14deg)}

  .fid-topo{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    gap:.55rem;font-weight:800;font-size:1rem}
  .fid-badge{background:var(--destaque);color:#332750;border-radius:.45rem;
    padding:.12rem .7rem;font-size:.85rem;font-weight:800;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
  .fid-titulo{position:relative;z-index:2;text-align:center;margin-top:.6rem;
    font-size:clamp(1.2rem,3vw,1.6rem);font-weight:400;line-height:1.15}
  .fid-titulo strong{font-weight:800;color:var(--destaque)}

  .fid-grade{position:relative;z-index:2;display:grid;
    grid-template-columns:repeat(5,minmax(0,4rem));justify-content:center;
    gap:1.15rem;margin:1.5rem auto 0}
  .fid-selo{aspect-ratio:1;width:100%;border-radius:9999px;background:#fff;
    display:grid;place-items:center;
    box-shadow:0 2px 6px -2px rgba(0,0,0,.35), inset 0 -2px 4px -2px rgba(74,58,110,.28)}
  .fid-selo svg{width:66%;height:66%}

  .fid::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;
    background:
      radial-gradient(120% 80% at 18% -10%, rgba(255,255,255,.18), transparent 55%),
      radial-gradient(90% 70% at 105% 115%, rgba(239,184,200,.16), transparent 60%),
      linear-gradient(160deg, rgba(255,255,255,.06) 0%, transparent 42%, rgba(0,0,0,.15) 100%)}
  .fid::after{content:"";position:absolute;left:-30%;top:-60%;width:55%;height:220%;
    pointer-events:none;z-index:1;transform:rotate(18deg);
    background:linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent)}

  @media(max-width:520px){
    .fid{padding:1.7rem 1rem 1.9rem}
    .fid-grade{grid-template-columns:repeat(5,minmax(0,3.1rem));gap:.7rem;margin-top:1.2rem}}
  /* lista de sugestões do presente */
  .sug-lista{list-style:none;position:absolute;z-index:20;left:0;right:0;margin-top:.35rem;
    background:var(--chantilly);border:1px solid rgb(62 39 35/.22);border-radius:.8rem;overflow:hidden;
    box-shadow:0 12px 26px -10px rgb(62 39 35/.35)}
  .sug-lista::before{content:"";display:block;height:3px;background:var(--casquinha)}
  .sug-item{display:block;width:100%;text-align:left;padding:.62rem .8rem;font-size:.85rem;
    background:transparent;transition:background .12s}
  .sug-item:hover,.sug-item:focus-visible{background:var(--chantilly-esc)}
  .sug-lista li + li .sug-item{border-top:1px solid rgb(62 39 35/.1)}
  .campo-senha{position:relative}
  .campo-senha .field{padding-right:2.8rem}
  .olho{position:absolute;right:.5rem;top:50%;transform:translateY(-50%);
    width:2rem;height:2rem;display:grid;place-items:center;border-radius:9999px;
    font-size:1rem;line-height:1;color:rgb(62 39 35/.5)}
  .olho:hover{background:rgb(62 39 35/.07);color:var(--cacau)}
  section{scroll-margin-top:6rem}
  footer{margin-top:4rem;border-top:1px solid rgb(62 39 35 / .08);padding:2rem 0;
    text-align:center;font-size:.75rem;color:rgb(62 39 35 / .5)}
</style>

<button class="btn btn-primary switch" id="switch-btn" onclick="toggleAdmin()">Painel admin</button>

<script>

   PREVIEW EM ARQUIVO ÚNICO — mesmas telas, tokens e engine do
   projeto Next.js. Estado em memória (dura a sessão da página):
   no projeto real isso é localStorage → Supabase.
   ============================================================ */

/* ============================================================
   CONEXÃO COM O SUPABASE
   A chave publishable é pública por design: quem protege os dados
   é o Row Level Security, que roda dentro do banco.
   ============================================================ */
/* ---------- Pix ----------
   Chave: o WhatsApp do vendedor. Confirme no seu banco que este

const PIX = {
  chave: "+5511996479452",
  nome: "Conezyn",
  cidade: "Sao Paulo",
  whatsapp: "5511996479452",
};

const SUPABASE_URL  = "https://cdywhgtznomqvhtzcnzk.supabase.co";
const SUPABASE_KEY  = "sb_publishable_AR2vWWr_u5NiVG-3ovWufg_ujH1fvhr";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Aparência dos sabores enquanto não houver foto no Storage. */
/* `pos` ajusta o enquadramento da foto de cada sabor.
   Menor = mostra mais o topo do cone. Padrão: "center 8%". */

  "ferrero-rocher":{ emoji:"🌰", grad:"linear-gradient(135deg,#7a5230,#3e2723)" },
  "kinder-bueno":  { emoji:"🤍", grad:"linear-gradient(135deg,#e8c79a,#c8955c)" },
  _padrao:         { emoji:"🍦", grad:"linear-gradient(135deg,#8d5a3b,#3e2723)" },
};

let PRODUTOS = [];     // preenchido pelo banco
let AVALIACOES = [];   // idem

const MIN_DEPOIMENTOS = 7;
const STATUS = ["Pedido feito","Entregue","Pagamento concluído"];   // fluxo normal
const STATUS_TODOS = [...STATUS, "Cancelado"];                       // + saída de emergência
let META_CARIMBOS = 10;
const MARCA = { logo: null };
const ANTECEDENCIA_MIN = 20;

/* ---------- Estado da sessão do navegador ---------- */
const S = {

/* Quantidade escolhida direto no card do catálogo. */
function qtdCard(id){
  const p = byId(id);
  const max = p ? p.estoque : 1;
  const v = S.qtdCard[id] || 1;
  return Math.max(1, Math.min(v, Math.max(max, 1)));
}
function mudarQtdCard(id, delta){
  const p = byId(id);
  const novo = qtdCard(id) + delta;
  S.qtdCard[id] = Math.max(1, Math.min(novo, p ? p.estoque : 1));
  render();
}

/* Mensagem de erro amigável (prompt, seção 40). */
function erroAmigavel(e){
  const m = String(e?.message || e || "");
  if (m) console.error("Erro bruto:", e);
  S.ultimoErro = m;
  if (/Database error saving new user/i.test(m))
    return "Não foi possível criar a conta. Verifique se este WhatsApp ou e-mail já foi usado.";
  if (/rate limit|only request this after|too many/i.test(m))
    return "Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.";
  if (/Signups not allowed|signup is disabled/i.test(m))
    return "O cadastro está desativado no painel do Supabase (Authentication → Providers).";
  if (/Email address .* invalid|invalid format/i.test(m))
    return "Este e-mail foi recusado pelo servidor. Tente outro endereço.";
  if (/confirm|not confirmed/i.test(m))
    return "Confirme seu e-mail antes de entrar.";
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/already registered|already been registered/i.test(m)) return "Já existe uma conta com este e-mail.";
  if (/Password should be/i.test(m)) return "A senha deve ter no mínimo 6 caracteres.";
  if (/duplicate key.*telefone/i.test(m)) return "Já existe uma conta com este WhatsApp.";
  if (/Estoque insuficiente|não está disponível|pedido está vazio|Horário inválido|local da entrega/i.test(m)) return m;
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique sua internet.";
  return "Não conseguimos concluir agora. Tente novamente em alguns instantes.";
}

/* ============================================================
   PIX — gera o "copia e cola" (BR Code) e o QR estático
   ============================================================ */
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
const semAcento = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\x20-\x7E]/g, "");
const campoEmv = (id, valor) => id + String(valor.length).padStart(2, "0") + valor;

function payloadPix({ valorCentavos = 0, txid = "***" } = {}){
  const gui = campoEmv("00", "BR.GOV.BCB.PIX") + campoEmv("01", PIX.chave);
  let p = campoEmv("00", "01");
  p += campoEmv("26", gui);
  p += campoEmv("52", "0000");
  p += campoEmv("53", "986");
  if (valorCentavos > 0) p += campoEmv("54", (valorCentavos / 100).toFixed(2));
  p += campoEmv("58", "BR");
  p += campoEmv("59", semAcento(PIX.nome).toUpperCase().slice(0, 25));
  p += campoEmv("60", semAcento(PIX.cidade).toUpperCase().slice(0, 15));
  p += campoEmv("62", campoEmv("05", String(txid).slice(0, 25)));
  p += "6304";
  return p + crc16(p);
}

function svgQr(texto, tamanho = 5){
  try {
    const qr = qrcode(0, "M");
    qr.addData(texto);
    qr.make();
    return qr.createSvgTag({ cellSize: tamanho, margin: 2 });
  } catch { return ""; }
}

function copiarPix(codigo, botao){
  navigator.clipboard.writeText(codigo).then(() => {
    const antes = botao.textContent;
    botao.textContent = "Copiado ✓";
    setTimeout(() => { botao.textContent = antes; }, 2000);
  }).catch(() => alert("Não foi possível copiar. Selecione o código manualmente."));
}

/* ---------- Engine de preços (espelho de src/lib/pricing/) ---------- */
function precificar(){
  const linhas = Object.entries(S.carrinho).filter(([,q])=>q>0).map(([id,q])=>{
    const p = byId(id);
    return { id, unit:p.unit, dupla:p.dupla, q };
  });
  const cones = linhas.reduce((s,l)=>s+l.q,0);
  const subtotal = linhas.reduce((s,l)=>s+l.unit*l.q,0);
  const somaDupla = linhas.reduce((s,l)=>s+l.dupla*l.q,0);
  let ajuste = 0, imparId = null;
  if (cones % 2 === 1){
    const m = linhas.reduce((min,l)=>{
      const d = l.unit - l.dupla;
      return d < min.d ? {d, id:l.id} : min;
    }, {d:Infinity, id:null});
    ajuste = m.d; imparId = m.id;
  }
  const total = somaDupla + ajuste;
  return {
    total, subtotal, economia: subtotal - total, cones,
    linhas: linhas.map(l => ({...l, efetivo: l.dupla*l.q + (l.id===imparId ? ajuste : 0)}))
  };
}

/* ============================================================
   TELEFONE / WHATSAPP
   Guardamos apenas os dígitos; a máscara é só apresentação.
   Para o Supabase Auth, o número vira um "apelido de e-mail"
   (ex.: 5511999998888@cones.local) — assim o cliente entra com
   WhatsApp e senha, sem SMS, sem código e sem custo.
   ============================================================ */
function digitos(v){ return String(v||"").replace(/\D/g, ""); }

function mascaraTelefone(v){
  const d = digitos(v).slice(0, 11);
  if (d.length <= 2)  return d.length ? "(" + d : "";
  if (d.length <= 6)  return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
/* Aplica a máscara enquanto o usuário digita, preservando o cursor no fim. */
function aoDigitarTelefone(input){
  const posFim = input.selectionStart === input.value.length;
  input.value = mascaraTelefone(input.value);
  if (posFim) input.setSelectionRange(input.value.length, input.value.length);
}
function telefoneValido(v){
  const d = digitos(v);
  return d.length === 10 || d.length === 11;
}
/* Identificador estável usado no Supabase Auth. */
function emailApelido(telefone){
  return "55" + digitos(telefone) + "@cones.local";
}

function iniciais(nome){
  const p = String(nome||"").trim().split(/\s+/).filter(Boolean);
  if (p.length===0) return "?";
  return (p.length>1 ? p[0][0]+p[p.length-1][0] : p[0][0]).toUpperCase();
}
function avatarHtml(nome, foto, lg=false){
  if (foto) return `<img class="avatar ${lg?"lg":""}" src="${foto}" alt="Foto de ${esc(nome)}">`;
  return `<span class="avatar ${lg?"lg":""}" role="img" aria-label="${esc(nome)}">${esc(iniciais(nome))}</span>`;
}
async function carregarFoto(input){
  const f = input.files && input.files[0];
  if (!f || !S.perfil) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  // nome fixo em webp: cada troca sobrescreve a anterior, sem acumular arquivos
  const caminho = `${S.perfil.id}/avatar.webp`;
  let blob;
  try { blob = await prepararImagem(f, 480, 0.85); }
  catch (e) { alert(erroAmigavel(e)); return; }
  const { error } = await sb.storage.from("avatares")
    .upload(caminho, blob, { upsert: true, contentType: "image/webp" });
  if (error){ alert(erroAmigavel(error)); return; }
  const { data } = sb.storage.from("avatares").getPublicUrl(caminho);
  const url = data.publicUrl + "?v=" + Date.now();   // evita cache da foto antiga
  await sb.from("profiles").update({ foto_url: url }).eq("id", S.perfil.id);
  S.perfil.foto = url;
  render();
}
async function removerFoto(){

/* ============================================================
   NOTIFICAÇÕES NATIVAS DO SISTEMA (prompt, seção 16.B)

const notifSuportado = () => typeof window!=="undefined" && "Notification" in window;

/* ---- PERSONALIZAÇÃO DA NOTIFICAÇÃO — edite só aqui ----
   {numero} {cliente} {total} {local} {quando} são substituídos automaticamente. */
const NOTIF_TEXTO = {
  icone: "/icon-192.png",                       // miniatura exibida na notificação
  titulo: "🍦 Novo pedido — Cones da Casa",
  corpo: "Pedido #{numero} · {cliente}\n{total} · Entrega: {local} · Receber: {quando}",
};
function montarTexto(modelo, dados){
  return String(modelo).replace(/\{(\w+)\}/g, (_, k) => dados[k] ?? "");
}
const notifPermissao = () => notifSuportado() ? Notification.permission : "unsupported";

function notifLog(msg){
  S.notif.log.unshift(new Date().toLocaleTimeString("pt-BR") + " — " + msg);
  S.notif.log = S.notif.log.slice(0, 6);
}
async function ativarNotificacoes(){
  if (!notifSuportado()){ notifLog("Este navegador não suporta notificações."); return render(); }
  destravarSom();
  if (Notification.permission === "denied"){
    notifLog("Permissão bloqueada pelo navegador — reative no cadeado da barra de endereço.");
    return render();
  }
  const r = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  S.notif.ativo = (r === "granted");
  notifLog(r === "granted" ? "Notificações ativadas." : "Permissão não concedida (" + r + ").");
  render();
}
function desativarNotificacoes(){
  S.notif.ativo = false;
  notifLog("Notificações desativadas neste painel (a permissão do navegador continua concedida).");
  render();
}
function notificarNativo({ titulo, corpo, tag, aoClicar }){
  if (!S.notif.ativo || notifPermissao() !== "granted") return false;
  try {
    const n = new Notification(titulo, {
      body: corpo,
      icon: NOTIF_TEXTO.icone,  // miniatura do cone (no macOS aparece ao lado do texto)
      badge: NOTIF_TEXTO.icone,
      tag,                      // substitui a anterior de mesma tag em vez de empilhar
      requireInteraction: true, // permanece na tela até ser fechada (Chrome/Edge)
      silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); if (aoClicar) aoClicar(); };
    if (S.notif.som) tocarAlerta();
    return true;
  } catch (e) {
    notifLog("Falha ao exibir a notificação: " + e.message);
    return false;
  }
}
/* Som curto gerado no próprio navegador — sem arquivo externo.
   Navegadores exigem uma interação anterior do usuário, por isso o destravamento. */
let audioCtx = null;
function destravarSom(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { /* sem áudio disponível */ }
}
function tocarAlerta(){
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [880, 1180].forEach((hz, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = hz; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t + i*0.16);
      g.gain.exponentialRampToValueAtTime(0.22, t + i*0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.16 + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + i*0.16); o.stop(t + i*0.16 + 0.16);
    });
  } catch { /* silencioso */ }
}
function testarNotificacao(atrasoSeg = 0){
  if (notifPermissao() !== "granted" || !S.notif.ativo){
    notifLog("Ative as notificações antes de testar.");
    return render();
  }
  const disparar = () => {
    const num = 1048 + Math.floor(Math.random()*50);
    const ok = notificarNativo({
      titulo: NOTIF_TEXTO.titulo,
      corpo: montarTexto(NOTIF_TEXTO.corpo, {
        numero: num, cliente: "Teste", total: "R$ 52,00", local: "TI", quando: "agora",
      }),
      tag: "teste-" + num,
      aoClicar: () => { S.adminTab = "pedidos"; nav("admin"); },
    });
    notifLog(ok ? "Notificação de teste enviada." : "Não foi possível enviar a notificação.");
    render();
  };
  if (atrasoSeg > 0){
    notifLog(`Teste agendado para ${atrasoSeg}s — troque de aba ou de aplicativo agora.`);
    render();
    setTimeout(disparar, atrasoSeg * 1000);
  } else disparar();
}
function setQtd(id, q){
  const p = byId(id);
  if (q<=0) delete S.carrinho[id];
  else S.carrinho[id] = Math.min(q, p.estoque);
  render();
}

function alternarPresente(ativo){
  S.presente = { ativo, termo:"", sugestoes:[], escolhido:null, setor:"", buscando:false };
  render();
}
let buscaTimer = null;

/* A lista de sugestões é desenhada SOZINHA, sem re-renderizar a tela.
   Chamar render() a cada tecla destruía o campo e tirava o foco. */
function desenharSugestoes(){
  const caixa = document.getElementById("pr-sugestoes");
  if (!caixa) return;
  const p = S.presente;

  if (p.buscando && p.sugestoes.length === 0){
    caixa.innerHTML = `<p class="muted" style="font-size:.72rem;margin-top:.3rem">procurando...</p>`;
    return;
  }
  if (p.sugestoes.length === 0){ caixa.innerHTML = ""; return; }

  caixa.innerHTML = `<ul class="sug-lista">
    ${p.sugestoes.map((d,i)=>`<li>
      <button type="button" class="sug-item"
        onmousedown="event.preventDefault()"
        onclick="escolherDestinatario(${i})">
        <strong>${esc(d.nome)}</strong>
        ${d.setor?`<span class="muted"> · 📍 ${esc(d.setor)}</span>`:""}
        ${d.origem==="conta"?`<span class="badge b-classico" style="margin-left:.3rem">tem conta</span>`:""}
      </button></li>`).join("")}
  </ul>`;
}

function buscarDestinatario(termo){
  const p = S.presente;
  p.termo = termo; p.escolhido = null;
  clearTimeout(buscaTimer);

  if (termo.trim().length < 3){
    p.sugestoes = []; p.buscando = false;
    return desenharSugestoes();
  }
  p.buscando = true;
  desenharSugestoes();

  buscaTimer = setTimeout(async () => {
    const alvo = termo.trim();
    const { data, error } = await sb.rpc("buscar_destinatarios", { p_termo: alvo });
    if (S.presente.termo.trim() !== alvo) return;   // o texto já mudou: descarta
    p.sugestoes = error ? [] : (data || []);
    p.buscando = false;
    desenharSugestoes();
  }, 350);
}

function escolherDestinatario(i){
  const d = S.presente.sugestoes[i];
  if (!d) return;
  S.presente.escolhido = d;
  S.presente.termo = d.nome;
  if (d.setor) S.presente.setor = d.setor;
  S.presente.sugestoes = [];

  const campoNome = document.getElementById("pr-nome");
  if (campoNome) campoNome.value = d.nome;
  const campoSetor = document.getElementById("pr-setor");
  if (campoSetor && d.setor) campoSetor.value = d.setor;
  desenharSugestoes();
}

async function recarregarPedidos(){

async function confirmarPedido(){
  const c = S.checkout;
  c.erro = null;
  if (!S.perfil){ S.voltarPara = "checkout"; return nav("login"); }
  if (!c.local.trim()){ c.erro = "Informe o local da entrega dentro da empresa."; return render(); }
  if (c.quando==="horario"){
    if (!/^\d{2}:\d{2}$/.test(c.hora)){ c.erro="Escolha um horário válido."; return render(); }
    const [h,m] = c.hora.split(":").map(Number);
    const alvo = new Date(); alvo.setHours(h,m,0,0);
    const diff = (alvo - new Date())/60000;
    if (diff < 0){ c.erro="Esse horário já passou. Escolha um horário mais tarde."; return render(); }
    if (diff < ANTECEDENCIA_MIN){ c.erro=`Precisamos de pelo menos ${ANTECEDENCIA_MIN} minutos para preparar seu pedido.`; return render(); }
  }

  const itens = Object.entries(S.carrinho)
    .filter(([,q]) => q > 0)
    .map(([produto_id, quantidade]) => ({ produto_id, quantidade }));
  if (itens.length === 0){ c.erro = "Seu carrinho está vazio."; return render(); }

  // A chave de idempotência nasce aqui: duplo clique não gera dois pedidos.
  if (!c.idem) c.idem = crypto.randomUUID();

  const pr = S.presente;
  if (pr.ativo){
    const nome = pr.escolhido ? pr.escolhido.nome : pr.termo.trim();
    if (nome.length < 2){ c.erro = "Informe para quem é o presente."; return render(); }
  }

  const { data, error } = await sb.rpc("place_order", {
    p_itens: itens,
    p_local: c.local.trim(),
    p_quando: c.quando === "agora" ? "agora" : c.hora,
    p_idempotency_key: c.idem,
    p_presente: !!pr.ativo,
    p_destinatario_nome: pr.ativo ? (pr.escolhido ? pr.escolhido.nome : pr.termo.trim()) : null,
    p_destinatario_setor: pr.ativo ? (pr.setor.trim() || null) : null,
    p_destinatario_id: pr.ativo && pr.escolhido ? pr.escolhido.id : null,
  });

  if (error){
    c.erro = erroAmigavel(error);
    c.idem = null;                      // permite nova tentativa
    await carregarCatalogo();           // reflete estoque que mudou
    return render();
  }

  const linha = Array.isArray(data) ? data[0] : data;
  S.carrinho = {};
  await Promise.all([carregarCatalogo(), carregarPedidos()]);
  nav("confirmado", linha.numero);
}

/* Campo de senha com botão de mostrar/ocultar. */
function campoSenha(id, extra = ""){
  return `<div class="campo-senha">
    <input id="${id}" class="field" type="password" minlength="6" ${extra}>
    <button type="button" class="olho" aria-label="Mostrar senha" title="Mostrar senha"
      onclick="alternarSenha('${id}', this)">👁</button>
  </div>`;
}
function alternarSenha(id, botao){
  const campo = document.getElementById(id);
  if (!campo) return;
  const oculta = campo.type === "password";
  campo.type = oculta ? "text" : "password";
  botao.textContent = oculta ? "🙈" : "👁";
  botao.setAttribute("aria-label", oculta ? "Ocultar senha" : "Mostrar senha");
  botao.setAttribute("title", oculta ? "Ocultar senha" : "Mostrar senha");
  campo.focus();
}

function emailValido(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(String(v||"").trim()); }

/* Ícone discreto ao lado do rótulo: mostra a explicação no hover

function dica(texto){
  return `<span class="dica">

/* ============================================================
   CADASTRO EM 4 ETAPAS
   1. WhatsApp  →  2. Confirmação da ficha (se houver)
   3. Nome e e-mail  →  4. Senha
   ============================================================ */
function trilha(n){
  const total = 4;
  return `<div class="etapas" role="progressbar" aria-valuenow="${n}" aria-valuemin="1" aria-valuemax="${total}"
      aria-label="Etapa ${n} de ${total}">
    ${Array.from({length: total}, (_, i) =>
      `<span class="etapa-bolha ${i < n ? "on" : ""}"></span>`).join("")}
  </div>
  <span class="etapa-num">Etapa ${n} de ${total}</span>`;
}

/* Etapa 1 — procura o WhatsApp na lista que o administrador cadastrou. */
async function etapaTelefone(){
  const c = S.cad;
  c.tel = document.getElementById("r-tel").value.trim();
  if (!telefoneValido(c.tel)){
    S.cadastroErro = "Digite o WhatsApp com DDD — 10 ou 11 dígitos.";
    return render();
  }
  S.cadastroErro = null; c.checando = true; render();

  const [pre, uso] = await Promise.all([
    sb.rpc("consultar_precadastro", { p_telefone: c.tel }),
    sb.rpc("telefone_em_uso", { p_telefone: c.tel }),
  ]);
  c.checando = false;

  if (uso && uso.data === true){
    S.cadastroErro = "Este WhatsApp já pertence a uma conta. Use a opção Entrar, ou cadastre outro número.";
    return render();
  }

  const { data, error } = pre;
  const ficha = !error && Array.isArray(data) ? data[0] : null;
  if (ficha){ c.ficha = ficha; c.etapa = 2; }
  else { c.ficha = null; c.etapa = 3; }
  render();
}

/* Etapa 2 — a pessoa confirma (ou nega) que a ficha é dela. */
function confirmarFicha(sim){
  const c = S.cad;
  if (sim){
    c.nome = c.ficha.primeiro_nome;   // pré-preenchido, mas editável
  } else {
    c.ficha = null; c.nome = "";
  }
  c.etapa = 3;
  S.cadastroErro = null;
  render();
}

/* Etapa 3 — nome e e-mail. */
function etapaDados(){
  const c = S.cad;
  c.nome  = document.getElementById("r-nome").value.trim();
  c.email = document.getElementById("r-email").value.trim().toLowerCase();
  if (!c.nome){ S.cadastroErro = "Informe seu nome."; return render(); }
  if (!emailValido(c.email)){
    S.cadastroErro = "Digite um e-mail válido — é por ele que você recupera a senha.";
    return render();
  }
  S.cadastroErro = null; c.etapa = 4; render();
}

function voltarEtapa(){
  const c = S.cad;
  S.cadastroErro = null;
  if (c.etapa === 4) c.etapa = 3;
  else if (c.etapa === 3) c.etapa = c.ficha ? 2 : 1;
  else if (c.etapa === 2) c.etapa = 1;
  render();
}

async function fazerLogin(){
  if (S.ocupado) return;
  const email = document.getElementById("l-email").value.trim().toLowerCase();
  const senha = document.getElementById("l-senha").value;
  if (!email || !senha){ S.loginErro="Informe e-mail e senha."; return render(); }
  if (!emailValido(email)){ S.loginErro="Digite um e-mail válido."; return render(); }
  S.ocupado = true; S.loginErro = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  S.ocupado = false;
  if (error){ S.loginErro = erroAmigavel(error); return render(); }
  await carregarPerfil();
  await Promise.all([carregarPedidos(), carregarFidelidade()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}
async function recuperarSenha(){
  const email = document.getElementById("l-email").value.trim().toLowerCase();
  if (!emailValido(email)){
    S.loginErro = "Digite seu e-mail no campo acima para receber o link de recuperação.";
    return render();
  }
  S.loginErro = null;
  await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  alert("Se existir uma conta com " + email + ", enviaremos um link para redefinir a senha.\n\nConfira também a caixa de spam.");
}
async function fazerCadastro(){
  if (S.ocupado) return;
  const c = S.cad;
  const senha = document.getElementById("r-senha").value;
  const conf  = document.getElementById("r-conf").value;
  if (senha.length < 6){ S.cadastroErro = "A senha deve ter no mínimo 6 caracteres."; return render(); }
  if (senha !== conf){ S.cadastroErro = "As senhas não coincidem."; return render(); }

  S.ocupado = true; S.cadastroErro = null; render();
  const { error } = await sb.auth.signUp({
    email: c.email, password: senha,
    options: { data: { nome: c.nome, telefone: mascaraTelefone(c.tel) } },
  });
  S.ocupado = false;
  if (error){ S.cadastroErro = erroAmigavel(error); return render(); }

  const { data:{ session } } = await sb.auth.getSession();
  S.cad = { etapa:1, tel:"", nome:"", email:"", ficha:null, checando:false };
  if (!session){
    S.loginErro = "Conta criada! Confirme seu e-mail e depois entre.";
    return nav("login");
  }
  await carregarPerfil();
  await Promise.all([carregarPedidos(), carregarFidelidade()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}

  await sb.auth.signOut();

  nav("home");
}

/* Cone em SVG. `marca` aceita "mais" (+ laranja) ou "check" (✓ verde).
   Ambos levam contorno branco para destacar sobre o cone. */
function svgCone({ recheio="#A18D80", casquinha="#A18D80", marca=null } = {}){
  const cruz = "M -2 -7.5 H 2 V -2 H 7.5 V 2 H 2 V 7.5 H -2 V 2 H -7.5 V -2 H -2 Z";
  const tique = "M -6.5 0 L -2 4.8 L 6.8 -5";
  const enfeite =
    marca === "mais"
      ? `<g transform="translate(32 31)">
           <path d="${cruz}" fill="#EFB8C8" stroke="#fff" stroke-width="3.2"
                 stroke-linejoin="round" paint-order="stroke"/>
         </g>`
      : marca === "check"
      ? `<g transform="translate(29 23)">
           <path d="${tique}" fill="none" stroke="#fff" stroke-width="8.5"
                 stroke-linecap="round" stroke-linejoin="round"/>
           <path d="${tique}" fill="none" stroke="#3FBF7F" stroke-width="4.2"
                 stroke-linecap="round" stroke-linejoin="round"/>
         </g>`
      : "";
  return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <g transform="rotate(-28 24 24)">
      <path d="M24 6 L34 12 L25.6 41.4 Q24 44.4 22.4 41.4 L14 12 Z" fill="${casquinha}" opacity=".55"/>
      <ellipse cx="24" cy="10" rx="10.5" ry="5" fill="${recheio}"/>
    </g>
    ${enfeite}
  </svg>`;
}

/* Réplica em código do cartão físico da conezyn. */
function cartaoFidelidade(carimbos, nome){
  const noCartao  = carimbos % META_CARIMBOS;
  const completo  = carimbos > 0 && noCartao === 0;   // 10, 20, 30... = cartão fechado
  const cheios    = completo ? META_CARIMBOS : noCartao;

  const selos = Array.from({ length: META_CARIMBOS }, (_, i) => {
    const ultimo  = i === META_CARIMBOS - 1;
    const marcado = i < cheios;
    // o último círculo carrega a marca: + enquanto falta, ✓ quando completa
    const marca = ultimo ? (completo ? "check" : "mais") : null;
    return marcado
      ? `<span class="fid-selo">${svgCone({ recheio:"#4A3A6E", casquinha:"#4A3A6E", marca })}</span>`
      : `<span class="fid-selo">${ultimo ? svgCone({ marca }) : ""}</span>`;
  }).join("");

  return `<div class="fid" role="img" aria-label="Cartão fidelidade: ${cheios} de ${META_CARIMBOS} carimbos">
    <svg class="fid-onda" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 H400 V26 C330 58 300 6 232 22 C150 42 120 4 44 26 C28 31 12 32 0 30 Z" fill="#3A1267"/>
    </svg>
    <span class="fid-cone-bg e">${svgCone({ recheio:"currentColor", casquinha:"currentColor" })}</span>
    <span class="fid-cone-bg d">${svgCone({ recheio:"currentColor", casquinha:"currentColor" })}</span>

    <p class="fid-topo">${esc(nome || "Nome")} <span class="fid-badge">Coneiro</span></p>
    <p class="fid-titulo">Complete e ganhe <strong>um conezyn</strong></p>

    <div class="fid-grade">${selos}</div>
  </div>`;
}

const LOGO_WEBP = "marca/logo.webp";
const LOGO_SVG  = "marca/logo.svg";

async function enviarLogo(input){
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  const rotulo = document.getElementById("logo-rotulo");
  if (rotulo) rotulo.textContent = "Enviando...";
  try {
    // SVG é vetor: sobe do jeito que está, sem rasterizar.
    const ehSvg = /svg/i.test(f.type) || /\.svg$/i.test(f.name);
    if (ehSvg && f.size > 500 * 1024) throw new Error("O SVG precisa ter menos de 500 KB.");

    const corpo = ehSvg ? f : await prepararImagem(f, 400, 0.92);
    const caminho = ehSvg ? LOGO_SVG : LOGO_WEBP;
    const tipo = ehSvg ? "image/svg+xml" : "image/webp";

    const up = await sb.storage.from("produtos")
      .upload(caminho, corpo, { upsert: true, contentType: tipo });
    if (up.error) throw up.error;

    // remove o formato antigo, para não ficarem duas logos no Storage
    await sb.storage.from("produtos").remove([ehSvg ? LOGO_WEBP : LOGO_SVG]);

    const { data } = sb.storage.from("produtos").getPublicUrl(caminho);
    const url = data.publicUrl + "?v=" + Date.now();
    const { error } = await sb.from("settings")
      .upsert({ chave: "logo_url", valor: url }, { onConflict: "chave" });
    if (error) throw error;
    MARCA.logo = url;
    render();
  } catch (e) {
    alert(erroAmigavel(e));
    if (rotulo) rotulo.textContent = "Enviar logo";
  }
}

async function removerLogo(){
  if (!confirm("Voltar para a logo padrão?")) return;
  await sb.storage.from("produtos").remove([LOGO_WEBP, LOGO_SVG]);
  const { error } = await sb.from("settings").delete().eq("chave", "logo_url");
  if (error){ alert(erroAmigavel(error)); return; }
  MARCA.logo = null;
  render();
}

async function mudarStatus(id, status){
  const { error } = await sb.from("orders").update({ status }).eq("id", id);
  if (error){ alert(erroAmigavel(error)); return; }
  const p = S.pedidos.find(x => x.id === id);
  if (p) p.status = status;
  render();
  if (status === "Entregue" || status === "Cancelado"){
    await Promise.all([carregarCatalogo(), carregarFidelidade()]);
    render();
  }
}

async function enviarSugestao(){
  const campo = document.getElementById("sug");

  if (!S.perfil){ S.voltarPara = "home"; return nav("login"); }

let canalPedidos = null;
function ligarTempoReal(){
  if (canalPedidos || !S.perfil?.admin) return;
  canalPedidos = sb.channel("pedidos-admin")
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "orders" },
        async () => {
          const antes = new Set(S.pedidos.map(p => p.id));
          await carregarPedidos();
          const novo = S.pedidos.find(p => !antes.has(p.id));
          if (novo) notificarAdmin(novo);
          render();
        })
    .on("postgres_changes",
        { event: "UPDATE", schema: "public", table: "orders" },
        async () => { await carregarPedidos(); render(); })
    .subscribe();
}

    sb.from("reviews").select("*, products(nome), profiles(nome)").order("criado_em", { ascending:false }),
    sb.from("suggestions").select("*, profiles(nome, telefone)").order("criado_em", { ascending:false }),
    sb.from("clientes_admin").select("*").order("nome"),
    sb.from("fichas_admin").select("*").order("nome"),
    sb.from("pre_compras").select("*").order("data_entrega", { ascending:false }),
  ]);
  if (!prod.error) S.admin.produtos  = prod.data || [];
  if (!avs.error)  S.admin.avaliacoes = avs.data || [];
  if (!sug.error)  S.admin.sugestoes  = sug.data || [];
  if (!cli.error)  S.admin.clientes   = cli.data || [];
  if (!fic.error)  S.admin.fichas     = fic.data || [];
  if (!comp.error) S.admin.compras    = comp.data || [];
  S.admin.carregado = true;
}

/* Redimensiona e comprime no navegador antes de enviar.
   Foto de celular tem 3-5 MB; isso derruba o catálogo no 4G. */
function prepararImagem(file, maxLado = 1200, qualidade = 0.82){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("Falha ao processar a imagem")),
                "image/webp", qualidade);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("Arquivo de imagem inválido"));
    img.src = URL.createObjectURL(file);
  });
}

async function enviarFotoProduto(input, produtoId, slug){
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  const rotulo = document.getElementById("up-" + produtoId);
  if (rotulo) rotulo.textContent = "Enviando...";
  try {
    const blob = await prepararImagem(f);
    const caminho = `${slug}.webp`;
    const { error } = await sb.storage.from("produtos")
      .upload(caminho, blob, { upsert: true, contentType: "image/webp" });
    if (error) throw error;
    const { data } = sb.storage.from("produtos").getPublicUrl(caminho);
    await salvarCampoProduto(produtoId, "imagem_url", data.publicUrl + "?v=" + Date.now());
  } catch (e) {
    alert(erroAmigavel(e));
    if (rotulo) rotulo.textContent = "Enviar foto";
  }
}

async function removerFotoProduto(produtoId, slug){
  if (!confirm("Remover a foto deste sabor? Volta a aparecer o desenho padrão.")) return;
  // apaga o arquivo do Storage, não só a referência no banco
  await sb.storage.from("produtos").remove([`${slug}.webp`]);
  await salvarCampoProduto(produtoId, "imagem_url", null);
}

async function salvarCampoProduto(id, campo, valor){
  const { error } = await sb.from("products")
    .update({ [campo]: valor, atualizado_em: new Date().toISOString() }).eq("id", id);
  if (error){ alert(erroAmigavel(error)); return false; }
  const p = S.admin.produtos.find(x => x.id === id);
  if (p) p[campo] = valor;
  await carregarCatalogo();
  render();
  return true;
}
async function ajustarEstoque(id, delta){
  const p = S.admin.produtos.find(x => x.id === id);
  if (!p) return;
  await salvarCampoProduto(id, "estoque", Math.max(0, (p.estoque || 0) + delta));
}
async function definirEstoque(id, valor){
  const n = Math.max(0, parseInt(valor, 10) || 0);
  await salvarCampoProduto(id, "estoque", n);
}
async function definirPreco(id, campo, valorReais){
  const centavos = Math.round(parseFloat(String(valorReais).replace(",", ".")) * 100);
  if (!Number.isFinite(centavos) || centavos < 0){ alert("Valor inválido."); return; }
  const p = S.admin.produtos.find(x => x.id === id);
  const unit  = campo === "preco_unitario_centavos" ? centavos : p.preco_unitario_centavos;
  const dupla = campo === "preco_dupla_centavos"    ? centavos : p.preco_dupla_centavos;
  if (dupla > unit){ alert("O preço em dupla não pode ser maior que o unitário."); render(); return; }
  await salvarCampoProduto(id, campo, centavos);
}

/* ============================================================
   PAINEL — CLIENTES
   Duas origens: quem criou a própria conta e as fichas que você
   cadastrou. A ficha não é usuário: ela só espera a pessoa se
   cadastrar com o mesmo WhatsApp para ser reconhecida.
   ============================================================ */
async function salvarFicha(){
  const nome  = document.getElementById("f-nome").value.trim();
  const tel   = document.getElementById("f-tel").value.trim();
  const setor = document.getElementById("f-setor").value.trim();
  if (!nome || !telefoneValido(tel)){
    alert("Informe o nome e um WhatsApp com DDD."); return;
  }
  const { error } = await sb.from("pre_clientes")
    .insert({ nome, telefone: digitos(tel), setor: setor || null });
  if (error){
    alert(/duplicate|unique/i.test(error.message)
      ? "Já existe uma ficha com este WhatsApp." : erroAmigavel(error));
    return;
  }
  await carregarAdmin(); render();
}

async function excluirFicha(id){
  if (!confirm("Excluir esta ficha? O cliente não será mais reconhecido ao se cadastrar.")) return;
  const { error } = await sb.from("pre_clientes").delete().eq("id", id);
  if (error){ alert(erroAmigavel(error)); return; }
  await carregarAdmin(); render();
}

/* Importa várias fichas de uma vez.
   Uma por linha, no formato:  Nome ; WhatsApp ; Setor  */
async function importarFichas(){
  const txt = document.getElementById("f-lote").value.trim();
  if (!txt){ alert("Cole a lista antes de importar."); return; }
  const linhas = txt.split("\n").map(l => l.trim()).filter(Boolean);
  const fichas = [];
  const ruins = [];
  linhas.forEach((l, i) => {
    const partes = l.split(/[;\t|]/).map(p => p.trim());
    const nome = partes[0], tel = digitos(partes[1] || ""), setor = partes[2] || null;
    if (!nome || tel.length < 10) { ruins.push(`linha ${i+1}: ${l}`); return; }
    fichas.push({ nome, telefone: tel, setor });
  });
  if (fichas.length === 0){ alert("Nenhuma linha válida encontrada.\n\n" + ruins.join("\n")); return; }

  const { error } = await sb.from("pre_clientes").upsert(fichas, { onConflict: "telefone" });
  if (error){ alert(erroAmigavel(error)); return; }
  document.getElementById("f-lote").value = "";
  await carregarAdmin(); render();
  alert(`${fichas.length} ficha(s) importada(s).` +
        (ruins.length ? `\n\n${ruins.length} linha(s) ignorada(s):\n` + ruins.join("\n") : ""));
}

/* Clique num sabor: acrescenta ao campo e soma 1 na quantidade. */
function addSabor(fichaId, produtoId){
  const prod = byId(produtoId);
  const nome = prod ? prod.nome : "";
  if (!nome) return;
  const campo = document.getElementById("hc-sab-" + fichaId);
  const qtd   = document.getElementById("hc-qtd-" + fichaId);
  if (!campo) return;
  const atuais = campo.value.split(",").map(t => t.trim()).filter(Boolean);
  if (!atuais.includes(nome)) atuais.push(nome);
  campo.value = atuais.join(", ");
  if (qtd) qtd.value = Math.max(1, (parseInt(qtd.value, 10) || 0) + 1);
}

  const pendentes   = S.admin.fichas.filter(f => !f.vinculado_a);
  const vinculadas  = S.admin.fichas.filter(f =>  f.vinculado_a);

  return `<div style="display:flex;flex-direction:column;gap:1.5rem">
    <div>
      <h1 class="display" style="font-size:1.5rem;font-weight:900">Clientes</h1>
      <p class="muted" style="font-size:.875rem">
        ${cadastrados.length} com conta ativa · ${pendentes.length} ficha(s) aguardando cadastro ·
        ${vinculadas.length} ficha(s) já reconhecida(s)</p>
    </div>

    <section aria-labelledby="c-ativos">
      <h2 id="c-ativos" class="display" style="font-size:1.1rem;font-weight:700">Contas ativas</h2>
      ${cadastrados.length === 0
        ? `<p class="muted" style="margin-top:.5rem;font-size:.875rem">Nenhum cliente se cadastrou ainda.</p>`
        : `<div style="display:flex;flex-direction:column;gap:.6rem;margin-top:.75rem">
            ${cadastrados.map(c => `<div class="card" style="padding:.9rem 1rem;display:flex;flex-wrap:wrap;
                gap:.75rem;align-items:center">
              ${avatarHtml(c.nome, null)}
              <div style="flex:1;min-width:10rem">
                <p style="font-weight:700">${esc(c.nome)}
                  ${c.veio_de_pre_cadastro
                    ? `<span class="badge b-classico" style="margin-left:.35rem">reconhecido</span>` : ""}</p>
                <p class="muted" style="font-size:.75rem">${esc(c.telefone || "—")}
                  ${c.setor ? " · 📍 " + esc(c.setor) : ""}</p>
                <p class="muted" style="font-size:.72rem">${esc(c.email || "")}</p>
              </div>
              <div style="text-align:right;font-size:.78rem">
                <p><strong>${c.total_pedidos}</strong> pedido(s)</p>
                <p class="muted">${reais(c.total_gasto_centavos)}</p>
                <p style="color:var(--pistache);font-weight:700">${c.carimbos} carimbo(s)</p>
              </div>
            </div>`).join("")}
          </div>`}
    </section>

    <section aria-labelledby="c-fichas">
      <h2 id="c-fichas" class="display" style="font-size:1.1rem;font-weight:700">
        Fichas que você cadastrou</h2>
      <p class="muted" style="font-size:.8rem;margin-top:.25rem">
        Não são usuários. Quando a pessoa criar a conta com o mesmo WhatsApp,
        o site mostra o nome e o setor para ela confirmar.</p>

      <div class="card" style="padding:1rem;margin-top:.75rem">
        <p style="font-weight:700;font-size:.85rem">Adicionar uma ficha</p>
        <div style="display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.5rem">
          <input id="f-nome" class="field" style="flex:2;min-width:9rem" placeholder="Nome completo">
          <input id="f-tel" class="field" style="flex:1.4;min-width:9rem" type="tel" maxlength="16"
            placeholder="(11) 9 9999-9999" oninput="aoDigitarTelefone(this)">
          <input id="f-setor" class="field" style="flex:1.2;min-width:8rem" placeholder="Setor (ex: TI)">
          <button class="btn btn-primary" onclick="salvarFicha()">Adicionar</button>
        </div>

        <details style="margin-top:.9rem">
          <summary style="cursor:pointer;font-size:.82rem;font-weight:700">Importar vários de uma vez</summary>
          <p class="muted" style="font-size:.75rem;margin-top:.5rem">
            Uma pessoa por linha, separando com ponto e vírgula:<br>
            <code>Maria Silva; (11) 98888-7777; Comercial</code></p>
          <textarea id="f-lote" rows="5" class="field" style="margin-top:.5rem;resize:vertical"
            placeholder="Maria Silva; (11) 98888-7777; Comercial&#10;Carlos Souza; 11977776666; TI"></textarea>
          <button class="btn btn-ghost" style="margin-top:.5rem" onclick="importarFichas()">Importar lista</button>
        </details>
      </div>

      ${S.admin.fichas.length === 0
        ? `<p class="muted" style="margin-top:.75rem;font-size:.875rem">Nenhuma ficha cadastrada ainda.</p>`
        : `<div style="display:flex;flex-direction:column;gap:.5rem;margin-top:.75rem">
            ${S.admin.fichas.map(f => {
              const compras = S.admin.compras.filter(c => c.pre_cliente_id === f.id);
              const aberta = S.admin.fichaAberta === f.id;
              return `<div class="card" style="padding:.75rem 1rem">
              <div style="display:flex;gap:.75rem;align-items:center;flex-wrap:wrap">
                <div style="flex:1;min-width:0">
                  <p style="font-weight:700;font-size:.9rem">${esc(f.nome)}</p>
                  <p class="muted" style="font-size:.75rem">${esc(mascaraTelefone(f.telefone))}
                    ${f.setor ? " · 📍 " + esc(f.setor) : ""}
                    ${f.total_cones ? " · 🍦 " + f.total_cones + " cone(s)" : ""}</p>
                </div>
                ${f.vinculado_a
                  ? `<span class="badge b-classico">conta ativa</span>`
                  : `<span class="badge b-novo">aguardando</span>`}
                <button class="btn btn-ghost" style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
                  onclick="abrirFicha('${f.id}')">${aberta ? "Fechar" : "Detalhes"}</button>
                <button class="btn" style="background:var(--framboesa);color:#fff;min-height:2.1rem;
                  padding:.25rem .8rem;font-size:.75rem" onclick="excluirFicha('${f.id}')">Excluir</button>
              </div>

              ${aberta ? `<div style="border-top:1px solid rgb(62 39 35/.08);margin-top:.75rem;padding-top:.75rem">

                <p style="font-weight:700;font-size:.8rem">
                  Histórico de pedidos
                  ${f.total_cones ? `<span class="muted" style="font-weight:400">
                    — ${f.total_compras} pedido(s), ${f.total_cones} cone(s) no total</span>` : ""}</p>
                ${compras.length === 0
                  ? `<p class="muted" style="font-size:.75rem;margin-top:.25rem">Nenhuma registrada.</p>`
                  : `<ul style="list-style:none;margin-top:.4rem;display:flex;flex-direction:column;gap:.3rem">
                      ${compras.map(c => `<li style="display:flex;gap:.5rem;align-items:center;font-size:.78rem;
                          border-bottom:1px solid rgb(62 39 35/.06);padding-bottom:.3rem">
                        <span style="flex:1">
                          <strong>${c.quantidade} cone(s)</strong>
                          ${c.sabores ? " · " + esc(c.sabores) : ""}
                          <span class="muted">
                            ${c.data_entrega ? " · entrega " + new Date(c.data_entrega+"T12:00").toLocaleDateString("pt-BR") : ""}
                            ${c.data_pagamento ? " · pago " + new Date(c.data_pagamento+"T12:00").toLocaleDateString("pt-BR") : ""}
                          </span>
                        </span>
                        <button style="color:var(--framboesa);font-size:.72rem;font-weight:700"
                          onclick="excluirCompraFicha('${c.id}')">remover</button>
                      </li>`).join("")}
                    </ul>`}

                <p class="muted" style="font-size:.72rem;margin-top:.7rem">
                  Registrar um pedido antigo — clique nos sabores para preencher:</p>
                <div style="display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.35rem">
                  ${PRODUTOS.map(pr=>`<button class="btn btn-ghost"
                    style="min-height:1.8rem;padding:.1rem .55rem;font-size:.7rem"
                    onclick="addSabor('${f.id}','${pr.id}')">
                    ${pr.emoji} ${esc(pr.nome)}</button>`).join("")}
                </div>

                <div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem;align-items:end">
                  <label style="font-size:.72rem;font-weight:600">Cones
                    <input id="hc-qtd-${f.id}" class="field" type="number" min="1"
                      style="width:5rem;padding:.35rem .5rem;display:block;margin-top:.15rem"></label>
                  <label style="font-size:.72rem;font-weight:600;flex:1;min-width:8rem">Sabores
                    <input id="hc-sab-${f.id}" class="field" placeholder="Brigadeiro, Ferrero"
                      style="padding:.35rem .5rem;display:block;margin-top:.15rem"></label>
                  <label style="font-size:.72rem;font-weight:600">Entrega
                    <input id="hc-ent-${f.id}" class="field" type="date"
                      style="padding:.35rem .5rem;display:block;margin-top:.15rem"></label>
                  <label style="font-size:.72rem;font-weight:600">Pagamento
                    <input id="hc-pag-${f.id}" class="field" type="date"
                      style="padding:.35rem .5rem;display:block;margin-top:.15rem"></label>
                  <button class="btn btn-ghost" style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
                    onclick="addCompraFicha('${f.id}')">Registrar</button>
                </div>

                ${f.vinculado_a ? "" : `
                <p style="font-weight:700;font-size:.8rem;margin-top:1rem">Vincular a uma conta existente</p>
                <p class="muted" style="font-size:.72rem">
                  Use quando a pessoa já criou conta com outro WhatsApp. Os cones do histórico viram carimbos.</p>
                <div style="display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap">
                  <select id="vinc-${f.id}" class="field" style="flex:1;min-width:11rem;padding:.4rem .6rem">
                    <option value="">Escolha a conta...</option>
                    ${S.admin.clientes.map(c => `<option value="${c.id}">${esc(c.nome)}${c.setor?" — "+esc(c.setor):""}</option>`).join("")}
                  </select>
                  <button class="btn btn-primary" style="min-height:2.1rem;padding:.25rem .9rem;font-size:.75rem"
                    onclick="vincularFichaConta('${f.id}')">Vincular</button>
                </div>`}
              </div>` : ""}
            </div>`}).join("")}
          </div>`}
    </section>
  </div>`;
}

function render(){
  if (S.carregando) { document.getElementById("app").innerHTML = vCarregando(); return; }
  if (S.erroBanco)  { document.getElementById("app").innerHTML = vErroBanco();  return; }
  if (S.perfil?.admin) ligarTempoReal();
  if (S.perfil?.admin && S.view === "admin" && !S.admin.carregado) carregarAdmin().then(render);
  const views = { home:vHome, produto:vProduto, carrinho:vCarrinho, checkout:vCheckout,
    confirmado:vConfirmado, login:()=>vLogin(false), cadastro:vCadastro, conta:vConta,
    pedidos:vPedidos, fidelidade:vFidelidade, admin:vAdmin };
  if (S.view!=="produto") pqv = 1;
  document.getElementById("app").innerHTML = (views[S.view]||vHome)();
  const sw = document.getElementById("switch-btn");
  sw.style.display = S.perfil?.admin ? "inline-flex" : "none";
  sw.textContent = S.view==="admin" ? "← Ver loja" : "Painel admin";
}
iniciar();
</script>
</body>
</html>
