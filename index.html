<html lang="pt-BR">

<style>
  :root{
    --cacau:#3e2723; --cacau-claro:#5d4037;
    --casquinha:#c8955c; --casquinha-claro:#e8c79a;
    --chantilly:#fff9f2; --chantilly-esc:#f6ead9;
    --pistache:#7a9b76; --framboesa:#c94f5e;
    --radius:1.25rem; --shadow:0 4px 20px -6px rgb(62 39 35 / .12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--chantilly);color:var(--cacau);font-family:"Inter",system-ui,sans-serif;min-height:100dvh}
  .display{font-family:"Fraunces",Georgia,serif}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:.875rem;color:var(--cacau)}
  :focus-visible{outline:3px solid var(--casquinha);outline-offset:2px;border-radius:6px}
  .wrap{max-width:64rem;margin:0 auto;padding:0 1rem}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
  .carimbo{border:2px dashed currentColor;border-radius:9999px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;
       padding:.625rem 1.5rem;border-radius:9999px;font-size:.875rem;font-weight:600;transition:.15s}
  .btn-primary{background:var(--cacau);color:var(--chantilly)}
  .btn-primary:hover{background:var(--cacau-claro)}
  .btn-primary:disabled{background:rgb(62 39 35 / .3);cursor:not-allowed}
  .btn-ghost{border:1px solid rgb(62 39 35 / .2)}
  .btn-ghost:hover{background:var(--chantilly-esc)}
  .btn-verde{background:var(--pistache);color:#fff}
  .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.15rem .65rem;
         font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .b-classico{background:var(--chantilly-esc);color:var(--cacau)}
  .b-premium{background:var(--cacau);color:var(--casquinha-claro)}
  .b-novo{background:var(--pistache);color:#fff}
  .b-vendido{background:var(--cacau);color:var(--casquinha-claro)}
  .b-esgotado{background:var(--framboesa);color:#fff}
  .field{width:100%;border:1px solid rgb(62 39 35 / .15);background:var(--chantilly);
         border-radius:.75rem;padding:.75rem 1rem}
  .field::placeholder{color:rgb(62 39 35 / .4)}
  .label{font-size:.875rem;font-weight:600;display:block;margin-bottom:.25rem}
  .muted{color:rgb(62 39 35 / .55)}
  .stars{color:var(--casquinha);letter-spacing:-.05em}
  .stars .off{color:rgb(62 39 35 / .2)}
  header.loja{position:sticky;top:0;z-index:40;backdrop-filter:blur(8px);
    background:rgb(255 249 242 / .9);border-bottom:1px solid rgb(62 39 35 / .08)}
  header.loja .inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;
    padding:.75rem 1rem;max-width:64rem;margin:0 auto}
  @media(min-width:1024px){header.loja .inner{padding:.75rem 0}}
  /* barra de voltar, abaixo do cabeçalho */
  .barra-voltar{max-width:64rem;margin:0 auto;padding:.7rem 1rem 0}
  /* menu do perfil */
  .perfil-menu{position:absolute;right:0;top:calc(100% + .5rem);z-index:60;min-width:13rem;
    background:var(--chantilly);border:1px solid rgb(62 39 35/.18);border-radius:.9rem;overflow:hidden;
    box-shadow:0 14px 28px -12px rgb(62 39 35/.4)}
  .perfil-menu button{display:block;width:100%;text-align:left;padding:.7rem .9rem;font-size:.85rem;
    font-weight:600;background:transparent}
  .perfil-menu button:hover{background:var(--chantilly-esc)}
  .perfil-menu li + li button{border-top:1px solid rgb(62 39 35/.1)}
  .perfil-btn{position:relative;width:2.75rem;height:2.75rem;border-radius:9999px;overflow:hidden;
    display:grid;place-items:center;border:1px solid rgb(62 39 35/.2);background:#fff;color:var(--cacau)}
  .perfil-btn img{width:100%;height:100%;object-fit:cover}
  .ola-nome{font-size:.85rem;font-weight:700;margin-right:.15rem;white-space:nowrap}
  @media(max-width:520px){.ola-nome{display:none}}
  .logo{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.25rem;letter-spacing:-.02em}
  .logo .selo{width:2.5rem;height:2.5rem;display:grid;place-items:center;color:var(--casquinha);font-size:1.1rem}
  .cart-btn{position:relative;width:2.75rem;height:2.75rem;display:grid;place-items:center;
    border-radius:9999px;background:transparent;border:1px solid rgb(62 39 35/.2);
    color:var(--cacau);font-size:1.1rem}
  .cart-btn:hover{background:var(--chantilly-esc)}
  .cart-count{position:absolute;top:-4px;right:-4px;width:1.25rem;height:1.25rem;display:grid;place-items:center;
    border-radius:9999px;background:var(--framboesa);color:#fff;font-size:.68rem;font-weight:700}
  .hero{position:relative;overflow:hidden;background:var(--cacau);color:var(--chantilly);
    border-radius:var(--radius);padding:2.5rem 1.5rem;box-shadow:var(--shadow)}
  @media(max-width:700px){
    /* bloco mais alto no celular: a imagem desce e não encosta no título */
    .hero{padding-bottom:14rem}
  }
  /* faixa da promoção, enrolada no canto superior direito do bloco */
  /* A janela precisa ser maior que a faixa em toda a largura dela, senão
     a borda de baixo é cortada. As pontas saem pelo topo e pela direita. */
  .faixa-canto{position:absolute;top:0;right:0;width:13rem;height:10rem;overflow:hidden;
    pointer-events:none;z-index:3;border-top-right-radius:1.5rem}
  .faixa{position:absolute;top:1.7rem;right:-5rem;width:20rem;transform:rotate(35deg);
    background:linear-gradient(180deg,#F0C98A,var(--casquinha));color:var(--cacau);
    text-align:center;padding:.38rem 0 .42rem;
    box-shadow:0 6px 16px -8px rgb(0 0 0/.45), inset 0 1px 0 rgb(255 255 255/.5);
    display:flex;flex-direction:column;line-height:1.05}
  .faixa strong{font-family:var(--font-display);font-size:1rem;font-weight:900;letter-spacing:.01em}
  .faixa small{font-size:.6rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    opacity:.85}
  @media(max-width:700px){
    .faixa-canto{width:11rem;height:8rem}
    .faixa{top:1.3rem;right:-4rem;width:16rem;padding:.28rem 0 .32rem}
    .faixa strong{font-size:.85rem}
    .faixa small{font-size:.53rem;letter-spacing:.05em}}
  .hero .big{position:absolute;right:-1.5rem;bottom:-2rem;font-size:10rem;opacity:.2;pointer-events:none}
  /* imagem de destaque no canto inferior direito do bloco */
  .hero-img{position:absolute;right:-2rem;bottom:-2.5rem;width:min(34rem,64%);
    max-height:165%;object-fit:contain;object-position:bottom right;pointer-events:none;
    filter:drop-shadow(0 20px 34px rgb(0 0 0 / .38))}
  @media(max-width:700px){
    .hero-img{width:min(19rem,74%);right:-1.5rem;bottom:-1rem;max-height:14rem;opacity:.95}}
  .hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;line-height:1.1;max-width:26rem;margin-top:1rem}
  .grid{display:grid;gap:1rem}
  @media(min-width:600px){.grid.c2{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.grid.c3{grid-template-columns:repeat(3,1fr)}
    .split{display:grid;grid-template-columns:1fr 20rem;gap:1.5rem;align-items:start}
    .split aside{position:sticky;top:6rem}}
  .pcard{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
  .pcard:hover{transform:translateY(-2px)}
  .pfoto{position:relative;aspect-ratio:4/3;overflow:hidden;cursor:pointer}
  .pfoto-img{position:absolute;inset:0;display:grid;place-items:center;font-size:3.75rem;
    transition:transform .45s cubic-bezier(.2,.6,.3,1)}
  .pcard:hover .pfoto-img{transform:scale(1.08)}
  /* esgotado: foto em preto e branco, volta a cor ao passar o mouse */
  .pcard.esgotado .pfoto-img,
  .sabor-card.esgotado .sabor-foto-img{filter:grayscale(1)}
  .pcard.esgotado:hover .pfoto-img,
  .sabor-card.esgotado:hover .sabor-foto-img{filter:grayscale(0)}
  .btn-esgotado{background:transparent;border:1px solid rgb(62 39 35/.2);
    color:rgb(62 39 35/.45);cursor:not-allowed;font-weight:600}
  @media(prefers-reduced-motion:reduce){.pcard:hover .pfoto-img{transform:none}}
  .pfoto .tags{position:absolute;top:.5rem;left:.5rem;display:flex;flex-wrap:wrap;gap:.25rem}
  .pbody{display:flex;flex-direction:column;gap:.5rem;padding:1rem;flex:1}
  .chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem}
  .chip{flex-shrink:0;min-height:2.75rem;padding:0 1.25rem;border-radius:9999px;font-size:.875rem;font-weight:600;
    background:#fff;box-shadow:var(--shadow)}
  .chip[aria-selected="true"]{background:var(--cacau);color:var(--chantilly)}
  .stepper{display:inline-flex;align-items:center;gap:.25rem;border:1px solid rgb(62 39 35 / .15);
    border-radius:9999px;background:#fff}
  .stepper button{width:2.5rem;height:2.5rem;border-radius:9999px;font-size:1.1rem;font-weight:700}
  .stepper button:disabled{opacity:.3;cursor:not-allowed}
  .stepper span{width:1.5rem;text-align:center;font-size:.875rem;font-weight:700}
  .radio-opt{display:flex;align-items:center;flex-wrap:wrap;gap:.75rem;min-height:3rem;padding:.5rem 1rem;
    border-radius:.75rem;border:1px solid rgb(62 39 35 / .15);background:rgb(255 255 255 / .6);cursor:pointer}
  .radio-opt.on{border-color:var(--cacau);background:#fff}
  .radio-opt input[type=radio]{accent-color:var(--cacau)}
  .status{display:inline-flex;border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .st-Pedido_feito{background:var(--casquinha-claro);color:var(--cacau)}
  .st-Entregue{background:var(--cacau-claro);color:#fff}
  .st-Pagamento_concluído{background:var(--pistache);color:#fff}
  .st-Brinde{background:rgba(235,121,28,.16);color:#B4590F}
  .st-Cancelado{background:var(--framboesa);color:#fff}
  /* mesmo fundo claro do cabeçalho da loja, para a logo contrastar */
  header.admin{position:sticky;top:0;z-index:40;background:var(--chantilly);color:var(--cacau);
    border-bottom:1px solid rgb(62 39 35 / .12)}
  header.admin .inner{max-width:72rem;margin:0 auto;padding:.75rem 1rem}
  header.admin .row1{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  header.admin nav{display:flex;gap:.25rem;margin-top:.5rem}
  header.admin nav{overflow-x:auto;scrollbar-width:none}
  header.admin nav::-webkit-scrollbar{display:none}
  header.admin nav button{min-height:2.5rem;padding:.4rem 1rem;border-radius:9999px;font-size:.875rem;
    font-weight:600;color:rgb(62 39 35/.6);white-space:nowrap}
  header.admin nav button:hover{background:var(--chantilly-esc)}
  header.admin nav button[aria-current]{background:var(--cacau);color:var(--chantilly)}
  .pill-pend{background:var(--casquinha);color:var(--cacau);border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .toast{position:fixed;right:1rem;bottom:5.5rem;z-index:60;width:min(24rem,calc(100% - 2rem));
    background:var(--cacau);color:var(--chantilly);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);
    animation:toastin .25s ease-out}
  @keyframes toastin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .switch{position:fixed;left:1rem;bottom:1rem;z-index:50;box-shadow:var(--shadow)}
  .alerta{background:rgb(201 79 94 / .1);color:var(--framboesa);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  .ok{background:rgb(122 155 118 / .15);color:var(--pistache);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  dl.linhas{display:flex;flex-direction:column;gap:.4rem;font-size:.875rem}
  dl.linhas>div{display:flex;justify-content:space-between}
  .total-row{border-top:1px solid rgb(62 39 35 / .1);padding-top:.5rem;margin-top:.25rem;
    font-size:1.25rem;font-weight:900}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-top:1.25rem}
  .stamps .s{aspect-ratio:1;display:grid;place-items:center;font-size:1.1rem;color:rgb(255 249 242 / .3)}
  .stamps .s.on{background:var(--casquinha);color:var(--cacau)}
  .dep-carousel{overflow:hidden;position:relative;padding:1rem 0;
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .dep-track{display:flex;gap:1rem;width:max-content;animation:marquee 45s linear infinite}
  .dep-carousel:hover .dep-track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - .5rem))}}
  .dep-card{width:18rem;flex-shrink:0;padding:1.25rem;transition:transform .2s ease}
  .dep-card:hover{transform:scale(1.04)}
  @media(prefers-reduced-motion:reduce){.dep-track{animation:none}.dep-carousel{overflow-x:auto;mask-image:none;-webkit-mask-image:none}}
  .cart-toast{position:fixed;top:1rem;right:1rem;z-index:70;width:min(20rem,calc(100% - 2rem));
    padding:1rem 1rem .85rem;animation:ct-in .3s ease-out}
  .cart-toast.out{animation:ct-out .35s ease-in forwards}
  .ct-close{position:absolute;top:.4rem;left:.4rem;width:1.85rem;height:1.85rem;border-radius:9999px;
    display:grid;place-items:center;font-size:.9rem;line-height:1;color:rgb(62 39 35/.55)}
  .ct-close:hover{background:rgb(62 39 35/.08);color:var(--cacau)}
  .ct-body{display:flex;gap:.75rem;align-items:center;padding-left:1.35rem}
  .ct-foot{display:flex;justify-content:flex-end;margin-top:.7rem}
  @keyframes ct-in{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes ct-out{to{transform:translateY(-16px);opacity:0}}
  .avatar{width:2.5rem;height:2.5rem;border-radius:9999px;object-fit:cover;flex-shrink:0;
    display:grid;place-items:center;background:var(--casquinha-claro);color:var(--cacau);
    font-size:.8rem;font-weight:700;letter-spacing:.02em}
  .avatar.lg{width:5rem;height:5rem;font-size:1.5rem}
  .back-btn{width:2.75rem;height:2.75rem;flex-shrink:0;display:grid;place-items:center;border-radius:9999px;
    border:1px solid rgb(62 39 35/.15);background:#fff;font-size:1.1rem;box-shadow:var(--shadow)}
  /* linha que ultrapassa a borda direita da tela e pode ser rolada */
  .bleed-row{margin-right:calc(50% - 50vw);overflow-x:auto;scroll-snap-type:x proximity;
    display:flex;gap:1rem;padding:.35rem 1rem 1rem .3rem}
  .bleed-row>*{scroll-snap-align:start}
  .sabor-card{width:15rem;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
    transition:transform .15s}
  .sabor-card:hover{transform:translateY(-2px)}
  .sabor-foto{aspect-ratio:4/3;position:relative;overflow:hidden;cursor:pointer}
  .sabor-foto-img{position:absolute;inset:0;display:grid;place-items:center;font-size:2.75rem;
    transition:transform .45s cubic-bezier(.2,.6,.3,1)}
  .sabor-card:hover .sabor-foto-img{transform:scale(1.08)}
  .av-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
  .av-card{width:min(100%,19rem);padding:1.15rem;display:flex;flex-direction:column}
  .modal-overlay{position:fixed;inset:0;z-index:80;background:rgb(62 39 35/.45);
    display:grid;place-items:center;padding:1rem;animation:ov-in .15s ease-out}
  @keyframes ov-in{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:26rem;max-height:82dvh;overflow-y:auto;padding:1.5rem}
  .rating-btn{display:inline-flex;align-items:center;gap:.35rem;border-radius:.5rem;text-align:left}
  .rating-btn:hover{text-decoration:underline}
  /* dica discreta ao lado do rótulo do campo */
  .dica{position:relative;display:inline-flex;vertical-align:middle;margin-left:.3rem}
  .dica-btn{width:1rem;height:1rem;border-radius:9999px;display:grid;place-items:center;
    font-size:.62rem;font-weight:800;line-height:1;color:rgb(62 39 35/.45);
    border:1px solid rgb(62 39 35/.3);background:transparent;cursor:help;transition:.15s}
  .dica:hover .dica-btn,.dica-btn:focus-visible{color:var(--cacau);border-color:var(--cacau)}
  .dica-bolha{position:absolute;bottom:calc(100% + .45rem);left:50%;transform:translateX(-50%);
    width:max-content;max-width:14rem;background:var(--cacau);color:var(--chantilly);
    padding:.5rem .7rem;border-radius:.6rem;font-size:.72rem;font-weight:400;line-height:1.35;
    text-align:left;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.15s;z-index:20;
    pointer-events:none}
  .dica-bolha::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--cacau)}
  .dica:hover .dica-bolha,.dica-btn:focus-visible+.dica-bolha{opacity:1;visibility:visible}
  @media(max-width:480px){.dica-bolha{left:0;transform:none}.dica-bolha::after{left:.6rem;transform:none}}
  /* ---------- Cartão fidelidade (arte conezyn) ---------- */
  .fid{
    /* roxo dessaturado: dá espaço para a cor de destaque respirar */
    --roxo:#4A3A6E;--roxo-esc:#332750;--roxo-claro:#5D4A87;
    /* Cor de destaque do cartão. Alternativas testadas, é só trocar a linha:
       --destaque:#EFB8C8;  rosé (em uso)
       --destaque:#D6C6F0;  lavanda clara — o mais harmônico com o roxo
       --destaque:#F6EDE0;  creme — o mais neutro, puxa o fundo do site */
    --destaque:#EFB8C8;--verde:#3FBF7F;
    font-family:"Montserrat",system-ui,sans-serif;
    position:relative;overflow:hidden;width:100%;max-width:30rem;margin-inline:auto;
    padding:2.1rem 1.6rem 2.3rem;
    border-radius:1.4rem;border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(158deg,var(--roxo-claro) 0%,var(--roxo) 48%,var(--roxo-esc) 100%);
    color:#fff;
    box-shadow:0 14px 34px -14px rgba(51,39,80,.6), inset 0 1px 0 rgba(255,255,255,.22)}
  .fid-onda{position:absolute;top:0;left:0;width:100%;height:5rem;pointer-events:none;z-index:0;opacity:.85}
  .fid-cone-bg{position:absolute;width:8rem;opacity:.4;pointer-events:none;color:var(--roxo-esc);z-index:0}
  .fid-cone-bg.e{left:-3rem;bottom:-2.5rem;transform:rotate(-12deg)}
  .fid-cone-bg.d{right:-3rem;bottom:-3rem;transform:rotate(14deg)}

  .fid-topo{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;
    gap:.55rem;font-weight:800;font-size:1rem}
  .fid-badge{background:var(--destaque);color:#332750;border-radius:.45rem;
    padding:.12rem .7rem;font-size:.85rem;font-weight:800;
    box-shadow:0 1px 0 rgba(255,255,255,.4) inset}
  .fid-titulo{position:relative;z-index:2;text-align:center;margin-top:.6rem;
    font-size:clamp(1.2rem,3vw,1.6rem);font-weight:400;line-height:1.15}
  .fid-titulo strong{font-weight:800;color:var(--destaque)}

  /* As linhas têm altura fixa, então todos os cartões ficam da mesma altura,
     tenham 10, 14 ou 16 círculos. O que muda é o tamanho dos selos. */
  .fid-grade{position:relative;z-index:2;display:grid;
    grid-template-columns:repeat(var(--colunas,5),minmax(0,1fr));
    grid-auto-rows:4.4rem;justify-content:center;align-items:center;justify-items:center;
    column-gap:clamp(.3rem,.7vw,.7rem);row-gap:1.1rem;margin:1.5rem auto 0;width:100%}
  .fid-selo{aspect-ratio:1;width:min(100%,4.4rem);margin:0 auto;border-radius:9999px;background:#fff;

}

/* Título conforme o gênero informado. Sem gênero, usa o masculino. */
function tituloNivel(nv, genero){
  return genero === "f" ? nv.titulo.f : nv.titulo.m;

const CARIMBOS_MAXIMOS = () => NIVEIS.reduce((n, x) => n + x.meta, 0);

/* Traduz o total acumulado em: quantos cartões fechou e quanto falta no atual. */
function progressoCartoes(total){
  let resta = total, completos = 0;
  for (const nv of NIVEIS){
    if (resta >= nv.meta){ resta -= nv.meta; completos++; }
    else break;
  }
  return { completos, noAtual: completos < NIVEIS.length ? resta : 0,
           passouDoFim: completos >= NIVEIS.length };
}

/* Setores da empresa. `apelidos` são as outras formas como a equipe
   se refere ao mesmo setor — servem para filtrar, mas o valor gravado
   é sempre o nome oficial. */
/* Setores vêm do banco (tabela `setores`), editáveis no painel.
   A lista abaixo é só o ponto de partida até o carregamento terminar. */
let SETORES = [
  { nome: "Banco de Dados",   apelidos: ["BD"] },
  { nome: "TI",               apelidos: ["Tecnologia"] },
  { nome: "Comercial",        apelidos: ["Vendas"] },

];

const semAcentoMin = t => String(t || "").normalize("NFD")
  .replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();

function setorOficial(texto){
  const t = semAcentoMin(texto);
  if (!t) return null;
  const achado = SETORES.find(s =>
    semAcentoMin(s.nome) === t || s.apelidos.some(a => semAcentoMin(a) === t));
  return achado ? achado.nome : null;
}
function setorForaDaLista(texto){
  return !!String(texto || "").trim() && !setorOficial(texto);
}
function filtrarSetores(termo){
  const t = semAcentoMin(termo);
  if (!t) return SETORES;
  return SETORES.filter(s =>
    semAcentoMin(s.nome).includes(t) || s.apelidos.some(a => semAcentoMin(a).includes(t)));
}

/* ============================================================

   ============================================================ */
/* Se o produto tem foto no Storage, ela vira o fundo do bloco;
   sem foto, mantém o degradê com emoji. */
/* Quantidade escolhida direto no card do catálogo. */
function qtdCard(id){
  const p = byId(id);
  const max = p ? p.estoque : 1;
  const v = S.qtdCard[id] || 1;
  return Math.max(1, Math.min(v, Math.max(max, 1)));
}
function mudarQtdCard(id, delta){
  const p = byId(id);
  const novo = qtdCard(id) + delta;
  S.qtdCard[id] = Math.max(1, Math.min(novo, p ? p.estoque : 1));

}

function avisarErro(e, ondeAconteceu){

function erroAmigavel(e){
  const m = String(e?.message || e || "");
  if (m) console.error("Erro bruto:", e);
  S.ultimoErro = m;
  if (/Database error saving new user/i.test(m))
    return "Não foi possível criar a conta. Verifique se este WhatsApp ou e-mail já foi usado.";
  if (/rate limit|only request this after|too many/i.test(m))
    return "Muitas tentativas seguidas. Aguarde alguns minutos e tente de novo.";
  if (/Signups not allowed|signup is disabled/i.test(m))
    return "O cadastro está desativado no painel do Supabase (Authentication → Providers).";
  if (/Email address .* invalid|invalid format/i.test(m))
    return "Este e-mail foi recusado pelo servidor. Tente outro endereço.";
  if (/confirm|not confirmed/i.test(m))
    return "Confirme seu e-mail antes de entrar.";
  if (/Invalid login credentials/i.test(m)) return "WhatsApp ou senha incorretos.";
  if (/already registered|already been registered/i.test(m)) return "Já existe uma conta com este e-mail.";
  if (/Password should be/i.test(m)) return "A senha deve ter no mínimo 6 caracteres.";
  if (/duplicate key.*telefone/i.test(m)) return "Já existe uma conta com este WhatsApp.";
  if (/Estoque insuficiente|não está disponível|pedido está vazio|Horário inválido|local da entrega/i.test(m)) return m;
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique sua internet.";
  return "Não conseguimos concluir agora. Tente novamente em alguns instantes.";
}

/* ============================================================
   PIX — gera o "copia e cola" (BR Code) e o QR estático
   ============================================================ */
function crc16(str){
  let crc = 0xFFFF;
  for (let i = 0; i < str.length; i++){
    crc ^= str.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++){
      crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF;
    }
  }
  return crc.toString(16).toUpperCase().padStart(4, "0");
}
const semAcento = t => String(t).normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^\x20-\x7E]/g, "");
const campoEmv = (id, valor) => id + String(valor.length).padStart(2, "0") + valor;

function payloadPix({ valorCentavos = 0, txid = "***" } = {}){
  const gui = campoEmv("00", "BR.GOV.BCB.PIX") + campoEmv("01", PIX.chave);
  let p = campoEmv("00", "01");
  p += campoEmv("26", gui);
  p += campoEmv("52", "0000");
  p += campoEmv("53", "986");
  if (valorCentavos > 0) p += campoEmv("54", (valorCentavos / 100).toFixed(2));
  p += campoEmv("58", "BR");
  p += campoEmv("59", semAcento(PIX.nome).toUpperCase().slice(0, 25));
  p += campoEmv("60", semAcento(PIX.cidade).toUpperCase().slice(0, 15));
  p += campoEmv("62", campoEmv("05", String(txid).slice(0, 25)));
  p += "6304";
  return p + crc16(p);
}

function svgQr(texto, tamanho = 5){
  try {
    const qr = qrcode(0, "M");
    qr.addData(texto);
    qr.make();
    return qr.createSvgTag({ cellSize: tamanho, margin: 2 });
  } catch { return ""; }
}

function copiarPix(codigo, botao){
  navigator.clipboard.writeText(codigo).then(() => {
    const antes = botao.textContent;
    botao.textContent = "Copiado ✓";
    setTimeout(() => { botao.textContent = antes; }, 2000);
  }).catch(() => alert("Não foi possível copiar. Selecione o código manualmente."));
}

/* ---------- Engine de preços (espelho de src/lib/pricing/) ---------- */
/* Valor do cone de brinde, com a mesma regra do banco:
   um cone só no pedido usa o preço avulso; dois ou mais, o de dupla.
   Nunca passa do total. */
/* 10% de boas-vindas: vale uma vez, no primeiro pedido da conta.
   Incide sobre o total já com preço de dupla e já descontado o brinde. */
function temDescontoPrimeira(){
  if (!S.perfil) return true;   // visitante: a promoção existe para ele quando criar conta
  if (S.fidelidade?.primeiraCompra != null) return S.fidelidade.primeiraCompra;
  return S.pedidos.filter(p => p.status !== "Cancelado").length === 0;
}

function descontoPrimeira(pr){
  if (!S.perfil || !temDescontoPrimeira()) return 0;
  const base = pr.total - descontoBrinde(pr);
  return base > 0 ? Math.round(base * 0.10) : 0;
}

function descontoBrinde(pr){
  if (!S.fidelidade?.temBrinde || pr.cones < 1) return 0;
  const menorUnit  = Math.min(...pr.linhas.map(l => l.unit));
  const menorDupla = Math.min(...pr.linhas.map(l => l.dupla));
  return Math.min(pr.cones === 1 ? menorUnit : menorDupla, pr.total);
}

function precificar(){
  const linhas = Object.entries(S.carrinho).filter(([,q])=>q>0).map(([id,q])=>{
    const p = byId(id);
    return { id, unit:p.unit, dupla:p.dupla, q };
  });
  const cones = linhas.reduce((s,l)=>s+l.q,0);
  const subtotal = linhas.reduce((s,l)=>s+l.unit*l.q,0);
  const somaDupla = linhas.reduce((s,l)=>s+l.dupla*l.q,0);
  let ajuste = 0, imparId = null;
  if (cones % 2 === 1){
    const m = linhas.reduce((min,l)=>{
      const d = l.unit - l.dupla;
      return d < min.d ? {d, id:l.id} : min;
    }, {d:Infinity, id:null});
    ajuste = m.d; imparId = m.id;
  }
  const total = somaDupla + ajuste;
  return {
    total, subtotal, economia: subtotal - total, cones,
    linhas: linhas.map(l => ({...l, efetivo: l.dupla*l.q + (l.id===imparId ? ajuste : 0)}))
  };
}

/* ============================================================
   TELEFONE / WHATSAPP
   Guardamos apenas os dígitos; a máscara é só apresentação.
   Para o Supabase Auth, o número vira um "apelido de e-mail"
   (ex.: 5511999998888@cones.local) — assim o cliente entra com
   WhatsApp e senha, sem SMS, sem código e sem custo.
   ============================================================ */
function digitos(v){ return String(v||"").replace(/\D/g, ""); }

function mascaraTelefone(v){
  const d = digitos(v).slice(0, 11);
  if (d.length <= 2)  return d.length ? "(" + d : "";
  if (d.length <= 6)  return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
/* Aplica a máscara enquanto o usuário digita, preservando o cursor no fim. */
function aoDigitarTelefone(input){
  const posFim = input.selectionStart === input.value.length;
  input.value = mascaraTelefone(input.value);
  if (posFim) input.setSelectionRange(input.value.length, input.value.length);
}
function telefoneValido(v){
  const d = digitos(v);
  return d.length === 10 || d.length === 11;
}
/* Identificador estável usado no Supabase Auth. */
function emailApelido(telefone){
  return "55" + digitos(telefone) + "@cones.local";
}

function iniciais(nome){
  const p = String(nome||"").trim().split(/\s+/).filter(Boolean);
  if (p.length===0) return "?";
  return (p.length>1 ? p[0][0]+p[p.length-1][0] : p[0][0]).toUpperCase();
}
function avatarHtml(nome, foto, lg=false){
  if (foto) return `<img class="avatar ${lg?"lg":""}" src="${foto}" alt="Foto de ${esc(nome)}">`;
  return `<span class="avatar ${lg?"lg":""}" role="img" aria-label="${esc(nome)}">${esc(iniciais(nome))}</span>`;
}
async function carregarFoto(input){
  const f = input.files && input.files[0];
  if (!f || !S.perfil) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  // nome fixo em webp: cada troca sobrescreve a anterior, sem acumular arquivos
  const caminho = `${S.perfil.id}/avatar.webp`;
  let blob;

/* ============================================================
   NOTIFICAÇÕES NATIVAS DO SISTEMA (prompt, seção 16.B)
   Aparecem por cima de qualquer aba ou aplicativo, desde que
   esta aba continue aberta em algum lugar e o navegador rodando.
   ============================================================ */
/* A preferência fica guardada neste navegador, então continua valendo
   nos próximos dias. A permissão em si é do navegador e já é permanente. */
const NOTIF_PREF = "cones.notif";
function lerPrefNotif(){
  try { return JSON.parse(localStorage.getItem(NOTIF_PREF) || "{}"); }
  catch { return {}; }
}
function salvarPrefNotif(){
  try {
    localStorage.setItem(NOTIF_PREF, JSON.stringify({ ativo: S.notif.ativo, som: S.notif.som }));
  } catch { /* navegação privada: segue só nesta sessão */ }
}
/* Restaura o estado ao abrir o site. Se a permissão já foi concedida,
   os avisos voltam ligados sozinhos — a menos que você tenha desligado. */
function restaurarNotificacoes(){
  const pref = lerPrefNotif();
  if (typeof pref.som === "boolean") S.notif.som = pref.som;
  if (notifPermissao() === "granted"){
    S.notif.ativo = pref.ativo !== false;
    if (S.notif.ativo) prepararSomNaPrimeiraInteracao();
  } else {
    S.notif.ativo = false;
  }
}
/* O navegador só libera áudio após um clique. Fica à espera do primeiro. */
function prepararSomNaPrimeiraInteracao(){
  const uma = () => {
    destravarSom();
    window.removeEventListener("click", uma);
    window.removeEventListener("keydown", uma);
  };
  window.addEventListener("click", uma, { once: true });
  window.addEventListener("keydown", uma, { once: true });
}

const notifSuportado = () => typeof window!=="undefined" && "Notification" in window;

/* ---- PERSONALIZAÇÃO DA NOTIFICAÇÃO — edite só aqui ----
   {numero} {cliente} {total} {local} {quando} são substituídos automaticamente. */
const NOTIF_TEXTO = {
  icone: "/icon-192.png",                       // miniatura exibida na notificação
  titulo: "🍦 Novo pedido — Conezyn",
  corpo: "Pedido #{numero} · {cliente}\n{total} · Entrega: {local} · Receber: {quando}",
};
function montarTexto(modelo, dados){
  return String(modelo).replace(/\{(\w+)\}/g, (_, k) => dados[k] ?? "");
}
const notifPermissao = () => notifSuportado() ? Notification.permission : "unsupported";

function notifLog(msg){
  S.notif.log.unshift(new Date().toLocaleTimeString("pt-BR") + " — " + msg);
  S.notif.log = S.notif.log.slice(0, 6);
}
async function ativarNotificacoes(){
  if (!notifSuportado()){ notifLog("Este navegador não suporta notificações."); return render(); }
  destravarSom();
  if (Notification.permission === "denied"){
    notifLog("Permissão bloqueada pelo navegador — reative no cadeado da barra de endereço.");
    return render();
  }
  const r = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  S.notif.ativo = (r === "granted");
  salvarPrefNotif();
  notifLog(r === "granted"
    ? "Notificações ativadas. Vão continuar ligadas nos próximos dias neste navegador."
    : "Permissão não concedida (" + r + ").");
  render();
}
function desativarNotificacoes(){
  S.notif.ativo = false;
  salvarPrefNotif();
  notifLog("Notificações desativadas neste painel (a permissão do navegador continua concedida).");
  render();
}
function notificarNativo({ titulo, corpo, tag, aoClicar }){
  if (!S.notif.ativo || notifPermissao() !== "granted") return false;
  try {
    const n = new Notification(titulo, {
      body: corpo,
      icon: NOTIF_TEXTO.icone,  // miniatura do cone (no macOS aparece ao lado do texto)
      badge: NOTIF_TEXTO.icone,
      tag,                      // substitui a anterior de mesma tag em vez de empilhar
      requireInteraction: true, // permanece na tela até ser fechada (Chrome/Edge)
      silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); if (aoClicar) aoClicar(); };
    if (S.notif.som) tocarAlerta();
    return true;
  } catch (e) {
    notifLog("Falha ao exibir a notificação: " + e.message);
    return false;
  }
}
/* Som curto gerado no próprio navegador — sem arquivo externo.
   Navegadores exigem uma interação anterior do usuário, por isso o destravamento. */
let audioCtx = null;
function destravarSom(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { /* sem áudio disponível */ }
}
function tocarAlerta(){
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [880, 1180].forEach((hz, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = hz; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t + i*0.16);
      g.gain.exponentialRampToValueAtTime(0.22, t + i*0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.16 + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + i*0.16); o.stop(t + i*0.16 + 0.16);
    });
  } catch { /* silencioso */ }
}
function testarNotificacao(atrasoSeg = 0){
  if (notifPermissao() !== "granted" || !S.notif.ativo){
    notifLog("Ative as notificações antes de testar.");
    return render();
  }
  const disparar = () => {
    const num = 1048 + Math.floor(Math.random()*50);
    const ok = notificarNativo({
      titulo: NOTIF_TEXTO.titulo,
      corpo: montarTexto(NOTIF_TEXTO.corpo, {
        numero: num, cliente: "Teste", total: "R$ 52,00", local: "TI", quando: "agora",
      }),
      tag: "teste-" + num,
      aoClicar: () => { S.adminTab = "pedidos"; nav("admin"); },
    });
    notifLog(ok ? "Notificação de teste enviada." : "Não foi possível enviar a notificação.");
    render();
  };
  if (atrasoSeg > 0){
    notifLog(`Teste agendado para ${atrasoSeg}s — troque de aba ou de aplicativo agora.`);
    render();
    setTimeout(disparar, atrasoSeg * 1000);
  } else disparar();
}
function setQtd(id, q){

/* ---------- Pedido (espelho de src/lib/data/pedidos.ts) ---------- */
function alternarPresente(ativo){
  S.presente = { ativo, termo:"", sugestoes:[], escolhido:null, setor:"", buscando:false };
  render();
}
let buscaTimer = null;

/* A lista de sugestões é desenhada SOZINHA, sem re-renderizar a tela.
   Chamar render() a cada tecla destruía o campo e tirava o foco. */
/* Tags de setor: filtram enquanto se digita, sem redesenhar a tela. */
/* ============================================================
   CAMPO COM LISTA DE OPÇÕES
   Abre abaixo do campo, filtra conforme se digita e — quando
   permitido — deixa usar um valor que não está na lista.
   ============================================================ */
const LISTAS = {};   // idCampo -> { opcoes, permitirNovo, aoEscolher }

function campoComLista(id, { valor = "", placeholder = "", opcoes = [], permitirNovo = false,
                             aoEscolher = "", extra = "" } = {}){
  LISTAS[id] = { opcoes, permitirNovo, aoEscolher };
  return `<span class="campo-lista" style="display:block">
    <input id="${id}" class="field" autocomplete="off" value="${esc(valor)}"
      placeholder="${esc(placeholder)}" ${extra}
      oninput="abrirLista('${id}')" onfocus="abrirLista('${id}')"
      onblur="setTimeout(()=>fecharLista('${id}'), 150)">
    <span id="${id}-opcoes"></span>
  </span>`;
}

function abrirLista(id){
  const cfg = LISTAS[id];
  const campo = document.getElementById(id);
  const caixa = document.getElementById(id + "-opcoes");
  if (!cfg || !campo || !caixa) return;

  const termo = semAcentoMin(campo.value);
  const achadas = cfg.opcoes.filter(o => !termo || semAcentoMin(o.rotulo).includes(termo));
  const exato = cfg.opcoes.some(o => semAcentoMin(o.rotulo) === termo);
  const podeCriar = cfg.permitirNovo && campo.value.trim().length >= 2 && !exato;

  if (achadas.length === 0 && !podeCriar){
    caixa.innerHTML = `<div class="opcoes"><p class="vazio">Nada encontrado.</p></div>`;
    return;
  }

  caixa.innerHTML = `<ul class="opcoes">
    ${achadas.map((o, i) => `<li><button type="button" onmousedown="event.preventDefault()"
      onclick="escolherDaLista('${id}', ${i})">
      ${esc(o.rotulo)}${o.detalhe ? `<span class="muted" style="font-weight:400"> · ${esc(o.detalhe)}</span>` : ""}
    </button></li>`).join("")}
    ${podeCriar ? `<li><button type="button" class="criar" onmousedown="event.preventDefault()"
      onclick="usarValorNovo('${id}')">+ usar “${esc(campo.value.trim())}”</button></li>` : ""}
  </ul>`;
  caixa.dataset.filtradas = JSON.stringify(achadas.map(o => o.valor ?? o.rotulo));
}

function fecharLista(id){
  const caixa = document.getElementById(id + "-opcoes");
  if (caixa) caixa.innerHTML = "";
}

function escolherDaLista(id, indice){
  const cfg = LISTAS[id];
  const campo = document.getElementById(id);
  const caixa = document.getElementById(id + "-opcoes");
  if (!cfg || !campo || !caixa) return;
  const valores = JSON.parse(caixa.dataset.filtradas || "[]");
  const escolhido = valores[indice];
  if (escolhido == null) return;
  campo.value = escolhido;
  fecharLista(id);
  if (cfg.aoEscolher) window[cfg.aoEscolher]?.(id, escolhido);
}

function usarValorNovo(id){
  const cfg = LISTAS[id];
  const campo = document.getElementById(id);
  fecharLista(id);
  if (cfg?.aoEscolher) window[cfg.aoEscolher]?.(id, campo.value.trim());
}

function desenharSetores(idCaixa, idCampo){
  const caixa = document.getElementById(idCaixa);
  const campo = document.getElementById(idCampo);
  if (!caixa || !campo) return;
  const texto = campo.value;
  const lista = filtrarSetores(texto);
  const oficial = setorOficial(texto);

  if (lista.length === 0){ caixa.innerHTML = ""; return; }
  caixa.innerHTML = lista.map(s => `<button type="button"
      class="setor-tag ${oficial === s.nome ? "ativa" : ""}"
      onmousedown="event.preventDefault()"
      onclick="escolherSetor('${idCaixa}','${idCampo}','${esc(s.nome)}')">
      ${esc(s.nome)}
    </button>`).join("");
}
function escolherSetor(idCaixa, idCampo, nome){
  const campo = document.getElementById(idCampo);
  if (!campo) return;
  campo.value = nome;
  campo.dispatchEvent(new Event("input", { bubbles: true }));
  desenharSetores(idCaixa, idCampo);
}

function desenharSugestoes(){
  const caixa = document.getElementById("pr-sugestoes");
  if (!caixa) return;
  const p = S.presente;

  if (p.buscando && p.sugestoes.length === 0){
    caixa.innerHTML = `<p class="muted" style="font-size:.72rem;margin-top:.3rem">procurando...</p>`;
    return;
  }
  if (p.sugestoes.length === 0){ caixa.innerHTML = ""; return; }

  caixa.innerHTML = `<ul class="sug-lista">
    ${p.sugestoes.map((d,i)=>`<li>
      <button type="button" class="sug-item"
        onmousedown="event.preventDefault()"
        onclick="escolherDestinatario(${i})">
        <strong>${esc(d.nome)}</strong>
        ${d.setor?`<span class="muted"> · 📍 ${esc(d.setor)}</span>`:""}
        ${d.origem==="conta"?`<span class="badge b-classico" style="margin-left:.3rem">tem conta</span>`:""}
      </button></li>`).join("")}
  </ul>`;
}

function buscarDestinatario(termo){
  const p = S.presente;
  p.termo = termo; p.escolhido = null;
  clearTimeout(buscaTimer);

  if (termo.trim().length < 3){
    p.sugestoes = []; p.buscando = false;
    return desenharSugestoes();
  }
  p.buscando = true;
  desenharSugestoes();

  buscaTimer = setTimeout(async () => {
    const alvo = termo.trim();
    const { data, error } = await sb.rpc("buscar_destinatarios", { p_termo: alvo });
    if (S.presente.termo.trim() !== alvo) return;   // o texto já mudou: descarta
    p.sugestoes = error ? [] : (data || []);
    p.buscando = false;
    desenharSugestoes();
  }, 350);
}

function escolherDestinatario(i){
  const d = S.presente.sugestoes[i];
  if (!d) return;
  S.presente.escolhido = d;
  S.presente.termo = d.nome;
  if (d.setor) S.presente.setor = d.setor;
  S.presente.sugestoes = [];

  const campoNome = document.getElementById("pr-nome");
  if (campoNome) campoNome.value = d.nome;
  const campoSetor = document.getElementById("pr-setor");
  if (campoSetor && d.setor) campoSetor.value = d.setor;
  desenharSugestoes();
}

async function recarregarPedidos(){

}

async function confirmarPedido(){
  const c = S.checkout;
  c.erro = null;
  if (!S.perfil){ S.voltarPara = "checkout"; return nav("login"); }
  if (!c.local.trim()){ c.erro = "Informe o local da entrega dentro da empresa."; return render(); }
  if (c.quando==="horario"){
    if (!/^\d{2}:\d{2}$/.test(c.hora)){ c.erro="Escolha um horário válido."; return render(); }
    const [h,m] = c.hora.split(":").map(Number);
    const alvo = new Date(); alvo.setHours(h,m,0,0);
    const diff = (alvo - new Date())/60000;
    if (diff < 0){ c.erro="Esse horário já passou. Escolha um horário mais tarde."; return render(); }
    if (diff < ANTECEDENCIA_MIN){ c.erro=`Precisamos de pelo menos ${ANTECEDENCIA_MIN} minutos para preparar seu pedido.`; return render(); }
  }

  const itens = Object.entries(S.carrinho)
    .filter(([,q]) => q > 0)
    .map(([produto_id, quantidade]) => ({ produto_id, quantidade }));
  if (itens.length === 0){ c.erro = "Seu carrinho está vazio."; return render(); }

  // A chave de idempotência nasce aqui: duplo clique não gera dois pedidos.
  if (!c.idem) c.idem = crypto.randomUUID();

  const pr = S.presente;
  if (pr.ativo){
    const nome = pr.escolhido ? pr.escolhido.nome : pr.termo.trim();
    if (nome.length < 2){ c.erro = "Informe para quem é o presente."; return render(); }
  }

  const { data, error } = await sb.rpc("place_order", {
    p_itens: itens,
    p_local: c.local.trim(),
    p_quando: c.quando === "agora" ? "agora" : c.hora,
    p_idempotency_key: c.idem,
    p_presente: !!pr.ativo,
    p_destinatario_nome: pr.ativo ? (pr.escolhido ? pr.escolhido.nome : pr.termo.trim()) : null,
    p_destinatario_setor: pr.ativo ? (pr.setor.trim() || null) : null,
    p_destinatario_id: pr.ativo && pr.escolhido ? pr.escolhido.id : null,
  });

  if (error){
    c.erro = erroAmigavel(error);
    c.idem = null;                      // permite nova tentativa
    await carregarCatalogo();           // reflete estoque que mudou
    return render();
  }

  const linha = Array.isArray(data) ? data[0] : data;

  // Pedido para si mesmo: o local vira o setor do perfil (sempre o último usado).
  // Se for presente, o local é de quem recebe — o perfil não muda.
  if (!pr.ativo){
    const setor = setorOficial(c.local) || c.local.trim();
    if (setor && setor !== S.perfil.setor){
      await sb.from("profiles").update({ setor }).eq("id", S.perfil.id);
      S.perfil.setor = setor;
    }
  }

  S.carrinho = {};
  // recarrega a fidelidade também: é o que faz a promoção de boas-vindas
  // e o brinde do cartão sumirem na hora, sem precisar atualizar a página
  await Promise.all([carregarCatalogo(), carregarPedidos(), carregarFidelidade()]);
  nav("confirmado", linha.numero);
}

function campoSenha(id, extra = ""){
  return `<div class="campo-senha">

function alternarSenha(id, botao){
  const campo = document.getElementById(id);
  if (!campo) return;
  const oculta = campo.type === "password";
  campo.type = oculta ? "text" : "password";
  botao.textContent = oculta ? "🙈" : "👁";
  botao.setAttribute("aria-label", oculta ? "Ocultar senha" : "Mostrar senha");
  botao.setAttribute("title", oculta ? "Ocultar senha" : "Mostrar senha");
  campo.focus();
}

/* Etapa 1 — procura o WhatsApp na lista que o administrador cadastrou. */
async function etapaTelefone(){
  const c = S.cad;
  c.tel = document.getElementById("r-tel").value.trim();
  if (!telefoneValido(c.tel)){
    S.cadastroErro = "Digite o WhatsApp com DDD — 10 ou 11 dígitos.";
    return render();
  }
  S.cadastroErro = null; c.checando = true; render();

  const [pre, uso] = await Promise.all([
    sb.rpc("consultar_precadastro", { p_telefone: c.tel }),
    sb.rpc("telefone_em_uso", { p_telefone: c.tel }),
  ]);
  c.checando = false;

  if (uso && uso.data === true){
    S.cadastroErro = "Este WhatsApp já pertence a uma conta. Use a opção Entrar, ou cadastre outro número.";
    return render();
  }

  const { data, error } = pre;
  const ficha = !error && Array.isArray(data) ? data[0] : null;
  if (ficha){ c.ficha = ficha; c.etapa = 2; }
  else { c.ficha = null; c.etapa = 3; }
  render();
}

/* Etapa 2 — a pessoa confirma (ou nega) que a ficha é dela. */
function confirmarFicha(sim){
  const c = S.cad;
  if (sim){
    c.nome = c.ficha.primeiro_nome;   // pré-preenchido, mas editável
  } else {
    // Registra a recusa para você avaliar depois: mesmo WhatsApp,
    // mas a pessoa diz que não é ela.
    sb.rpc("registrar_recusa_precadastro", { p_telefone: c.tel });
    c.ficha = null; c.nome = "";
  }
  c.etapa = 3;
  S.cadastroErro = null;
  render();
}

/* Etapa 3 — nome e e-mail. */
function etapaDados(){
  const c = S.cad;
  c.nome = document.getElementById("r-nome").value.trim();
  if (!c.nome){ S.cadastroErro = "Informe seu nome."; return render(); }
  S.cadastroErro = null; c.etapa = 4; render();
}

function voltarEtapa(){
  const c = S.cad;
  S.cadastroErro = null;
  if (c.etapa === 4) c.etapa = 3;
  else if (c.etapa === 3) c.etapa = c.ficha ? 2 : 1;
  else if (c.etapa === 2) c.etapa = 1;
  render();
}

async function fazerLogin(){
  if (S.ocupado) return;
  const tel = document.getElementById("l-tel").value.trim();
  const senha = document.getElementById("l-senha").value;
  if (!telefoneValido(tel)){ S.loginErro="Digite o WhatsApp com DDD."; return render(); }
  if (!senha){ S.loginErro="Informe a senha."; return render(); }

  S.ocupado = true; S.loginErro = null; S.loginAviso = null; render();
  const { error } = await sb.auth.signInWithPassword({
    email: emailApelido(tel), password: senha,
  });
  S.ocupado = false;
  if (error){ S.loginErro = erroAmigavel(error); return render(); }
  await carregarPerfil();
  await confirmarAdmin();
  await Promise.all([carregarPedidos(), carregarFidelidade(), carregarPedidosAntigos()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}

/* Sem e-mail, a redefinição é combinada por WhatsApp: o pedido entra
   numa fila que aparece no painel do administrador. */
async function recuperarSenha(){
  const campo = document.getElementById("l-tel");
  const tel = campo ? campo.value.trim() : "";
  if (!telefoneValido(tel)){
    S.loginErro = "Digite seu WhatsApp no campo acima para pedir a redefinição.";
    S.loginAviso = null;
    return render();
  }
  const { data, error } = await sb.rpc("solicitar_redefinicao_senha", { p_telefone: tel });
  if (error){ S.loginErro = erroAmigavel(error); return render(); }

  S.loginErro = null;
  S.loginAviso = data === true
    ? "Pedido registrado! Em breve entramos em contato pelo seu WhatsApp para redefinir a senha."
    : "Não encontramos conta com este WhatsApp. Confira o número ou crie uma conta.";
  render();
}

async function fazerCadastro(){
  if (S.ocupado) return;
  const c = S.cad;
  const senha = document.getElementById("r-senha").value;
  const conf  = document.getElementById("r-conf").value;
  if (senha.length < 6){ S.cadastroErro = "A senha deve ter no mínimo 6 caracteres."; return render(); }
  if (senha !== conf){ S.cadastroErro = "As senhas não coincidem."; return render(); }

  S.ocupado = true; S.cadastroErro = null; render();
  const { error } = await sb.auth.signUp({
    email: emailApelido(c.tel), password: senha,
    options: { data: { nome: c.nome, telefone: mascaraTelefone(c.tel) } },
  });
  S.ocupado = false;
  if (error){ S.cadastroErro = erroAmigavel(error); return render(); }

  const { data:{ session } } = await sb.auth.getSession();
  S.cad = { etapa:1, tel:"", nome:"", email:"", ficha:null, checando:false };
  if (!session){
    S.loginAviso = "Conta criada! Agora entre com seu WhatsApp e senha.";
    return nav("login");
  }
  await carregarPerfil();
  await confirmarAdmin();
  await Promise.all([carregarPedidos(), carregarFidelidade(), carregarPedidosAntigos()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}

async function trocarSenha(){
  if (S.ocupado) return;
  const atual = document.getElementById("s-atual").value;
  const nova  = document.getElementById("s-nova").value;
  const conf  = document.getElementById("s-conf").value;

  S.senhaErro = null; S.senhaOk = null;
  if (!atual){ S.senhaErro = "Informe sua senha atual."; return render(); }
  if (nova.length < 6){ S.senhaErro = "A nova senha deve ter no mínimo 6 caracteres."; return render(); }
  if (nova !== conf){ S.senhaErro = "As senhas novas não coincidem."; return render(); }
  if (nova === atual){ S.senhaErro = "A nova senha precisa ser diferente da atual."; return render(); }

  S.ocupado = true; render();

  // Confirma a identidade entrando de novo com a senha atual.
  const check = await sb.auth.signInWithPassword({
    email: emailApelido(S.perfil.tel), password: atual,
  });
  if (check.error){
    S.ocupado = false;
    S.senhaErro = "Senha atual incorreta.";
    return render();
  }

  const { error } = await sb.auth.updateUser({ password: nova });
  S.ocupado = false;
  if (error){ S.senhaErro = erroAmigavel(error); return render(); }

  S.senhaOk = "Senha alterada! Use a nova da próxima vez que entrar.";
  render();
  ["s-atual","s-nova","s-conf"].forEach(id => {
    const c = document.getElementById(id); if (c) c.value = "";
  });
}

/* Cone em SVG. `marca` aceita/* Cone em SVG. `marca` aceita "mais" (+ laranja) ou "check" (✓ verde).
   Ambos levam contorno branco para destacar sobre o cone. */
function svgCone({ recheio="#A18D80", casquinha="#A18D80", marca=null, duplo=false } = {}){
  const cruz = "M -2 -7.5 H 2 V -2 H 7.5 V 2 H 2 V 7.5 H -2 V 2 H -7.5 V -2 H -2 Z";
  const tique = "M -6.5 0 L -2 4.8 L 6.8 -5";
  const enfeite =
    marca === "mais"
      ? `<g transform="translate(32 25)">
           <path d="${cruz}" fill="#EFB8C8" stroke="#fff" stroke-width="3.2"
                 stroke-linejoin="round" paint-order="stroke"/>
         </g>`
      : marca === "check"
      ? `<g transform="translate(29 23)">
           <path d="${tique}" fill="none" stroke="#fff" stroke-width="8.5"
                 stroke-linecap="round" stroke-linejoin="round"/>
           <path d="${tique}" fill="none" stroke="#3FBF7F" stroke-width="4.2"
                 stroke-linecap="round" stroke-linejoin="round"/>
         </g>`
      : "";
  const cone = (dx, dy, giro, escala) => `<g transform="translate(${dx} ${dy}) rotate(${giro} 24 24) scale(${escala})">
      <path d="M24 6 L34 12 L25.6 41.4 Q24 44.4 22.4 41.4 L14 12 Z" fill="${casquinha}" opacity=".55"/>
      <ellipse cx="24" cy="10" rx="10.5" ry="5" fill="${recheio}"/>
    </g>`;
  return `<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    ${duplo
      ? cone(-5, -2, -34, 0.82) + cone(9, 2, 26, 0.82)
      : cone(0, 0, -28, 1)}
    ${enfeite}
  </svg>`;
}

/* Cartões completos ficam à esquerda do atual, como um carrossel:
   cada cartão fechado dá acesso ao próximo. */
/* Move o carrossel um cartão para o lado. */
function rolarCartoes(direcao){
  const faixa = document.getElementById("fid-carrossel");
  if (!faixa) return;
  const cartao = faixa.querySelector(".fid-slide");
  if (!cartao) return;
  const passo = cartao.getBoundingClientRect().width + 16;   // largura + espaçamento
  faixa.scrollBy({ left: passo * direcao, behavior: "smooth" });
}

/* Liga/desliga as setas conforme a posição e mostra "2 de 3". */
function atualizarSetasCartoes(){
  const faixa = document.getElementById("fid-carrossel");
  const ant = document.getElementById("fid-ant");
  const prox = document.getElementById("fid-prox");
  const pos = document.getElementById("fid-pos");
  if (!faixa || !ant || !prox) return;

  const limite = faixa.scrollWidth - faixa.clientWidth;
  ant.disabled  = faixa.scrollLeft <= 2;
  prox.disabled = faixa.scrollLeft >= limite - 2;

  if (pos){
    const cartao = faixa.querySelector(".fid-slide");
    const passo = cartao ? cartao.getBoundingClientRect().width + 16 : 1;
    const total = faixa.querySelectorAll(".fid-slide").length;
    const atual = Math.min(total, Math.round(faixa.scrollLeft / passo) + 1);
    pos.textContent = `${atual} de ${total}`;
  }
}

function carrosselCartoes(carimbos, nome, genero = null){
  const prog = progressoCartoes(carimbos);
  const ehAdmin = !!S.perfil?.admin;
  const total = ehAdmin
    ? Math.max(prog.completos + (prog.passouDoFim ? 0 : 1), NIVEIS.length)
    : Math.min(prog.completos + (prog.passouDoFim ? 0 : 1), NIVEIS.length);

  const slides = [];
  for (let i = 0; i < total; i++){
    const ehAtual  = i === prog.completos && !prog.passouDoFim;
    const ehPrevia = i > prog.completos;
    const cheios = ehAtual ? prog.noAtual : ehPrevia ? 0 : NIVEIS[i].meta;

    slides.push(`<div class="fid-slide ${ehAtual || ehPrevia ? "" : "completo"}">
      <span class="fid-slide-rotulo">
        ${esc(tituloNivel(nivelDe(i), genero))} ·
        ${ehAtual
          ? (prog.completos > 0 ? "em andamento" : "seu cartão")
          : ehPrevia
            ? `<span style="color:var(--casquinha)">prévia (só você vê)</span>`
            : "completo ✓"}
      </span>
      ${cartaoFidelidade(cheios, nome, i, genero)}
    </div>`);
  }

  const aviso = prog.passouDoFim
    ? `🏆 Você completou todos os ${NIVEIS.length} cartões! Um novo nível está a caminho.`
    : ehAdmin && total > prog.completos + 1
      ? `Como administrador, você vê todos os ${NIVEIS.length} níveis do cartão. Arraste para o lado.`
      : prog.completos > 0
        ? `⬅ Arraste para ver os ${prog.completos} cartão(ões) que você já completou.`
        : "";

  return `<div class="fid-carrossel" id="fid-carrossel"
      aria-label="Cartões fidelidade${prog.completos ? `, ${prog.completos} completo(s)` : ""}">
    ${slides.join("")}
  </div>
  ${total >= 2 ? `<div class="fid-nav">
    <button class="fid-seta" id="fid-ant" aria-label="Cartão anterior" onclick="rolarCartoes(-1)">‹</button>
    <span class="muted" style="font-size:.78rem" id="fid-pos"></span>
    <button class="fid-seta" id="fid-prox" aria-label="Próximo cartão" onclick="rolarCartoes(1)">›</button>
  </div>` : ""}
  ${aviso ? `<p class="muted" style="font-size:.78rem;text-align:center;margin-top:.4rem">${aviso}</p>` : ""}`;
}

/* Réplica em código dos cartões físicos da conezyn.
   `cheios` é quanto já foi carimbado NESTE cartão (não o total geral). */
function cartaoFidelidade(cheios, nome, indiceCartao = 0, genero = null){
  const nv = nivelDe(indiceCartao);
  const meta = nv.meta;
  const completo = cheios >= meta;
  const colunas = Math.ceil(meta / 2);

  const selos = Array.from({ length: meta }, (_, i) => {
    const pos = i + 1;
    const ultimo  = pos === meta;
    const marcado = i < cheios;
    const bonus = (nv.bonus || []).find(b => b.pos === pos);

    // selo de desconto do meio do cartão, enquanto não é conquistado
    if (bonus && !marcado){
      return `<span class="fid-selo">
        <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <text x="24" y="19" text-anchor="middle" font-family="Montserrat,sans-serif"
            font-weight="800" font-size="16" fill="${bonus.cor}">${bonus.texto}<tspan x="24" dy="14">${bonus.texto2}</tspan></text>
        </svg></span>`;
    }

    // marca de recompensa: no último círculo e, quando houver, no meio
    const ehMarca = ultimo || (nv.marcaMeio && pos === nv.marcaMeio);
    const marca = ehMarca ? (completo && ultimo ? "check" : "mais") : null;
    const duplo = ehMarca && nv.duplo && ultimo;

    return marcado
      ? `<span class="fid-selo">${svgCone({ recheio: nv.selo, casquinha: nv.selo, marca, duplo })}</span>`
      : `<span class="fid-selo">${ehMarca ? svgCone({ marca, duplo }) : ""}</span>`;
  }).join("");

  const estilo = `--roxo:${nv.fundo};--roxo-esc:${nv.fundoEsc};--roxo-claro:${nv.fundoClaro};` +
                 `--destaque:${nv.destaque};--colunas:${colunas}`;

  return `<div class="fid vintage" style="${estilo}" role="img"
      aria-label="Cartão ${tituloNivel(nv, genero)}: ${cheios} de ${meta} carimbos">
    <span class="fid-textura"></span>
    <span class="fid-moldura"></span>
    <svg class="fid-onda" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 H400 V26 C330 58 300 6 232 22 C150 42 120 4 44 26 C28 31 12 32 0 30 Z"
        fill="${nv.fundoEsc}"/>
    </svg>
    <span class="fid-cone-bg e">${svgEnfeite(nv.enfeite)}</span>
    <span class="fid-cone-bg d">${svgEnfeite(nv.enfeite)}</span>

    <p class="fid-topo">${esc(nome || "Nome")}
      <span class="fid-badge" style="background:${nv.badgeFundo};color:${nv.badgeTexto}">
        ${esc(tituloNivel(nv, genero))}</span></p>
    <p class="fid-titulo">${esc(nv.subtitulo)}</p>

    <div class="fid-grade" style="grid-template-columns:repeat(${colunas},minmax(0,1fr))">${selos}</div>

  </div>`;
}

const LOGO_WEBP = "marca/logo.webp";
const LOGO_SVG  = "marca/logo.svg";

async function enviarLogo(input){
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  const rotulo = document.getElementById("logo-rotulo");
  if (rotulo) rotulo.textContent = "Enviando...";
  try {
    // SVG é vetor: sobe do jeito que está, sem rasterizar.
    const ehSvg = /svg/i.test(f.type) || /\.svg$/i.test(f.name);
    if (ehSvg && f.size > 500 * 1024) throw new Error("O SVG precisa ter menos de 500 KB.");

    const corpo = ehSvg ? f : await prepararImagem(f, 400, 0.92);
    const caminho = ehSvg ? LOGO_SVG : LOGO_WEBP;
    const tipo = ehSvg ? "image/svg+xml" : "image/webp";

    const up = await sb.storage.from("produtos")
      .upload(caminho, corpo, { upsert: true, contentType: tipo });
    if (up.error) throw up.error;

    // remove o formato antigo, para não ficarem duas logos no Storage
    await sb.storage.from("produtos").remove([ehSvg ? LOGO_WEBP : LOGO_SVG]);

    const { data } = sb.storage.from("produtos").getPublicUrl(caminho);
    const url = data.publicUrl + "?v=" + Date.now();
    const { error } = await sb.from("settings")
      .upsert({ chave: "logo_url", valor: url }, { onConflict: "chave" });
    if (error) throw error;
    MARCA.logo = url;
    render();
  } catch (e) {
    avisarErro(e, "enviar a logo");
    if (rotulo) rotulo.textContent = "Enviar logo";
  }
}

    const caminho = `marca/quadro${n}.${ehPng ? "png" : "webp"}`;
    const up = await sb.storage.from("produtos")
      .upload(caminho, corpo, { upsert: true, contentType: ehPng ? "image/png" : "image/webp" });
    if (up.error) throw up.error;
    await sb.storage.from("produtos").remove([`marca/quadro${n}.${ehPng ? "webp" : "png"}`]);

    const { data } = sb.storage.from("produtos").getPublicUrl(caminho);
    const url = data.publicUrl + "?v=" + Date.now();
    const { error } = await sb.from("settings")
      .upsert({ chave: `quadro${n}_url`, valor: url }, { onConflict: "chave" });
    if (error) throw error;
    MARCA.quadros[n - 1] = url;
    salvarQuadrosCache(MARCA.quadros);
    render();
  } catch (e) {
    avisarErro(e, `enviar o quadro ${n}`);
    if (rotulo) rotulo.textContent = "Enviar";
  }
}

function editarPedidoFicha(id){
  const chave = "ficha:" + id;
  if (S.admin.pedidoEditando === chave){ S.admin.pedidoEditando = null; return render(); }
  const c = S.admin.compras.find(x => x.id === id);
  if (!c) return;
  const f = S.admin.fichas.find(x => x.id === c.pre_cliente_id);
  S.admin.novoPedido = false;
  S.admin.pedidoEditando = chave;
  S.admin.formPedido = {
    id, cliente: f?.nome || "", telefone: f?.telefone || "",
    entrega: c.data_entrega || "", pagamento: c.data_pagamento || "",
    forma: c.forma_pagamento || "",
    valor: c.valor_centavos != null ? (c.valor_centavos / 100).toFixed(2).replace(".", ",") : "",
    brinde: ehBrindeDaFicha(c),
    linhas: Array.isArray(c.itens) && c.itens.length
      ? c.itens.map(i => ({ sabor: i.sabor, qtd: i.quantidade }))
      : [{ sabor: c.sabores || "", qtd: c.quantidade || 1 }],
  };
  render();
}

function fecharFormPedido(){
  S.admin.novoPedido = false;
  S.admin.pedidoEditando = null;
  S.admin.formPedido = null;
  render();
}

/* Lê o que está digitado antes de redesenhar. */
function lerFormPedido(){
  const f = formPedido();
  f.linhas.forEach((l, i) => {
    const cs = document.getElementById(`fp-sabor-${i}`);
    const cq = document.getElementById(`fp-qtd-${i}`);
    if (cs) l.sabor = cs.value;
    if (cq) l.qtd = Math.max(1, parseInt(cq.value, 10) || 1);
  });
  const pega = (id, campo) => { const c = document.getElementById(id); if (c) f[campo] = c.value; };
  pega("fp-cliente", "cliente");
  pega("fp-entrega", "entrega");
  pega("fp-pagamento", "pagamento");
  pega("fp-forma", "forma");
  pega("fp-valor", "valor");
  const cb = document.getElementById("fp-brinde");
  if (cb) f.brinde = cb.checked;
  return f;
}

/* Marcar como brinde zera o valor e limpa o pagamento —
   é assim que o pedido entra na categoria Brindes. */
function marcarComoBrinde(marcado){
  const f = lerFormPedido();
  f.brinde = marcado;
  if (marcado){ f.valor = "0,00"; f.pagamento = ""; }
  render();
}

function addLinhaPedido(){ const f = lerFormPedido(); f.linhas.push({ sabor:"", qtd:1 }); render(); }
function removerLinhaPedido(i){
  const f = lerFormPedido();
  f.linhas.splice(i, 1);
  if (!f.linhas.length) f.linhas.push({ sabor:"", qtd:1 });
  render();
}

/* Sugere o valor a partir dos sabores escolhidos, sem travar a edição. */
function sugerirValorPedido(){
  const f = lerFormPedido();
  const itens = f.linhas.filter(l => l.sabor.trim());
  if (!itens.length) return;
  const cones = itens.reduce((n, l) => n + l.qtd, 0);
  let total = 0, menorDelta = null;
  itens.forEach(l => {
    const p = PRODUTOS.find(x => semAcentoMin(x.nome) === semAcentoMin(l.sabor));
    const dupla = p ? p.dupla : 1200;
    const unit  = p ? p.unit  : 1400;
    total += dupla * l.qtd;
    const d = unit - dupla;
    if (menorDelta === null || d < menorDelta) menorDelta = d;
  });
  if (cones % 2 === 1) total += menorDelta || 0;
  f.valor = (total / 100).toFixed(2).replace(".", ",");
  render();
}
function aoEscolherSabor(){ sugerirValorPedido(); }

async function salvarFormPedido(){
  const f = lerFormPedido();
  const itens = f.linhas
    .filter(l => l.sabor.trim())
    .map(l => ({ sabor: l.sabor.trim(), quantidade: Math.max(1, l.qtd) }));

  if (!f.cliente.trim()){ alert("Informe o nome do cliente."); return; }
  if (!itens.length){ alert("Adicione ao menos um sabor."); return; }

  const centavos = f.brinde ? 0 : (() => {
    const t = String(f.valor).replace(/[^\d,.-]/g, "").trim();
    if (!t) return null;
    const n = parseFloat(t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t);
    return Number.isFinite(n) ? Math.round(n * 100) : null;
  })();

  if (f.id){
    const total = itens.reduce((n, i) => n + i.quantidade, 0);
    const { error } = await sb.from("pre_compras").update({
      itens, quantidade: total,
      sabores: itens.map(i => `${i.quantidade}× ${i.sabor}`).join(", "),
      data_entrega: f.entrega || null,
      data_pagamento: f.brinde ? null : (f.pagamento || null),
      forma_pagamento: f.brinde ? null : (f.forma.trim() || null),
      valor_centavos: centavos,
    }).eq("id", f.id);
    if (error){ avisarErro(error, "salvar o pedido"); return; }
  } else {
    const { error } = await sb.rpc("importar_pedido_ficha", {
      p_nome: f.cliente.trim(), p_itens: itens,
      p_data_entrega: f.entrega || null,
      p_data_pagamento: f.brinde ? null : (f.pagamento || null),
      p_forma_pagamento: f.brinde ? null : (f.forma.trim() || null),
      p_valor_centavos: centavos,
      p_telefone: f.telefone || null,
    });
    if (error){ avisarErro(error, "criar o pedido"); return; }
  }

  fecharFormPedido();
  await carregarAdmin();
  render();
}

/* Pedido sem pagamento e com valor zerado foi cone de brinde. */
function ehBrindeDaFicha(c){
  return !c.data_pagamento && c.valor_centavos === 0;
}

function statusDaFicha(c){
  if (ehBrindeDaFicha(c))  return "Brinde";
  if (c.data_pagamento)    return "Pagamento concluído";
  if (c.data_entrega)      return "Entregue";
  return "Pedido feito";
}

function pedidosUnificados(){
  const doSite = S.pedidos.map(p => ({
    tipo: "site", id: p.id, numero: p.numero,
    cliente: p.cliente?.nome || "—", telefone: p.cliente?.tel || "",
    itens: p.itens.map(i => ({ sabor: i.nome, quantidade: i.q })),
    cones: p.itens.reduce((n, i) => n + i.q, 0),
    valor: p.total, brinde: p.brinde, ehBrinde: p.brinde > 0,
    entrega: null, pagamento: null, forma: p.forma_pagamento || null,
    status: p.status, quando: p.criadoEm, local: p.local,
    presente: p.presente, destinatario: p.destinatario,
  }));

  const daFicha = S.admin.compras.map(c => {
    const f = S.admin.fichas.find(x => x.id === c.pre_cliente_id);
    return {
      tipo: "ficha", id: c.id, numero: null, fichaId: c.pre_cliente_id,
      cliente: f?.nome || "—", telefone: f?.telefone || "",
      itens: Array.isArray(c.itens) && c.itens.length
        ? c.itens.map(i => ({ sabor: i.sabor, quantidade: i.quantidade }))
        : [{ sabor: c.sabores || "Cones", quantidade: c.quantidade }],
      cones: c.quantidade,
      valor: c.valor_centavos, brinde: 0, ehBrinde: ehBrindeDaFicha(c),
      entrega: c.data_entrega, pagamento: c.data_pagamento, forma: c.forma_pagamento,
      status: statusDaFicha(c),
      quando: c.data_entrega || c.data_pagamento || c.criado_em,
      local: null, presente: false, destinatario: "",
    };
  });

  return [...doSite, ...daFicha].sort((a, b) => {
    const da = new Date(a.entrega || a.quando || 0);
    const db_ = new Date(b.entrega || b.quando || 0);
    return db_ - da;
  });
}

const SEQUENCIA_QUADROS = [1, 2, 1, 0];
let animCarregamento = null;

function pararAnimacaoCarregamento(){
  if (animCarregamento){ clearInterval(animCarregamento); animCarregamento = null; }

  pararAnimacaoCarregamento();
  const alvo = document.getElementById("quadro-carregando");

  if (quadros.filter(Boolean).length < 2) return;   // precisa de ao menos dois

  animCarregamento = setInterval(() => {
    i = (i + 1) % SEQUENCIA_QUADROS.length;
    const url = quadros[SEQUENCIA_QUADROS[i]] || quadros.find(Boolean);
    if (url) alvo.src = url;
  }, 200);

/* Redimensiona e comprime no navegador antes de enviar.
   Foto de celular tem 3-5 MB; isso derruba o catálogo no 4G. */
function prepararImagem(file, maxLado = 1200, qualidade = 0.82){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const w = Math.round(img.width * escala), h = Math.round(img.height * escala);
      const cv = document.createElement("canvas");
      cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? resolve(b) : reject(new Error("Falha ao processar a imagem")),
                "image/webp", qualidade);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => reject(new Error("Arquivo de imagem inválido"));
    img.src = URL.createObjectURL(file);
  });
}

async function enviarFotoProduto(input, produtoId, slug){
  const f = input.files && input.files[0];
  if (!f) return;
  if (!/^image\//.test(f.type)){ alert("Escolha um arquivo de imagem."); return; }
  const rotulo = document.getElementById("up-" + produtoId);
  if (rotulo) rotulo.textContent = "Enviando...";
  try {
    const blob = await prepararImagem(f);
    const caminho = `${slug}.webp`;
    const { error } = await sb.storage.from("produtos")
      .upload(caminho, blob, { upsert: true, contentType: "image/webp" });
    if (error) throw error;
    const { data } = sb.storage.from("produtos").getPublicUrl(caminho);
    await salvarCampoProduto(produtoId, "imagem_url", data.publicUrl + "?v=" + Date.now());
  } catch (e) {
    avisarErro(e, "enviar a foto do sabor");
    if (rotulo) rotulo.textContent = "Enviar foto";
  }
}

async function removerFotoProduto(produtoId, slug){

  // apaga o arquivo do Storage, não só a referência no banco
  await sb.storage.from("produtos").remove([`${slug}.webp`]);

async function removerSetor(indice){
  const alvo = SETORES[indice];
  if (!alvo) return;
  const nome = alvo.nome;
  if (!confirm(`Remover o setor "${nome}" da lista?\n\n` +
               `Quem já está cadastrado nele continua com o texto — só deixa de ser sugerido.`)) return;
  const { error } = await sb.from("setores").delete().eq("nome", nome);
  if (error){ avisarErro(error, "remover o setor"); return; }
  await carregarCatalogo();
  render();

async function salvarCampoProduto(id, campo, valor){
  const { error } = await sb.from("products")
    .update({ [campo]: valor, atualizado_em: new Date().toISOString() }).eq("id", id);
  if (error){ avisarErro(error, "salvar o produto"); return false; }
  const p = S.admin.produtos.find(x => x.id === id);
  if (p) p[campo] = valor;
  await carregarCatalogo();
  render();
  return true;
}
async function ajustarEstoque(id, delta){
  const p = S.admin.produtos.find(x => x.id === id);
  if (!p) return;
  await salvarCampoProduto(id, "estoque", Math.max(0, (p.estoque || 0) + delta));
}
async function definirEstoque(id, valor){
  const n = Math.max(0, parseInt(valor, 10) || 0);
  await salvarCampoProduto(id, "estoque", n);
}
async function definirPreco(id, campo, valorReais){
  const centavos = Math.round(parseFloat(String(valorReais).replace(",", ".")) * 100);
  if (!Number.isFinite(centavos) || centavos < 0){ alert("Valor inválido."); return; }
  const p = S.admin.produtos.find(x => x.id === id);
  const unit  = campo === "preco_unitario_centavos" ? centavos : p.preco_unitario_centavos;
  const dupla = campo === "preco_dupla_centavos"    ? centavos : p.preco_dupla_centavos;
  if (dupla > unit){ alert("O preço em dupla não pode ser maior que o unitário."); render(); return; }
  await salvarCampoProduto(id, campo, centavos);
}
async function zerarTodoEstoque(){

  render();
}

/* Some com o que passou de 48 horas na lixeira. */
async function limparLixeira(silencioso = false){
  const { data, error } = await sb.rpc("limpar_lixeira_avaliacoes");
  if (error){ if (!silencioso) avisarErro(error, "limpar a lixeira"); return; }
  if (Number(data) > 0){ await carregarAdmin(); render(); }
  if (!silencioso) alert(Number(data) > 0
    ? `${data} avaliação(ões) apagada(s) definitivamente.`
    : "Nada para apagar: tudo na lixeira ainda está dentro das 48 horas.");
}

function horasNaLixeira(iso){
  const h = (Date.now() - new Date(iso).getTime()) / 3600000;
  const restam = Math.max(0, 48 - h);
  return restam >= 1 ? `${Math.floor(restam)}h restantes` : "some em instantes";
}

/* ============================================================
   PAINEL — CLIENTES
   Duas origens: quem criou a própria conta e as fichas que você
   cadastrou. A ficha não é usuário: ela só espera a pessoa se
   cadastrar com o mesmo WhatsApp para ser reconhecida.
   ============================================================ */
/* ============================================================
   IMPORTAÇÃO DE PEDIDOS COLADOS DA PLANILHA
   Colunas: entrega | nome | qtd | sabor | pagamento | forma | valor
   Linhas sem data e sem nome são continuação do pedido de cima
   (mais um sabor no mesmo pedido).
   ============================================================ */
function parseDataBr(txt, anoPadrao){
  const t = String(txt || "").trim();
  if (!t) return null;
  const m = t.match(/^(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{2,4}))?$/);
  if (!m) return null;
  const dia = m[1].padStart(2, "0"), mes = m[2].padStart(2, "0");
  let ano = m[3] || String(anoPadrao ?? new Date().getFullYear());
  if (ano.length === 2) ano = "20" + ano;
  return `${ano}-${mes}-${dia}`;
}
function parseValor(txt){
  const t = String(txt || "").replace(/[^\d,.-]/g, "").trim();
  if (!t) return null;
  // "1.234,56" (brasileiro) ou "1234.56"
  const normal = t.includes(",") ? t.replace(/\./g, "").replace(",", ".") : t;
  const n = parseFloat(normal);
  return Number.isFinite(n) ? Math.round(n * 100) : null;
}
function parseQtd(txt){
  const n = parseInt(String(txt || "").replace(/\D/g, ""), 10);
  return Number.isFinite(n) && n > 0 ? n : null;
}

/* ============================================================
   LEITURA DA PLANILHA
   Em vez de confiar na posição das colunas, cada célula é
   classificada pelo que ela contém: data, telefone, dinheiro,
   forma de pagamento, número ou texto. Assim colunas a mais,
   a menos ou fora de ordem continuam funcionando.
   ============================================================ */
const FORMAS_PAGAMENTO = ["pix","dinheiro","cartao","cartão","credito","crédito",
  "debito","débito","transferencia","transferência","especie","espécie","fiado","cortesia"];

const soDigitos = t => String(t || "").replace(/\D/g, "");
const ehData     = t => /^\d{1,2}[\/\-.]\d{1,2}([\/\-.]\d{2,4})?$/.test(String(t||"").trim());
const ehTelefone = t => [10,11].includes(soDigitos(t).length) && /\d[\s\-()]*\d/.test(String(t||""));
const ehDinheiro = t => /r\$/i.test(String(t||"")) || /^\d{1,3}(\.\d{3})*,\d{2}$/.test(String(t||"").trim());
const ehForma    = t => FORMAS_PAGAMENTO.includes(semAcentoMin(t));
const ehNumero   = t => /^\d{1,3}$/.test(String(t||"").trim());
const temLetras  = t => /[a-zà-ú]/i.test(String(t||""));

function classificarLinha(linha){
  const celulas = linha.split(/\t|;|\s{2,}/).map(c => c.trim());
  const r = { datas: [], telefone: null, valor: null, forma: null, quantidades: [], textos: [] };

  celulas.forEach((c, i) => {
    if (!c) return;
    if (ehData(c))      { r.datas.push({ txt: c, i }); return; }
    if (ehTelefone(c))  { if (!r.telefone) r.telefone = c; return; }
    if (ehDinheiro(c))  { if (r.valor === null) r.valor = c; return; }
    if (ehForma(c))     { if (!r.forma) r.forma = c; return; }
    if (ehNumero(c))    { r.quantidades.push({ txt: c, i }); return; }
    if (temLetras(c))   { r.textos.push({ txt: c, i }); return; }
  });
  return r;
}

function interpretarPlanilha(texto){
  const linhas = String(texto || "").split(/\r?\n/);
  const pedidos = [];
  const problemas = [];

  linhas.forEach((linha, i) => {
    if (!linha.trim()) return;

    const c = classificarLinha(linha);
    // cabeçalho: linha só com palavras e nenhuma quantidade, data ou valor
    const pareceCabecalho = c.textos.length >= 3 && !c.datas.length &&
      !c.quantidades.length && c.valor === null && !c.telefone;
    if (pareceCabecalho) return;

    if (c.textos.length === 0 && c.quantidades.length === 0){
      problemas.push({ linha: i + 1, motivo: "linha sem conteúdo aproveitável", texto: linha.trim() });
      return;
    }

    // Dos textos sobrando: o primeiro costuma ser o nome, o último o sabor.
    let nome = null, sabor = null;
    if (c.textos.length >= 2){ nome = c.textos[0].txt; sabor = c.textos[c.textos.length - 1].txt; }
    else if (c.textos.length === 1){
      // Só um texto: é nome se vier antes da quantidade, senão é sabor.
      const t = c.textos[0];
      const q = c.quantidades[0];
      if (q && t.i > q.i) sabor = t.txt; else nome = t.txt;
    }

    const qtd = c.quantidades.length ? parseInt(c.quantidades[0].txt, 10) : null;
    const anterior = pedidos[pedidos.length - 1];

    // Continuação: sem data de entrega e sem nome novo — ou repetindo a
    // mesma pessoa da linha de cima (nome e WhatsApp duplicados).
    // O telefone decide primeiro: dois números diferentes são duas pessoas,
    // mesmo que o nome seja idêntico.
    let mesmaPessoa = false;
    if (anterior){
      if (c.telefone && anterior.telefone){
        mesmaPessoa = soDigitos(c.telefone) === soDigitos(anterior.telefone);
      } else if (nome){
        mesmaPessoa = semAcentoMin(nome) === semAcentoMin(anterior.nome);
      } else {
        mesmaPessoa = true;   // linha só com quantidade e sabor
      }
    }

    if (!c.datas.length && mesmaPessoa && (sabor || qtd)){
      anterior.itens.push({ sabor: sabor || "Não informado", quantidade: qtd || 1 });
      if (!anterior.telefone && c.telefone) anterior.telefone = c.telefone;
      return;
    }

    if (!nome){
      problemas.push({ linha: i + 1, motivo: "não achei o nome do cliente", texto: linha.trim() });
      return;
    }

    // Tolerante: sem quantidade assume 1, sem sabor grava "Não informado".
    pedidos.push({
      nome,
      telefone: c.telefone || null,
      itens: [{ sabor: sabor || "Não informado", quantidade: qtd || 1 }],
      entrega: c.datas[0] ? parseDataBr(c.datas[0].txt) : null,
      entregaTexto: c.datas[0]?.txt || "",
      pagamento: c.datas[1] ? parseDataBr(c.datas[1].txt) : null,
      forma: c.forma || null,
      valor: c.valor !== null ? parseValor(c.valor) : null,
      linha: i + 1,
      incompleto: !sabor || !qtd ? true : false,
    });
  });

  return { pedidos, problemas };
}

/* Confere o que foi entendido antes de gravar. */
function analisarImportacao(){
  const txt = document.getElementById("imp-texto").value;

async function confirmarImportacao(){
  const imp = S.admin.importacao;
  if (!imp || imp.pedidos.length === 0) return;
  imp.importando = true; render();

  let ok = 0; const erros = [];
  for (const p of imp.pedidos){
    const { error } = await sb.rpc("importar_pedido_ficha", {
      p_nome: p.nome,
      p_itens: p.itens,
      p_data_entrega: p.entrega,
      p_data_pagamento: p.pagamento,
      p_forma_pagamento: p.forma,
      p_valor_centavos: p.valor,
      p_telefone: p.telefone,
    });
    if (error) erros.push(`${p.nome} (linha ${p.linha}): ${error.message}`);
    else ok++;
  }

  imp.importando = false;
  imp.resultado = { ok, erros };
  await carregarAdmin();
  render();
}

/* Importa várias fichas de uma vez.
   Uma por linha, no formato:  Nome ; WhatsApp ; Setor  */
async function importarFichas(){
  const txt = document.getElementById("f-lote").value.trim();
  if (!txt){ alert("Cole a lista antes de importar."); return; }
  const linhas = txt.split("\n").map(l => l.trim()).filter(Boolean);
  const fichas = [];
  const ruins = [];
  linhas.forEach((l, i) => {
    const partes = l.split(/[;\t|]/).map(p => p.trim());
    const nome = partes[0], tel = digitos(partes[1] || ""), setor = partes[2] || null;
    if (!nome || tel.length < 10) { ruins.push(`linha ${i+1}: ${l}`); return; }
    fichas.push({ nome, telefone: tel, setor });
  });
  if (fichas.length === 0){ alert("Nenhuma linha válida encontrada.\n\n" + ruins.join("\n")); return; }

  const { error } = await sb.from("pre_clientes").upsert(fichas, { onConflict: "telefone" });
  if (error){ avisarErro(error, "importar a lista de fichas"); return; }
  document.getElementById("f-lote").value = "";
  await carregarAdmin(); render();
  alert(`${fichas.length} ficha(s) importada(s).` +
        (ruins.length ? `\n\n${ruins.length} linha(s) ignorada(s):\n` + ruins.join("\n") : ""));
}
