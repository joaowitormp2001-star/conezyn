      ${f.recusas > 0 && !f.vinculado_a
        ? `<span class="badge b-esgotado" style="text-transform:none"
             title="Alguém se cadastrou com este WhatsApp e respondeu que não era esta pessoa. Confira se o número está certo.">
             ⚠️ recusou o vínculo ${f.recusas > 1 ? f.recusas + "×" : ""}</span>`
        : ""}
      ${f.vinculado_a
        ? `<button class="badge b-classico" style="cursor:pointer"
             title="Ver informações completas do cliente"
             onclick="verCliente('${f.vinculado_a}')">
             Vinculado a ${esc(dono ? dono.nome : "conta ativa")} ↗</button>`
        : `<span class="badge b-novo">sem vínculo</span>`}
      <button class="btn btn-ghost" style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
        onclick="abrirFicha('${f.id}')">${aberta ? "Fechar" : "Detalhes"}</button>
      <button class="btn" style="background:var(--framboesa);color:#fff;min-height:2.1rem;
        padding:.25rem .8rem;font-size:.75rem" onclick="excluirFicha('${f.id}')">Excluir</button>
    </div>

    ${!aberta ? "" : `<div style="border-top:1px solid rgb(62 39 35/.08);margin-top:.75rem;padding-top:.75rem">

      <p style="font-weight:700;font-size:.8rem">
        Histórico de pedidos
        ${f.total_cones ? `<span class="muted" style="font-weight:400">
          — ${f.total_compras} pedido(s), ${f.total_cones} cone(s) no total</span>` : ""}</p>

      ${compras.length === 0
        ? `<p class="muted" style="font-size:.75rem;margin-top:.25rem">Nenhum pedido registrado.</p>`
        : `<ul style="list-style:none;margin-top:.5rem;display:flex;flex-direction:column;gap:.4rem">
            ${visiveis.map(c => {
              const itens = Array.isArray(c.itens) && c.itens.length
                ? c.itens.map(i => `${i.quantidade}× ${esc(i.sabor)}`).join(", ")
                : esc(c.sabores || `${c.quantidade} cone(s)`);
              return `<li style="display:flex;gap:.5rem;align-items:start;font-size:.78rem;
                  background:var(--chantilly);border-radius:.6rem;padding:.5rem .65rem">
                <span style="flex:1">
                  <strong>${c.quantidade} cone(s)</strong> · ${itens}
                  <span class="muted" style="display:block;font-size:.72rem;margin-top:.15rem">
                    ${dataBr(c.data_entrega) ? "entrega " + dataBr(c.data_entrega) : "sem data de entrega"}
                    ${dataBr(c.data_pagamento) ? " · pago em " + dataBr(c.data_pagamento) : " · pagamento não registrado"}
                    ${c.forma_pagamento ? " · " + esc(c.forma_pagamento) : ""}
                    ${c.valor_centavos ? " · " + reais(c.valor_centavos) : ""}
                  </span>
                </span>
                <button style="font-size:.72rem;font-weight:700;color:var(--cacau);text-decoration:underline"
                  onclick="editarCompra('${f.id}','${c.id}')">editar</button>
                <button style="font-size:.72rem;font-weight:700;color:var(--framboesa);text-decoration:underline"
                  onclick="excluirCompraFicha('${c.id}')">excluir</button>
              </li>`;
            }).join("")}
          </ul>
          ${compras.length > 3 ? `<button class="btn btn-ghost"
            style="margin-top:.5rem;min-height:2rem;padding:.2rem .8rem;font-size:.74rem"
            onclick="verTodosPedidos('${f.id}')">
            ${expandido ? "Mostrar menos" : `Ver todos os ${compras.length} pedidos`}</button>` : ""}`}

      <div style="background:var(--chantilly-esc);border-radius:.7rem;padding:.7rem;margin-top:.9rem">
        <p style="font-weight:700;font-size:.78rem">
          ${form.editando ? "Editando um pedido" : "Registrar um pedido antigo"}</p>

        ${form.linhas.map((l, i) => `<div style="display:flex;gap:.4rem;align-items:end;margin-top:.45rem">
          <label style="font-size:.7rem;font-weight:600">Qtd
            <input id="lc-qtd-${f.id}-${i}" class="field" type="number" min="1" value="${l.qtd}"
              style="width:4.2rem;padding:.35rem .5rem;display:block;margin-top:.12rem"></label>
          <label style="font-size:.7rem;font-weight:600;flex:1">Sabor
            <input id="lc-sab-${f.id}-${i}" class="field" list="sabores-lista" value="${esc(l.sabor)}"
              placeholder="Brigadeiro" style="padding:.35rem .5rem;display:block;margin-top:.12rem"></label>
          <button style="font-size:1rem;color:var(--framboesa);padding:.3rem .4rem"
            title="Remover esta linha" aria-label="Remover linha"
            onclick="removerLinha('${f.id}',${i})">×</button>
        </div>`).join("")}

        <button class="btn btn-ghost" style="margin-top:.5rem;min-height:2rem;padding:.2rem .8rem;font-size:.74rem"
          onclick="addLinha('${f.id}')">+ outro sabor</button>

        <div style="display:flex;flex-wrap:wrap;gap:.4rem;align-items:end;margin-top:.6rem">
          <label style="font-size:.7rem;font-weight:600">Entrega
            <input id="lc-ent-${f.id}" class="field" type="date" value="${form.entrega || ""}"
              style="padding:.35rem .5rem;display:block;margin-top:.12rem"></label>
          <label style="font-size:.7rem;font-weight:600">Pagamento
            <input id="lc-pag-${f.id}" class="field" type="date" value="${form.pagamento || ""}"
              style="padding:.35rem .5rem;display:block;margin-top:.12rem"></label>
          <label style="font-size:.7rem;font-weight:600">Forma
            <input id="lc-forma-${f.id}" class="field" list="formas-lista" value="${esc(form.forma || "")}"
              placeholder="Pix" style="width:7rem;padding:.35rem .5rem;display:block;margin-top:.12rem"></label>
          <button class="btn btn-primary" style="min-height:2.1rem;padding:.25rem .9rem;font-size:.75rem"
            onclick="salvarCompra('${f.id}')">${form.editando ? "Salvar alterações" : "Registrar pedido"}</button>
          ${form.editando ? `<button class="btn btn-ghost"
            style="min-height:2.1rem;padding:.25rem .8rem;font-size:.75rem"
            onclick="cancelarEdicao('${f.id}')">Cancelar</button>` : ""}
        </div>
      </div>

      ${f.vinculado_a ? "" : `
      <p style="font-weight:700;font-size:.8rem;margin-top:1rem">Vincular a uma conta existente</p>
      <p class="muted" style="font-size:.72rem">
        Use quando a pessoa já criou conta com outro WhatsApp. Os cones do histórico viram carimbos.</p>
      <div style="display:flex;gap:.4rem;margin-top:.4rem;flex-wrap:wrap">
        <select id="vinc-${f.id}" class="field" style="flex:1;min-width:11rem;padding:.4rem .6rem">
          <option value="">Escolha a conta...</option>
          ${S.admin.clientes.map(c => `<option value="${c.id}">${esc(c.nome)}${c.setor?" — "+esc(c.setor):""}</option>`).join("")}
        </select>
        <button class="btn btn-primary" style="min-height:2.1rem;padding:.25rem .9rem;font-size:.75rem"
          onclick="vincularFichaConta('${f.id}')">Vincular</button>
      </div>`}
    </div>`}
  </div>`;
}

function render(){
  if (S.carregando) { document.getElementById("app").innerHTML = vCarregando(); return; }
  if (S.erroBanco)  { document.getElementById("app").innerHTML = vErroBanco();  return; }
  if (S.perfil?.admin) ligarTempoReal();
  if (S.perfil?.admin && S.view === "admin" && !S.admin.carregado) carregarAdmin().then(render);
  const views = { home:vHome, produto:vProduto, carrinho:vCarrinho, checkout:vCheckout,
    confirmado:vConfirmado, login:()=>vLogin(false), cadastro:vCadastro, conta:vConta,
    pedidos:vPedidos, fidelidade:vFidelidade, admin:vAdmin };
  if (S.view!=="produto") pqv = 1;
  document.getElementById("app").innerHTML = (views[S.view]||vHome)();
  // as tags de setor precisam ser desenhadas depois que a tela existe
  if (document.getElementById("local-tags")) desenharSetores("local-tags", "local");
  if (document.getElementById("pr-setor-tags")) desenharSetores("pr-setor-tags", "pr-setor");
  if (document.getElementById("f-setor-tags")) desenharSetores("f-setor-tags", "f-setor");
  if (document.getElementById("c-setor-tags")) desenharSetores("c-setor-tags", "c-setor");
  // o carrossel abre no cartão atual, com os completos à esquerda
  const carrossel = document.getElementById("fid-carrossel");
  if (carrossel) carrossel.scrollLeft = carrossel.scrollWidth;
  const sw = document.getElementById("switch-btn");
  sw.style.display = S.perfil?.admin ? "inline-flex" : "none";
  sw.textContent = S.view==="admin" ? "← Ver loja" : "Painel admin";
}
iniciar();
</script>
</body>
</html>
