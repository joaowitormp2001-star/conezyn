<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cones da Casa — Preview do Front-end</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#3e2723">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --cacau:#3e2723; --cacau-claro:#5d4037;
    --casquinha:#c8955c; --casquinha-claro:#e8c79a;
    --chantilly:#fff9f2; --chantilly-esc:#f6ead9;
    --pistache:#7a9b76; --framboesa:#c94f5e;
    --radius:1.25rem; --shadow:0 4px 20px -6px rgb(62 39 35 / .12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--chantilly);color:var(--cacau);font-family:"Inter",system-ui,sans-serif;min-height:100dvh}
  .display{font-family:"Fraunces",Georgia,serif}
  a{color:inherit;text-decoration:none}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input,textarea,select{font-family:inherit;font-size:.875rem;color:var(--cacau)}
  :focus-visible{outline:3px solid var(--casquinha);outline-offset:2px;border-radius:6px}
  .wrap{max-width:64rem;margin:0 auto;padding:0 1rem}
  .card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow)}
  .carimbo{border:2px dashed currentColor;border-radius:9999px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:2.75rem;
       padding:.625rem 1.5rem;border-radius:9999px;font-size:.875rem;font-weight:600;transition:.15s}
  .btn-primary{background:var(--cacau);color:var(--chantilly)}
  .btn-primary:hover{background:var(--cacau-claro)}
  .btn-primary:disabled{background:rgb(62 39 35 / .3);cursor:not-allowed}
  .btn-ghost{border:1px solid rgb(62 39 35 / .2)}
  .btn-ghost:hover{background:var(--chantilly-esc)}
  .btn-verde{background:var(--pistache);color:#fff}
  .badge{display:inline-flex;align-items:center;border-radius:9999px;padding:.15rem .65rem;
         font-size:.65rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .b-classico{background:var(--chantilly-esc);color:var(--cacau)}
  .b-premium{background:var(--cacau);color:var(--casquinha-claro)}
  .b-novo{background:var(--pistache);color:#fff}
  .b-vendido{background:var(--cacau);color:var(--casquinha-claro)}
  .b-esgotado{background:var(--framboesa);color:#fff}
  .field{width:100%;border:1px solid rgb(62 39 35 / .15);background:var(--chantilly);
         border-radius:.75rem;padding:.75rem 1rem}
  .field::placeholder{color:rgb(62 39 35 / .4)}
  .label{font-size:.875rem;font-weight:600;display:block;margin-bottom:.25rem}
  .muted{color:rgb(62 39 35 / .55)}
  .stars{color:var(--casquinha);letter-spacing:-.05em}
  .stars .off{color:rgb(62 39 35 / .2)}
  header.loja{position:sticky;top:0;z-index:40;backdrop-filter:blur(8px);
    background:rgb(255 249 242 / .9);border-bottom:1px solid rgb(62 39 35 / .08)}
  header.loja .inner{display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.75rem 0}
  .logo{display:flex;align-items:center;gap:.5rem;font-weight:900;font-size:1.25rem;letter-spacing:-.02em}
  .logo .selo{width:2.5rem;height:2.5rem;display:grid;place-items:center;color:var(--casquinha);font-size:1.1rem}
  .cart-btn{position:relative;width:2.75rem;height:2.75rem;display:grid;place-items:center;
    border-radius:9999px;background:var(--cacau);color:var(--chantilly);font-size:1.1rem}
  .cart-count{position:absolute;top:-4px;right:-4px;width:1.25rem;height:1.25rem;display:grid;place-items:center;
    border-radius:9999px;background:var(--framboesa);color:#fff;font-size:.68rem;font-weight:700}
  .hero{position:relative;overflow:hidden;background:var(--cacau);color:var(--chantilly);
    border-radius:var(--radius);padding:2.5rem 1.5rem;box-shadow:var(--shadow)}
  .hero .big{position:absolute;right:-1.5rem;bottom:-2rem;font-size:10rem;opacity:.2;pointer-events:none}
  .hero h1{font-size:clamp(2rem,5vw,3rem);font-weight:900;line-height:1.1;max-width:26rem;margin-top:1rem}
  .grid{display:grid;gap:1rem}
  @media(min-width:600px){.grid.c2{grid-template-columns:1fr 1fr}}
  @media(min-width:900px){.grid.c3{grid-template-columns:repeat(3,1fr)}
    .split{display:grid;grid-template-columns:1fr 20rem;gap:1.5rem;align-items:start}
    .split aside{position:sticky;top:6rem}}
  .pcard{display:flex;flex-direction:column;overflow:hidden;transition:transform .15s}
  .pcard:hover{transform:translateY(-2px)}
  .pcard.esgotado{filter:saturate(.5)}
  .pfoto{position:relative;aspect-ratio:4/3;display:grid;place-items:center;font-size:3.75rem;cursor:pointer}
  .pfoto .tags{position:absolute;top:.5rem;left:.5rem;display:flex;flex-wrap:wrap;gap:.25rem}
  .pbody{display:flex;flex-direction:column;gap:.5rem;padding:1rem;flex:1}
  .chips{display:flex;gap:.5rem;overflow-x:auto;padding-bottom:.25rem}
  .chip{flex-shrink:0;min-height:2.75rem;padding:0 1.25rem;border-radius:9999px;font-size:.875rem;font-weight:600;
    background:#fff;box-shadow:var(--shadow)}
  .chip[aria-selected="true"]{background:var(--cacau);color:var(--chantilly)}
  .stepper{display:inline-flex;align-items:center;gap:.25rem;border:1px solid rgb(62 39 35 / .15);
    border-radius:9999px;background:#fff}
  .stepper button{width:2.5rem;height:2.5rem;border-radius:9999px;font-size:1.1rem;font-weight:700}
  .stepper button:disabled{opacity:.3;cursor:not-allowed}
  .stepper span{width:1.5rem;text-align:center;font-size:.875rem;font-weight:700}
  .radio-opt{display:flex;align-items:center;flex-wrap:wrap;gap:.75rem;min-height:3rem;padding:.5rem 1rem;
    border-radius:.75rem;border:1px solid rgb(62 39 35 / .15);background:rgb(255 255 255 / .6);cursor:pointer}
  .radio-opt.on{border-color:var(--cacau);background:#fff}
  .radio-opt input[type=radio]{accent-color:var(--cacau)}
  .status{display:inline-flex;border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .st-Pendente{background:var(--casquinha-claro)} .st-Confirmado{background:var(--chantilly-esc)}
  .st-Em_preparo{background:var(--casquinha);color:#fff} .st-A_caminho{background:var(--cacau-claro);color:#fff}
  .st-Entregue{background:var(--pistache);color:#fff} .st-Cancelado{background:var(--framboesa);color:#fff}
  header.admin{position:sticky;top:0;z-index:40;background:var(--cacau);color:var(--chantilly);
    border-bottom:1px solid rgb(62 39 35 / .1)}
  header.admin .inner{max-width:72rem;margin:0 auto;padding:.75rem 1rem}
  header.admin .row1{display:flex;align-items:center;justify-content:space-between;gap:.75rem}
  header.admin nav{display:flex;gap:.25rem;margin-top:.5rem}
  header.admin nav button{min-height:2.5rem;padding:.4rem 1rem;border-radius:9999px;font-size:.875rem;font-weight:600;color:rgb(255 249 242/.7)}
  header.admin nav button[aria-current]{background:var(--chantilly);color:var(--cacau)}
  .pill-pend{background:var(--casquinha);color:var(--cacau);border-radius:9999px;padding:.25rem .75rem;font-size:.72rem;font-weight:700}
  .toast{position:fixed;right:1rem;bottom:5.5rem;z-index:60;width:min(24rem,calc(100% - 2rem));
    background:var(--cacau);color:var(--chantilly);border-radius:var(--radius);padding:1rem;box-shadow:var(--shadow);
    animation:toastin .25s ease-out}
  @keyframes toastin{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  .switch{position:fixed;left:1rem;bottom:1rem;z-index:50;box-shadow:var(--shadow)}
  .alerta{background:rgb(201 79 94 / .1);color:var(--framboesa);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  .ok{background:rgb(122 155 118 / .15);color:var(--pistache);border-radius:.75rem;
    padding:.75rem 1rem;font-size:.875rem;font-weight:600}
  dl.linhas{display:flex;flex-direction:column;gap:.4rem;font-size:.875rem}
  dl.linhas>div{display:flex;justify-content:space-between}
  .total-row{border-top:1px solid rgb(62 39 35 / .1);padding-top:.5rem;margin-top:.25rem;
    font-size:1.25rem;font-weight:900}
  .stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:.75rem;margin-top:1.25rem}
  .stamps .s{aspect-ratio:1;display:grid;place-items:center;font-size:1.1rem;color:rgb(255 249 242 / .3)}
  .stamps .s.on{background:var(--casquinha);color:var(--cacau)}
  .dep-carousel{overflow:hidden;position:relative;padding:1rem 0;
    mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent)}
  .dep-track{display:flex;gap:1rem;width:max-content;animation:marquee 45s linear infinite}
  .dep-carousel:hover .dep-track{animation-play-state:paused}
  @keyframes marquee{from{transform:translateX(0)}to{transform:translateX(calc(-50% - .5rem))}}
  .dep-card{width:18rem;flex-shrink:0;padding:1.25rem;transition:transform .2s ease}
  .dep-card:hover{transform:scale(1.04)}
  @media(prefers-reduced-motion:reduce){.dep-track{animation:none}.dep-carousel{overflow-x:auto;mask-image:none;-webkit-mask-image:none}}
  .cart-toast{position:fixed;top:1rem;right:1rem;z-index:70;width:min(20rem,calc(100% - 2rem));
    padding:1rem 1rem .85rem;animation:ct-in .3s ease-out}
  .cart-toast.out{animation:ct-out .35s ease-in forwards}
  .ct-close{position:absolute;top:.4rem;left:.4rem;width:1.85rem;height:1.85rem;border-radius:9999px;
    display:grid;place-items:center;font-size:.9rem;line-height:1;color:rgb(62 39 35/.55)}
  .ct-close:hover{background:rgb(62 39 35/.08);color:var(--cacau)}
  .ct-body{display:flex;gap:.75rem;align-items:center;padding-left:1.35rem}
  .ct-foot{display:flex;justify-content:flex-end;margin-top:.7rem}
  @keyframes ct-in{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes ct-out{to{transform:translateY(-16px);opacity:0}}
  .avatar{width:2.5rem;height:2.5rem;border-radius:9999px;object-fit:cover;flex-shrink:0;
    display:grid;place-items:center;background:var(--casquinha-claro);color:var(--cacau);
    font-size:.8rem;font-weight:700;letter-spacing:.02em}
  .avatar.lg{width:5rem;height:5rem;font-size:1.5rem}
  .back-btn{width:2.75rem;height:2.75rem;flex-shrink:0;display:grid;place-items:center;border-radius:9999px;
    border:1px solid rgb(62 39 35/.15);background:#fff;font-size:1.1rem;box-shadow:var(--shadow)}
  /* linha que ultrapassa a borda direita da tela e pode ser rolada */
  .bleed-row{margin-right:calc(50% - 50vw);overflow-x:auto;scroll-snap-type:x proximity;
    display:flex;gap:1rem;padding:.35rem 1rem 1rem .3rem}
  .bleed-row>*{scroll-snap-align:start}
  .sabor-card{width:15rem;flex-shrink:0;display:flex;flex-direction:column;overflow:hidden;
    transition:transform .15s}
  .sabor-card:hover{transform:translateY(-2px)}
  .sabor-foto{aspect-ratio:4/3;display:grid;place-items:center;font-size:2.75rem;position:relative;cursor:pointer}
  .av-row{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center}
  .av-card{width:min(100%,19rem);padding:1.15rem;display:flex;flex-direction:column}
  .modal-overlay{position:fixed;inset:0;z-index:80;background:rgb(62 39 35/.45);
    display:grid;place-items:center;padding:1rem;animation:ov-in .15s ease-out}
  @keyframes ov-in{from{opacity:0}to{opacity:1}}
  .modal{width:100%;max-width:26rem;max-height:82dvh;overflow-y:auto;padding:1.5rem}
  .rating-btn{display:inline-flex;align-items:center;gap:.35rem;border-radius:.5rem;text-align:left}
  .rating-btn:hover{text-decoration:underline}
  /* dica discreta ao lado do rótulo do campo */
  .dica{position:relative;display:inline-flex;vertical-align:middle;margin-left:.3rem}
  .dica-btn{width:1rem;height:1rem;border-radius:9999px;display:grid;place-items:center;
    font-size:.62rem;font-weight:800;line-height:1;color:rgb(62 39 35/.45);
    border:1px solid rgb(62 39 35/.3);background:transparent;cursor:help;transition:.15s}
  .dica:hover .dica-btn,.dica-btn:focus-visible{color:var(--cacau);border-color:var(--cacau)}
  .dica-bolha{position:absolute;bottom:calc(100% + .45rem);left:50%;transform:translateX(-50%);
    width:max-content;max-width:14rem;background:var(--cacau);color:var(--chantilly);
    padding:.5rem .7rem;border-radius:.6rem;font-size:.72rem;font-weight:400;line-height:1.35;
    text-align:left;box-shadow:var(--shadow);opacity:0;visibility:hidden;transition:.15s;z-index:20;
    pointer-events:none}
  .dica-bolha::after{content:"";position:absolute;top:100%;left:50%;transform:translateX(-50%);
    border:5px solid transparent;border-top-color:var(--cacau)}
  .dica:hover .dica-bolha,.dica-btn:focus-visible+.dica-bolha{opacity:1;visibility:visible}
  @media(max-width:480px){.dica-bolha{left:0;transform:none}.dica-bolha::after{left:.6rem;transform:none}}
  /* ---------- Cartão fidelidade (arte conezyn) ---------- */
  .fid{--roxo:#471C76;--roxo-esc:#3A1267;--laranja:#EB791C;--bege:#A18D80;
    position:relative;overflow:hidden;border-radius:var(--radius);background:var(--roxo);
    color:#fff;padding:1.5rem 1.25rem 1.25rem;box-shadow:var(--shadow)}
  .fid-onda{position:absolute;top:0;left:0;width:100%;height:5.5rem;pointer-events:none}
  .fid-cone-bg{position:absolute;width:9rem;opacity:.55;pointer-events:none;color:var(--roxo-esc)}
  .fid-cone-bg.e{left:-3.5rem;bottom:-1rem;transform:rotate(-12deg)}
  .fid-cone-bg.d{right:-3.5rem;bottom:-2rem;transform:rotate(14deg)}
  .fid-topo{position:relative;display:flex;align-items:center;justify-content:center;gap:.5rem;
    font-weight:800;font-size:.95rem}
  .fid-badge{background:var(--laranja);color:#fff;border-radius:.45rem;padding:.1rem .6rem;
    font-size:.8rem;font-weight:800}
  .fid-titulo{position:relative;text-align:center;margin-top:.6rem;font-size:clamp(1.15rem,4.5vw,1.6rem);
    font-weight:400;line-height:1.15}
  .fid-titulo strong{font-weight:800}
  .fid-grade{position:relative;display:grid;grid-template-columns:repeat(5,1fr);gap:.55rem;
    margin:1.1rem auto 0;max-width:26rem}
  .fid-selo{aspect-ratio:1;border-radius:9999px;background:#fff;display:grid;place-items:center;position:relative}
  .fid-selo svg{width:62%;height:62%}
  .fid-rodape{position:relative;text-align:center;margin-top:1.1rem;font-size:.8rem;opacity:.95}
  .fid-rodape strong{font-weight:800}
  .fid-progresso{position:relative;text-align:center;margin-top:.9rem;font-size:.85rem}
  @media(max-width:420px){.fid-grade{gap:.4rem}}
  section{scroll-margin-top:6rem}
  footer{margin-top:4rem;border-top:1px solid rgb(62 39 35 / .08);padding:2rem 0;
    text-align:center;font-size:.75rem;color:rgb(62 39 35 / .5)}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast-slot"></div>
<div id="cart-toast-slot"></div>
<div id="modal-slot"></div>
<button class="btn btn-primary switch" id="switch-btn" onclick="toggleAdmin()">Painel admin</button>

<script>
/* ============================================================
   PREVIEW EM ARQUIVO ÚNICO — mesmas telas, tokens e engine do
   projeto Next.js. Estado em memória (dura a sessão da página):
   no projeto real isso é localStorage → Supabase.
   ============================================================ */

/* ============================================================
   CONEXÃO COM O SUPABASE
   A chave publishable é pública por design: quem protege os dados
   é o Row Level Security, que roda dentro do banco.
   ============================================================ */
const SUPABASE_URL  = "https://cdywhgtznomqvhtzcnzk.supabase.co";
const SUPABASE_KEY  = "sb_publishable_AR2vWWr_u5NiVG-3ovWufg_ujH1fvhr";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* Aparência dos sabores enquanto não houver foto no Storage. */
const VISUAL = {
  brigadeiro:      { emoji:"🍫", grad:"linear-gradient(135deg,#5d4037,#3e2723)" },
  kitkat:          { emoji:"🍪", grad:"linear-gradient(135deg,#8d5a3b,#5d4037)" },
  prestigio:       { emoji:"🥥", grad:"linear-gradient(135deg,#6b4f3a,#4e342e)" },
  "doce-de-leite": { emoji:"🍮", grad:"linear-gradient(135deg,#c8955c,#8d5a3b)" },
  "ferrero-rocher":{ emoji:"🌰", grad:"linear-gradient(135deg,#7a5230,#3e2723)" },
  "kinder-bueno":  { emoji:"🤍", grad:"linear-gradient(135deg,#e8c79a,#c8955c)" },
  _padrao:         { emoji:"🍦", grad:"linear-gradient(135deg,#8d5a3b,#3e2723)" },
};

let PRODUTOS = [];     // preenchido pelo banco
let AVALIACOES = [];   // idem

const MIN_DEPOIMENTOS = 7;
const STATUS = ["Pendente","Confirmado","Em preparo","A caminho","Entregue","Cancelado"];
let META_CARIMBOS = 10;
const ANTECEDENCIA_MIN = 20;

/* ---------- Estado da sessão do navegador ---------- */
const S = {
  view: "home", param: null,
  perfil: null,               // { id, nome, tel, email, foto, admin }
  carrinho: {},
  pedidos: [],
  fidelidade: { total: 0, historico: [] },
  filtro: "todos",
  checkout: { local:"", quando:"agora", hora:"", erro:null },
  sugestaoOk: false, loginErro: null, cadastroErro: null, voltarPara: null,
  hist: [],
  adminTab: "dash", adminFiltro: "todos",
  admin: { produtos: [], avaliacoes: [], sugestoes: [], carregado: false },
  notif: { ativo: false, som: true, log: [] },
  carregando: true, erroBanco: null, ocupado: false,
};
const byId = id => PRODUTOS.find(p => p.id === id);
const reais = c => (c/100).toLocaleString("pt-BR",{style:"currency",currency:"BRL"});

/* ============================================================
   CARGA DE DADOS
   ============================================================ */
function mapearProduto(row, avaliacao){
  const v = VISUAL[row.slug] || VISUAL._padrao;
  const tags = [];
  if (row.novo) tags.push("Novo");
  if (row.mais_vendido) tags.push("Mais vendido");
  return {
    id: row.id, slug: row.slug, nome: row.nome, desc: row.descricao || "",
    cat: row.categories?.slug === "premium" ? "premium" : "classico",
    unit: row.preco_unitario_centavos, dupla: row.preco_dupla_centavos,
    estoque: row.estoque, destaque: row.destaque, tags,
    img: row.imagem_url || null, emoji: v.emoji, grad: v.grad,
    nota: avaliacao?.media != null ? Number(avaliacao.media) : 0,
    qtd:  avaliacao?.total != null ? Number(avaliacao.total) : 0,
  };
}

async function carregarCatalogo(){
  const [prod, medias, avs, cfg] = await Promise.all([
    sb.from("products").select("*, categories(slug, nome)").eq("ativo", true).order("nome"),
    sb.from("produtos_avaliacao").select("*"),
    sb.from("avaliacoes_publicas").select("*").order("criado_em", { ascending:false }).limit(30),
    sb.from("settings").select("*").eq("chave","meta_carimbos").maybeSingle(),
  ]);
  if (prod.error) throw prod.error;

  const porProduto = Object.fromEntries((medias.data||[]).map(m => [m.produto_id, m]));
  PRODUTOS = (prod.data||[]).map(r => mapearProduto(r, porProduto[r.id]));

  AVALIACOES = (avs.data||[]).map(a => ({
    pid: a.produto_id, nome: a.nome || "Cliente", nota: a.nota,
    txt: a.comentario || "", foto: a.foto_url || null,
    data: new Date(a.criado_em).toLocaleDateString("pt-BR"),
  })).filter(a => a.txt.trim().length > 0);

  if (cfg.data?.valor) META_CARIMBOS = Number(cfg.data.valor) || 10;
}

async function carregarPerfil(){
  const { data:{ user } } = await sb.auth.getUser();
  if (!user){ S.perfil = null; return; }
  const { data } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  S.perfil = {
    id: user.id,
    nome: data?.nome || user.user_metadata?.nome || "Cliente",
    tel: data?.telefone || "",
    email: data?.email || user.email || "",
    foto: data?.foto_url || null,
    admin: data?.papel === "admin",
  };
}

function mapearPedido(row){
  return {
    id: row.id, numero: row.numero,
    cliente: { nome: row.profiles?.nome || (S.perfil?.nome ?? "Cliente"),
               tel:  row.profiles?.telefone || (S.perfil?.tel ?? "") },
    itens: (row.order_items||[]).map(i => ({
      produtoId: i.produto_id, nome: i.nome_produto,
      q: i.quantidade, efetivo: i.preco_efetivo_centavos,
    })),
    subtotal: row.subtotal_individual_centavos,
    economia: row.economia_centavos,
    total: row.total_centavos,
    local: row.local_entrega, quando: row.quando,

/* Mensagem de erro amigável (prompt, seção 40). */
function erroAmigavel(e){
  const m = String(e?.message || e || "");
  if (/Invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  if (/already registered|already been registered/i.test(m)) return "Já existe uma conta com este e-mail.";
  if (/Password should be/i.test(m)) return "A senha deve ter no mínimo 6 caracteres.";
  if (/duplicate key.*telefone/i.test(m)) return "Já existe uma conta com este WhatsApp.";
  if (/Estoque insuficiente|não está disponível|pedido está vazio|Horário inválido|local da entrega/i.test(m)) return m;
  if (/Failed to fetch|NetworkError/i.test(m)) return "Sem conexão com o servidor. Verifique sua internet.";
  return "Não conseguimos concluir agora. Tente novamente em alguns instantes.";
}

/* ---------- Engine de preços (espelho de src/lib/pricing/) ---------- */
function precificar(){
  const linhas = Object.entries(S.carrinho).filter(([,q])=>q>0).map(([id,q])=>{
    const p = byId(id);
    return { id, unit:p.unit, dupla:p.dupla, q };
  });
  const cones = linhas.reduce((s,l)=>s+l.q,0);
  const subtotal = linhas.reduce((s,l)=>s+l.unit*l.q,0);
  const somaDupla = linhas.reduce((s,l)=>s+l.dupla*l.q,0);
  let ajuste = 0, imparId = null;
  if (cones % 2 === 1){
    const m = linhas.reduce((min,l)=>{
      const d = l.unit - l.dupla;
      return d < min.d ? {d, id:l.id} : min;
    }, {d:Infinity, id:null});
    ajuste = m.d; imparId = m.id;
  }
  const total = somaDupla + ajuste;
  return {
    total, subtotal, economia: subtotal - total, cones,
    linhas: linhas.map(l => ({...l, efetivo: l.dupla*l.q + (l.id===imparId ? ajuste : 0)}))
  };
}

/* ============================================================
   TELEFONE / WHATSAPP
   Guardamos apenas os dígitos; a máscara é só apresentação.
   Para o Supabase Auth, o número vira um "apelido de e-mail"
   (ex.: 5511999998888@cones.local) — assim o cliente entra com
   WhatsApp e senha, sem SMS, sem código e sem custo.
   ============================================================ */
function digitos(v){ return String(v||"").replace(/\D/g, ""); }

function mascaraTelefone(v){
  const d = digitos(v).slice(0, 11);
  if (d.length <= 2)  return d.length ? "(" + d : "";
  if (d.length <= 6)  return `(${d.slice(0,2)}) ${d.slice(2)}`;
  if (d.length <= 10) return `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}`;
  return `(${d.slice(0,2)}) ${d.slice(2,3)} ${d.slice(3,7)}-${d.slice(7)}`;
}
/* Aplica a máscara enquanto o usuário digita, preservando o cursor no fim. */
function aoDigitarTelefone(input){
  const posFim = input.selectionStart === input.value.length;
  input.value = mascaraTelefone(input.value);
  if (posFim) input.setSelectionRange(input.value.length, input.value.length);
}
function telefoneValido(v){
  const d = digitos(v);
  return d.length === 10 || d.length === 11;
}
/* Identificador estável usado no Supabase Auth. */
function emailApelido(telefone){
  return "55" + digitos(telefone) + "@cones.local";

function iniciais(nome){
  const p = String(nome||"").trim().split(/\s+/).filter(Boolean);

/* ============================================================
   NOTIFICAÇÕES NATIVAS DO SISTEMA (prompt, seção 16.B)
   Aparecem por cima de qualquer aba ou aplicativo, desde que
   esta aba continue aberta em algum lugar e o navegador rodando.
   ============================================================ */
const notifSuportado = () => typeof window!=="undefined" && "Notification" in window;

/* ---- PERSONALIZAÇÃO DA NOTIFICAÇÃO — edite só aqui ----
   {numero} {cliente} {total} {local} {quando} são substituídos automaticamente. */
const NOTIF_TEXTO = {
  icone: "/icon-192.png",                       // miniatura exibida na notificação
  titulo: "🍦 Novo pedido — Cones da Casa",
  corpo: "Pedido #{numero} · {cliente}\n{total} · Entrega: {local} · Receber: {quando}",
};
function montarTexto(modelo, dados){
  return String(modelo).replace(/\{(\w+)\}/g, (_, k) => dados[k] ?? "");
}
const notifPermissao = () => notifSuportado() ? Notification.permission : "unsupported";

function notifLog(msg){
  S.notif.log.unshift(new Date().toLocaleTimeString("pt-BR") + " — " + msg);
  S.notif.log = S.notif.log.slice(0, 6);
}
async function ativarNotificacoes(){
  if (!notifSuportado()){ notifLog("Este navegador não suporta notificações."); return render(); }
  destravarSom();
  if (Notification.permission === "denied"){
    notifLog("Permissão bloqueada pelo navegador — reative no cadeado da barra de endereço.");
    return render();
  }
  const r = Notification.permission === "granted" ? "granted" : await Notification.requestPermission();
  S.notif.ativo = (r === "granted");
  notifLog(r === "granted" ? "Notificações ativadas." : "Permissão não concedida (" + r + ").");
  render();
}
function desativarNotificacoes(){
  S.notif.ativo = false;
  notifLog("Notificações desativadas neste painel (a permissão do navegador continua concedida).");
  render();
}
function notificarNativo({ titulo, corpo, tag, aoClicar }){
  if (!S.notif.ativo || notifPermissao() !== "granted") return false;
  try {
    const n = new Notification(titulo, {
      body: corpo,
      icon: NOTIF_TEXTO.icone,  // miniatura do cone (no macOS aparece ao lado do texto)
      badge: NOTIF_TEXTO.icone,
      tag,                      // substitui a anterior de mesma tag em vez de empilhar
      requireInteraction: true, // permanece na tela até ser fechada (Chrome/Edge)
      silent: false,
    });
    n.onclick = () => { window.focus(); n.close(); if (aoClicar) aoClicar(); };
    if (S.notif.som) tocarAlerta();
    return true;
  } catch (e) {
    notifLog("Falha ao exibir a notificação: " + e.message);
    return false;
  }
}
/* Som curto gerado no próprio navegador — sem arquivo externo.
   Navegadores exigem uma interação anterior do usuário, por isso o destravamento. */
let audioCtx = null;
function destravarSom(){
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch { /* sem áudio disponível */ }
}
function tocarAlerta(){
  if (!audioCtx) return;
  try {
    const t = audioCtx.currentTime;
    [880, 1180].forEach((hz, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = hz; o.type = "sine";
      g.gain.setValueAtTime(0.0001, t + i*0.16);
      g.gain.exponentialRampToValueAtTime(0.22, t + i*0.16 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + i*0.16 + 0.15);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t + i*0.16); o.stop(t + i*0.16 + 0.16);
    });
  } catch { /* silencioso */ }
}
function testarNotificacao(atrasoSeg = 0){
  if (notifPermissao() !== "granted" || !S.notif.ativo){

  const disparar = () => {

    render();

  if (atrasoSeg > 0){
    notifLog(`Teste agendado para ${atrasoSeg}s — troque de aba ou de aplicativo agora.`);
    render();
    setTimeout(disparar, atrasoSeg * 1000);

}

/* ---------- Pedido (espelho de src/lib/data/pedidos.ts) ---------- */
async function confirmarPedido(){
  const c = S.checkout;
  c.erro = null;
  if (!S.perfil){ S.voltarPara = "checkout"; return nav("login"); }
  if (!c.local.trim()){ c.erro = "Informe o local da entrega dentro da empresa."; return render(); }
  if (c.quando==="horario"){
    if (!/^\d{2}:\d{2}$/.test(c.hora)){ c.erro="Escolha um horário válido."; return render(); }
    const [h,m] = c.hora.split(":").map(Number);
    const alvo = new Date(); alvo.setHours(h,m,0,0);
    const diff = (alvo - new Date())/60000;
    if (diff < 0){ c.erro="Esse horário já passou. Escolha um horário mais tarde."; return render(); }
    if (diff < ANTECEDENCIA_MIN){ c.erro=`Precisamos de pelo menos ${ANTECEDENCIA_MIN} minutos para preparar seu pedido.`; return render(); }
  }

  const itens = Object.entries(S.carrinho)
    .filter(([,q]) => q > 0)
    .map(([produto_id, quantidade]) => ({ produto_id, quantidade }));
  if (itens.length === 0){ c.erro = "Seu carrinho está vazio."; return render(); }

  // A chave de idempotência nasce aqui: duplo clique não gera dois pedidos.
  if (!c.idem) c.idem = crypto.randomUUID();

  const { data, error } = await sb.rpc("place_order", {
    p_itens: itens,
    p_local: c.local.trim(),
    p_quando: c.quando === "agora" ? "agora" : c.hora,
    p_idempotency_key: c.idem,
  });

  if (error){
    c.erro = erroAmigavel(error);
    c.idem = null;                      // permite nova tentativa
    await carregarCatalogo();           // reflete estoque que mudou
    return render();
  }

  const linha = Array.isArray(data) ? data[0] : data;
  S.carrinho = {};
  await Promise.all([carregarCatalogo(), carregarPedidos()]);
  nav("confirmado", linha.numero);
}

async function fazerLogin(){
  if (S.ocupado) return;
  const email = document.getElementById("l-email").value.trim().toLowerCase();
  const senha = document.getElementById("l-senha").value;
  if (!email || !senha){ S.loginErro="Informe e-mail e senha."; return render(); }
  if (!emailValido(email)){ S.loginErro="Digite um e-mail válido."; return render(); }
  S.ocupado = true; S.loginErro = null; render();
  const { error } = await sb.auth.signInWithPassword({ email, password: senha });
  S.ocupado = false;
  if (error){ S.loginErro = erroAmigavel(error); return render(); }
  await carregarPerfil();
  await Promise.all([carregarPedidos(), carregarFidelidade()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}
async function recuperarSenha(){
  const email = document.getElementById("l-email").value.trim().toLowerCase();
  if (!emailValido(email)){
    S.loginErro = "Digite seu e-mail no campo acima para receber o link de recuperação.";
    return render();
  }
  S.loginErro = null;
  await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
  alert("Se existir uma conta com " + email + ", enviaremos um link para redefinir a senha.\n\nConfira também a caixa de spam.");
}
async function fazerCadastro(){
  if (S.ocupado) return;
  const nome  = document.getElementById("r-nome").value.trim();
  const email = document.getElementById("r-email").value.trim().toLowerCase();
  const tel   = document.getElementById("r-tel").value.trim();
  const senha = document.getElementById("r-senha").value;
  const conf  = document.getElementById("r-conf").value;
  if (!nome){ S.cadastroErro="Informe seu nome."; return render(); }
  if (!emailValido(email)){ S.cadastroErro="Digite um e-mail válido — é por ele que você recupera a senha."; return render(); }
  if (!telefoneValido(tel)){ S.cadastroErro="Digite o WhatsApp com DDD — 10 ou 11 dígitos."; return render(); }
  if (senha.length<6){ S.cadastroErro="A senha deve ter no mínimo 6 caracteres."; return render(); }
  if (senha!==conf){ S.cadastroErro="As senhas não coincidem."; return render(); }

  S.ocupado = true; S.cadastroErro = null; render();
  const { error } = await sb.auth.signUp({
    email, password: senha,
    options: { data: { nome, telefone: mascaraTelefone(tel) } },
  });
  S.ocupado = false;
  if (error){ S.cadastroErro = erroAmigavel(error); return render(); }

  // Se a confirmação de e-mail estiver ligada, não há sessão ainda.
  const { data:{ session } } = await sb.auth.getSession();
  if (!session){
    S.loginErro = "Conta criada! Confirme seu e-mail e depois entre.";
    return nav("login");
  }
  await carregarPerfil();
  await Promise.all([carregarPedidos(), carregarFidelidade()]);
  const v = S.voltarPara || "home"; S.voltarPara = null; nav(v);
}
async function sair(){
  await sb.auth.signOut();
  S.perfil = null; S.pedidos = []; S.fidelidade = { total:0, historico:[] };
  nav("home");
}
async function salvarPerfil(){
  const nome  = document.getElementById("c-nome").value.trim();
  const tel   = document.getElementById("c-tel").value.trim();
  const email = document.getElementById("c-mail").value.trim();
  if (!nome){ alert("Informe seu nome."); return; }
  const { error } = await sb.from("profiles")
    .update({ nome, telefone: mascaraTelefone(tel), email })
    .eq("id", S.perfil.id);
  if (error){ alert(erroAmigavel(error)); return; }
  Object.assign(S.perfil, { nome, tel: mascaraTelefone(tel), email });
  const aviso = document.getElementById("salvo-ok");

  render();
}

/* Réplica em código do cartão físico da conezyn. */
function cartaoFidelidade(carimbos, nome){
  const noCartao  = carimbos % META_CARIMBOS;
  const completos = Math.floor(carimbos / META_CARIMBOS);
  const faltam    = META_CARIMBOS - noCartao;

  const selos = Array.from({ length: META_CARIMBOS }, (_, i) => {
    const premio  = i === META_CARIMBOS - 1;
    const marcado = i < noCartao;
    if (marcado) return `<span class="fid-selo">${svgCone({ recheio:"#471C76", casquinha:"#471C76", mais:premio })}</span>`;
    if (premio)  return `<span class="fid-selo">${svgCone({ mais:true })}</span>`;
    return `<span class="fid-selo"></span>`;
  }).join("");

  return `<div class="fid" role="img" aria-label="Cartão fidelidade: ${noCartao} de ${META_CARIMBOS} carimbos">
    <svg class="fid-onda" viewBox="0 0 400 80" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 0 H400 V26 C330 58 300 6 232 22 C150 42 120 4 44 26 C28 31 12 32 0 30 Z" fill="#3A1267"/>
    </svg>
    <span class="fid-cone-bg e">${svgCone({ recheio:"currentColor", casquinha:"currentColor" })}</span>
    <span class="fid-cone-bg d">${svgCone({ recheio:"currentColor", casquinha:"currentColor" })}</span>

    <p class="fid-topo">${esc(nome || "Nome")} <span class="fid-badge">Coneiro</span></p>
    <p class="fid-titulo">Complete e ganhe <strong>um conezyn</strong></p>

    <div class="fid-grade">${selos}</div>

    <p class="fid-progresso">
      <strong>${noCartao}/${META_CARIMBOS}</strong> —
      ${carimbos === 0
        ? "seu primeiro cone entregue já vale um carimbo"
        : faltam === META_CARIMBOS
          ? "cartão novo começando"
          : `faltam ${faltam} ${faltam === 1 ? "cone" : "cones"}`}
      ${completos > 0 ? `<br><span style="color:#EB791C;font-weight:800">🏆 ${completos} ${completos === 1 ? "cartão completo" : "cartões completos"} para resgatar</span>` : ""}
    </p>

    <p class="fid-rodape">Siga <strong>@conezyn</strong> no Instagram</p>
  </div>`;
}

/* ---------- Render ---------- */
async function mudarStatus(id, status){
  const { error } = await sb.from("orders").update({ status }).eq("id", id);
  if (error){ alert(erroAmigavel(error)); return; }
  const p = S.pedidos.find(x => x.id === id);
  if (p) p.status = status;
  render();
  if (status === "Entregue" || status === "Cancelado"){
    await Promise.all([carregarCatalogo(), carregarFidelidade()]);
    render();
  }
}

async function enviarSugestao(){
  const campo = document.getElementById("sug");
  const texto = campo ? campo.value.trim() : "";
  if (texto.length < 3) return;
  if (!S.perfil){ S.voltarPara = "home"; return nav("login"); }
  const { error } = await sb.from("suggestions")
    .insert({ cliente_id: S.perfil.id, texto });
  if (error){ alert(erroAmigavel(error)); return; }
  S.sugestaoOk = true; render();
}

/* Avaliação: o banco só aceita de quem recebeu o produto. */
async function enviarAvaliacao(produtoId, nota, comentario){
  if (!S.perfil){ S.voltarPara = "produto"; return nav("login"); }
  const { error } = await sb.from("reviews").upsert({
    produto_id: produtoId, cliente_id: S.perfil.id,
    nota, comentario: comentario || null,
  }, { onConflict: "produto_id,cliente_id" });
  if (error){ alert(erroAmigavel(error)); return; }
  await carregarCatalogo();
  fecharModal(); render();
}

let canalPedidos = null;
function ligarTempoReal(){
  if (canalPedidos || !S.perfil?.admin) return;
  canalPedidos = sb.channel("pedidos-admin")
    .on("postgres_changes",
        { event: "INSERT", schema: "public", table: "orders" },
        async () => {
          const antes = new Set(S.pedidos.map(p => p.id));
          await carregarPedidos();
          const novo = S.pedidos.find(p => !antes.has(p.id));
          if (novo) notificarAdmin(novo);
          render();
        })
    .on("postgres_changes",
        { event: "UPDATE", schema: "public", table: "orders" },
        async () => { await carregarPedidos(); render(); })
    .subscribe();
}

async function carregarAdmin(){
  if (!S.perfil?.admin) return;
  const [prod, avs, sug] = await Promise.all([
    sb.from("products").select("*, categories(nome, slug)").order("nome"),
    sb.from("reviews").select("*, products(nome), profiles(nome)").order("criado_em", { ascending:false }),
    sb.from("suggestions").select("*, profiles(nome, telefone)").order("criado_em", { ascending:false }),
  ]);
  if (!prod.error) S.admin.produtos  = prod.data || [];
  if (!avs.error)  S.admin.avaliacoes = avs.data || [];
  if (!sug.error)  S.admin.sugestoes  = sug.data || [];
  S.admin.carregado = true;
}

/* ---------- Estoque e cadastro de produtos ---------- */
async function salvarCampoProduto(id, campo, valor){
  const { error } = await sb.from("products")
    .update({ [campo]: valor, atualizado_em: new Date().toISOString() }).eq("id", id);
  if (error){ alert(erroAmigavel(error)); return false; }
  const p = S.admin.produtos.find(x => x.id === id);
  if (p) p[campo] = valor;
  await carregarCatalogo();
  render();
  return true;
}
async function ajustarEstoque(id, delta){
  const p = S.admin.produtos.find(x => x.id === id);
  if (!p) return;
  await salvarCampoProduto(id, "estoque", Math.max(0, (p.estoque || 0) + delta));
}
async function definirEstoque(id, valor){
  const n = Math.max(0, parseInt(valor, 10) || 0);
  await salvarCampoProduto(id, "estoque", n);
}
async function definirPreco(id, campo, valorReais){
  const centavos = Math.round(parseFloat(String(valorReais).replace(",", ".")) * 100);
  if (!Number.isFinite(centavos) || centavos < 0){ alert("Valor inválido."); return; }
  const p = S.admin.produtos.find(x => x.id === id);
  const unit  = campo === "preco_unitario_centavos" ? centavos : p.preco_unitario_centavos;
  const dupla = campo === "preco_dupla_centavos"    ? centavos : p.preco_dupla_centavos;
  if (dupla > unit){ alert("O preço em dupla não pode ser maior que o unitário."); render(); return; }
  await salvarCampoProduto(id, campo, centavos);
}
async function zerarTodoEstoque(){
  if (!confirm("Zerar o estoque de TODOS os sabores? Eles ficarão como Esgotado no site.")) return;
  const { error } = await sb.from("products").update({ estoque: 0 }).gt("estoque", -1);
  if (error){ alert(erroAmigavel(error)); return; }
  await Promise.all([carregarAdmin(), carregarCatalogo()]);
  render();
}

        ${aguardando
          ? `<button class="btn" style="background:var(--pistache);color:#fff;min-height:2.2rem;padding:.3rem .9rem;font-size:.78rem"
               onclick="moderarAvaliacao('${a.id}',true)">Aprovar</button>`
          : `<button class="btn btn-ghost" style="min-height:2.2rem;padding:.3rem .9rem;font-size:.78rem"
               onclick="moderarAvaliacao('${a.id}',false)">Despublicar</button>`}
        <button class="btn" style="background:var(--framboesa);color:#fff;min-height:2.2rem;padding:.3rem .9rem;font-size:.78rem"
          onclick="excluirAvaliacao('${a.id}')">Excluir</button>
      </span>
    </div>
  </div>`;

  return `<div style="display:flex;flex-direction:column;gap:1.25rem">
    <div>
      <h1 class="display" style="font-size:1.5rem;font-weight:900">Avaliações</h1>
      <p class="muted" style="font-size:.875rem">
        Só quem comprou e recebeu o produto consegue avaliar. Nada aparece na loja antes de você aprovar.</p>
    </div>

    <section aria-labelledby="a-pend">
      <h2 id="a-pend" class="display" style="font-size:1.1rem;font-weight:700">
        Aguardando aprovação ${pend.length?`(${pend.length})`:""}</h2>
      ${pend.length===0
        ? `<p class="muted" style="margin-top:.5rem;font-size:.875rem">Nenhuma avaliação na fila. 👌</p>`
        : `<div style="display:flex;flex-direction:column;gap:.75rem;margin-top:.75rem">
            ${pend.map(a=>cartao(a,true)).join("")}</div>`}
    </section>

    <section aria-labelledby="a-pub">
      <h2 id="a-pub" class="display" style="font-size:1.1rem;font-weight:700">
        Publicadas ${pub.length?`(${pub.length})`:""}</h2>
      ${pub.length===0
        ? `<p class="muted" style="margin-top:.5rem;font-size:.875rem">Ainda não há avaliações publicadas.</p>`
        : `<div style="display:flex;flex-direction:column;gap:.75rem;margin-top:.75rem">
            ${pub.map(a=>cartao(a,false)).join("")}</div>`}
    </section>
  </div>`;
}

/* ---------- Sugestões ---------- */
async function mudarStatusSugestao(id, status){
  const { error } = await sb.from("suggestions").update({ status }).eq("id", id);
  if (error){ alert(erroAmigavel(error)); return; }
  const g = S.admin.sugestoes.find(x => x.id === id);
  if (g) g.status = status;
  render();
}

function vAdminSugestoes(){
  if (!S.admin.carregado) return `<p class="muted">Carregando sugestões...</p>`;
  const STATUS_SUG = ["Nova","Em análise","Implementada","Recusada"];
  const cor = { "Nova":"var(--casquinha)", "Em análise":"var(--cacau-claro)",
                "Implementada":"var(--pistache)", "Recusada":"var(--framboesa)" };
  return `<div style="display:flex;flex-direction:column;gap:1rem">
    <div>
      <h1 class="display" style="font-size:1.5rem;font-weight:900">Sugestões dos clientes</h1>
      <p class="muted" style="font-size:.875rem">O que pediram na seção “Tem alguma sugestão?” da loja.</p>
    </div>
    ${S.admin.sugestoes.length===0
      ? `<div class="card" style="padding:3rem 1.5rem;text-align:center">
          <p style="font-size:2.5rem" aria-hidden>💡</p>
          <p class="display" style="margin-top:.5rem;font-weight:900">Nenhuma sugestão ainda</p>
          <p class="muted" style="margin-top:.25rem;font-size:.875rem">Elas aparecem aqui assim que um cliente enviar.</p>
        </div>`
      : `<div style="display:flex;flex-direction:column;gap:.75rem">
          ${S.admin.sugestoes.map(g=>`<div class="card" style="padding:1rem">
            <p style="font-size:.9rem">“${esc(g.texto)}”</p>
            <div style="display:flex;flex-wrap:wrap;align-items:center;gap:.6rem;margin-top:.75rem;
                        border-top:1px solid rgb(62 39 35/.08);padding-top:.6rem">
              <span class="muted" style="font-size:.75rem;font-weight:600">
                ${esc(g.profiles?.nome || "Cliente")}${g.profiles?.telefone?` · ${esc(g.profiles.telefone)}`:""}</span>
              <span class="muted" style="font-size:.72rem">${new Date(g.criado_em).toLocaleDateString("pt-BR")}</span>
              <span style="margin-left:auto;display:flex;align-items:center;gap:.5rem">
                <span style="width:.6rem;height:.6rem;border-radius:9999px;background:${cor[g.status]}"></span>
                <select class="field" style="width:auto;padding:.3rem .6rem;border-radius:9999px;font-size:.78rem;font-weight:600"
                  onchange="mudarStatusSugestao('${g.id}', this.value)">
                  ${STATUS_SUG.map(x=>`<option ${g.status===x?"selected":""}>${x}</option>`).join("")}
                </select>
              </span>
            </div>
          </div>`).join("")}
        </div>`}
  </div>`;
}

function render(){
  if (S.carregando) { document.getElementById("app").innerHTML = vCarregando(); return; }
  if (S.erroBanco)  { document.getElementById("app").innerHTML = vErroBanco();  return; }
  if (S.perfil?.admin) ligarTempoReal();
  if (S.perfil?.admin && S.view === "admin" && !S.admin.carregado) carregarAdmin().then(render);
  const views = { home:vHome, produto:vProduto, carrinho:vCarrinho, checkout:vCheckout,
    confirmado:vConfirmado, login:()=>vLogin(false), cadastro:vCadastro, conta:vConta,
    pedidos:vPedidos, fidelidade:vFidelidade, admin:vAdmin };
  if (S.view!=="produto") pqv = 1;
  document.getElementById("app").innerHTML = (views[S.view]||vHome)();
  const sw = document.getElementById("switch-btn");
  sw.style.display = S.perfil?.admin ? "inline-flex" : "none";
  sw.textContent = S.view==="admin" ? "← Ver loja" : "Painel admin";
}
iniciar();
</script>
</body>
</html>
